plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    // Paper's own code (net.minecraft.*) for the assassin's clone, a player-shaped entity shown through packets (see combat/clone).
    // The jar for the server is the reobfuscated one (reobfJar).
    id("io.papermc.paperweight.userdev") version "1.7.1"
}

group = 'net.tkgon.mc'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    paperweight.paperDevBundle("1.20.4-R0.1-SNAPSHOT")
    // the brush tool (tools/brush) draws through FastAsyncWorldEdit so that //undo works; it is compiled against, never bundled (the server has the plugin)
    compileOnly("com.fastasyncworldedit:FastAsyncWorldEdit-Core:2.9.2") { transitive = false }
    compileOnly("com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit:2.9.2") { transitive = false }
    // tests run against the real item code of the server in the dev bundle (see src/test: the item patch keeps what is an item's own)
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
    testImplementation("org.mockito:mockito-core:5.11.0")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

// `test` (and so `build`) runs only the light tests; the ones that start the dev bundle's server code (tag "server") run with ./gradlew itemPatchTest
test {
    useJUnitPlatform {
        excludeTags 'server'
    }
}

tasks.register('itemPatchTest', Test) {
    description = 'The item patch on real items (the server code of the dev bundle).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'server'
    }
    // -PitemPatchData=<a copy of plugins/iruuRPG or the yml repository>: also run the patch over the server's own items
    systemProperty 'itemPatch.data', (project.findProperty('itemPatchData') ?: '')
    testLogging { showStandardStreams = true }
    outputs.upToDateWhen { false }
}

tasks {
    runServer {
        minecraftVersion("1.20.4")
    }
}

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

// which commit and when this jar was built, so that "is the new build the one running?" can be answered from the server (build-info.properties, read by BuildInfo)
def gitSha = providers.exec { commandLine('git', 'rev-parse', '--short=10', 'HEAD'); ignoreExitValue = true }.standardOutput.asText.map { it.trim() }.orElse('unknown')

// the server's own resource pack (src/main/resourcepack/server) is zipped into the jar as resourcepacks/server.zip (a reproducible zip, so its hash only changes when its files do)
tasks.register('serverResourcePack', Zip) {
    archiveFileName = 'server.zip'
    destinationDirectory = layout.buildDirectory.dir('generated-resourcepacks')
    from('src/main/resourcepack/server')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

processResources {
    dependsOn tasks.named('serverResourcePack')
    from(layout.buildDirectory.dir('generated-resourcepacks')) { into 'resourcepacks' }
    def props = [version: version]
    doFirst {
        def stamp = new File(layout.buildDirectory.get().asFile, 'generated-build-info')
        stamp.mkdirs()
        new File(stamp, 'build-info.properties').text = "commit=${gitSha.get() ?: 'unknown'}\nbuilt=${java.time.OffsetDateTime.now(java.time.ZoneId.of('Asia/Tokyo')).format(java.time.format.DateTimeFormatter.ofPattern('yyyy-MM-dd HH:mm'))}\n"
    }
    from(layout.buildDirectory.dir('generated-build-info'))
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.jar {
    archiveBaseName.set("iruuRPG")
}

// the jar the server loads is the remapped one (iruuRPG-<version>.jar); the other one (-dev) keeps Mojang names and is not for the server
tasks.assemble {
    dependsOn(tasks.reobfJar)
}
