# ダンジョン「アトラスの洞窟」の素材 (架空)。
# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
version: 4

items:
  crawler_shell:
    material: FLINT
    name: "岩ムシの殻"
    required-level: 1
    rarity: COMMON
    element: WHITE
    damage-kind: NONE
    attack-type: SPECIAL
    description:
      - "岩ムシの、硬い殻のかけら。"
  old_bone:
    material: BONE_MEAL
    name: "古い骨"
    required-level: 1
    rarity: COMMON
    element: WHITE
    damage-kind: NONE
    attack-type: SPECIAL
    description:
      - "洞窟のガイコツから崩れ落ちた、古い骨。"
  cave_silk:
    material: STRING
    name: "洞窟グモの糸"
    required-level: 1
    rarity: 1
    element: WHITE
    damage-kind: NONE
    attack-type: SPECIAL
    description:
      - "暗がりで光を返す、丈夫な糸。"
  boss_crystal:
    material: AMETHYST_SHARD
    name: "岩窟の結晶"
    required-level: 1
    rarity: 2
    element: ORANGE
    damage-kind: NONE
    attack-type: SPECIAL
    glint: true
    description:
      - "岩窟の主の体から取れた、橙色に光る結晶。"
  # 報酬の宝箱から出る装備
  cave_silk_hood:
    material: LEATHER_HELMET
    name: "洞窟糸のフード"
    required-level: 3
    rarity: 2
    element: WHITE
    damage-kind: NONE
    attack-type: SPECIAL
    color: "#5B5B6E"
    stats:
      max-hp: 40
      defense: 14
      move-speed: 3
    description:
      - "洞窟グモの糸で編んだ、軽くて丈夫なフード。"
  cave_king_axe:
    material: IRON_AXE
    name: "岩窟王の大斧"
    required-level: 5
    rarity: 3
    element: ORANGE
    damage-kind: PHYSICAL
    attack-type: MELEE
    glint: true
    stats:
      weapon-damage: 42
      strength: 14
      melee-damage: 18
      crit-chance: 8
      crit-damage: 25
    element-stats:
      damage:
        orange: 20
    description:
      - "岩窟の主が振るっていた、橙に光る大斧。"
      - "宝箱から、ごくまれに見つかる。"
  # 激レアの素材 (宝箱から 2%)。今後のクラフトなどで使う予定
  cave_heart:
    material: HEART_OF_THE_SEA
    name: "岩窟の心臓"
    required-level: 1
    rarity: 3
    element: ORANGE
    damage-kind: NONE
    attack-type: SPECIAL
    glint: true
    description:
      - "岩窟の奥深くで脈打っていた、橙色の結晶の塊。"
      - "とても珍しい素材。いつか何かに使えるかもしれない。"
  # 洞窟の弓兵が持つ遠距離の武器 (モブ専用の見た目。プレイヤーにはドロップしない)
  cave_shortbow:
    material: BOW
    name: "洞窟の短弓"
    required-level: 1
    rarity: COMMON
    element: WHITE
    damage-kind: PHYSICAL
    attack-type: RANGE
    stats:
      weapon-damage: 9
      range-damage: 6
    description:
      - "洞窟の弓兵が使う、粗末な短弓。"
