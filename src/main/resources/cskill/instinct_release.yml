# クラススキル定義: ギフテッドの「本能開放」(解放ノード4 / ホットキー F)
#
# 白いオーラをまとい、効果時間のあいだ、全ての攻撃が命中するたびに
# 「設置ダメージ × 設置ダメージ%」の裂傷が追加で発動する。
# 強化(解放ノード8)を解放済みなら、裂傷の数値が2倍になる。

id: instinct_release
name: "本能開放"

# 消費MP
cost: 50

# クールダウン秒数
cooldown: 40

description:
  - "白いオーラをまとい、10秒間、"
  - "全ての攻撃で裂傷が追加で発動する。"

values:
  # duration-seconds: 効果時間(秒)
  duration-seconds: 10
