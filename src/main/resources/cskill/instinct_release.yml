# クラススキル定義: レンジャーの「本能開放」(解放ノード4 / ホットキー F)
# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
version: 3
#
# 白いオーラをまとい、効果時間のあいだ強化状態になる:
# 通常攻撃は「威力70%の3連撃」になり、設置武器の攻撃も70%の3連撃になる。
# 強化(解放ノード8)を解放済みなら、発動して recast-delay-seconds 秒後から強化状態の間に、一度だけ再発動できる:
# 宙に浮いて動けなくなり (足もとに魔法陣、視野がせまくなる)、クリックすると sniper-charge-seconds 秒のチャージのあと、
# 高火力の一撃を大きな螺旋のビームで放つ。一撃を放つか sniper-seconds 秒たつと、地面に戻る。
# 効果中の通常の遠距離攻撃の見た目は変わらない (豪華な見た目は再発動のときだけ)。

id: instinct_release
name: "本能開放"

# 消費MP
cost: 50

# クールダウン秒数
cooldown: 40

description:
  - "白いオーラをまとい、10秒間、"
  - "通常攻撃と設置が、威力70%の3連撃になる。"

values:
  # duration-seconds: 効果時間(秒)
  duration-seconds: 10
  # 強化の再発動(狙撃): 発動から何秒後に使えるか / 狙撃の時間(秒) / チャージの秒数 / 浮く高さ / 一撃の倍率 / 射程
  recast-delay-seconds: 3
  sniper-seconds: 10
  sniper-charge-seconds: 1.2
  sniper-rise-blocks: 3
  sniper-damage-rate: 12.0
  sniper-range: 60
