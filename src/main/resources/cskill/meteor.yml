# クラススキル定義: メイジの「流星」(解放ノード4 / ホットキー F)
#
# 前方に魔法陣を描き、少しためてから、流星を次々に飛ばす。流星は流線を描いて前へ向かい、
# しばらくして近くに敵がいると、その敵へホーミングする。
# 遠距離武器(RANGE)を持っているときだけ使える。
# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
version: 6
#
# 強化(解放ノード8「流星・極」)を解放済みなら、流星が増え、撃ち切るまで自分もチャージを行い、
# 撃ち切った後に長く太いビームを放つ。
#
# 再発動: 発動から recast-delay-seconds 秒たち、recast-window-seconds 秒たつまでの間にもう一度キーを押すと (1回だけ)、
# 視線の先に印が出て、少しあとに大きな流星が1つ落ちる。流星1つの倍率の recast-damage-rate 倍の範囲ダメージ (半径 recast-radius)。
# 強化後は、その周りに小さな流星が4つ落ちる。流星が落ちた場所は、しばらく光が残る。
#
# 流星が当たった場所で爆ぜる: 周囲 blast-radius ブロックの敵 (当たった敵以外) に、
# 流星の威力の blast-share 倍の範囲ダメージ。

id: meteor
name: "流星"

# 消費MP
cost: 40

# クールダウン秒数
cooldown: 30

description:
  - "魔法陣を描き、少しためて流星を飛ばす。"
  - "流星は流線を描いて前へ進み、近くの敵にはホーミングする。遠距離武器が必要。"
  - "もう一度押すと、視線の先に大きな流星が落ちる(1回だけ)。"

values:
  # charge-ticks: 魔法陣を描いてためる時間 (20 = 1秒)
  charge-ticks: 16
  # count: 流星の数 / upgrade-count: 強化後の数
  count: 6
  upgrade-count: 12
  # fire-ticks / upgrade-fire-ticks: 流星を撃ち切るまでの時間 (流星の数で割った間隔で、続けて飛ばす。
  # 数が増えても、スキル全体の長さは変わらない)
  fire-ticks: 15
  upgrade-fire-ticks: 30
  # damage-rate: 流星1つの、通常の遠距離攻撃ダメージに対する倍率
  damage-rate: 1.95
  # speed: 流星の速さ (ブロック/秒)
  speed: 22
  # homing-radius: ホーミングする範囲 / homing-delay-ticks: 飛び出してからホーミングを始めるまで
  homing-radius: 8
  homing-delay-ticks: 7
  # max-ticks: 流星が飛び続ける最長の時間 / hit-radius: 当たりの大きさ
  max-ticks: 70
  hit-radius: 0.9
  # 強化: 撃ち切った後のビーム (beam-charge-ticks: そのためる時間)
  beam-charge-ticks: 30
  beam-damage-rate: 7.5
  beam-range: 26
  beam-radius: 1.2
  # 流星の爆発: 範囲(ブロック) / 与える割合 (0 でなし)
  blast-radius: 2.2
  blast-share: 0.35
  # 再発動: 使えるまで(秒) / 使える期間(発動からの秒) / 倍率(流星1つの何倍か) / 範囲 / 狙える距離
  recast-delay-seconds: 1.0
  recast-window-seconds: 8
  recast-damage-rate: 4.0
  recast-radius: 4.5
  recast-range: 28
