# クラススキル定義: 戦士の「武神の一撃」(解放ノード4 / ホットキー F)
# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
version: 3
#
# 稲妻をまとい、効果時間のあいだ「与えたダメージで回復する」状態になる (単体に雷を落とすスキルから変わった):
#   - 戦士が与えるダメージ (通常攻撃・コンボ・雷のすべて) の lifesteal の割合が、体力として戻る。
#   - bolt-interval-ticks ごとに、bolt-range ブロック以内でいちばん近い敵へ雷が落ちる
#     (威力は武器のダメージ × bolt-rate。周囲 splash-radius ブロックの敵に bolt-splash-share 倍の範囲ダメージと、1.5 秒の強い鈍足)。
#   雷そのもののダメージが出て、そのダメージでも回復する。
# 武器を持っているときに使える (近接でも遠距離でも)。効果時間には「効果時間」ステータスが乗る。
# 強化(解放ノード8「武神の一撃・極」)を解放済みなら、効果時間・吸血・雷の威力が上がり、演出も大きくなる。

id: warrior_strike
name: "武神の一撃"

# 消費MP
cost: 30

# クールダウン秒数。tickで書きたい場合は cooldown-ticks を使う。
cooldown: 20

description:
  - "稲妻をまとう。8秒間、与えたダメージの一部が体力として戻る。"
  - "近くの敵へ雷が落ち続け、その雷のダメージでも回復する。"

values:
  # duration-seconds: 効果時間(秒) / upgrade-duration-seconds: 強化後
  duration-seconds: 8
  upgrade-duration-seconds: 12
  # lifesteal: 与えたダメージのうち体力として戻る割合 (0.08 = 8%) / upgrade-lifesteal: 強化後
  lifesteal: 0.08
  upgrade-lifesteal: 0.14
  # 雷: 落ちる間隔(tick。20tick=1秒) / 狙う距離(ブロック) / 武器のダメージに対する倍率 (強化後は upgrade-bolt-rate)
  bolt-interval-ticks: 14
  bolt-range: 7
  bolt-rate: 0.6
  upgrade-bolt-rate: 0.9
  # 雷の衝撃: 範囲(ブロック) / 与える割合
  splash-radius: 3.5
  bolt-splash-share: 0.2
