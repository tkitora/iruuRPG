# クラススキル定義: 戦士の「武神の一撃」(解放ノード4 / ホットキー F)
# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
version: 4
#
# 稲妻をまとい、効果時間のあいだ「与えたダメージで回復する」状態になる:
#   - 戦士が与えるダメージ (通常攻撃・コンボ・雷のすべて) の lifesteal の割合が、体力として戻る。
#   - 戦士が敵に攻撃を命中させるたびに、その敵から「チェインライトニング」が走る (自動で雷が落ちることはない):
#     chain-range ブロック以内の、まだ触れていない最も近い敵へ、2 tick ごとに飛び移る (3回。強化後は4回)。
#     1回目の威力は 武器のダメージ × bolt-rate、飛ぶたびに chain-decay 倍になる。0.35 秒に1回まで。
#   雷のダメージでも回復する。雷が当てた敵から、さらに雷は出ない。
# 武器を持っているときに使える (近接でも遠距離でも)。効果時間には「効果時間」ステータスが乗る。
# 強化(解放ノード8「武神の一撃・極」)を解放済みなら、効果時間・吸血・雷の威力が上がり、演出も大きくなる。

id: warrior_strike
name: "武神の一撃"

# 消費MP
cost: 30

# クールダウン秒数。tickで書きたい場合は cooldown-ticks を使う。
cooldown: 20

description:
  - "稲妻をまとう。8秒間、与えたダメージの一部が体力として戻る。"
  - "攻撃を当てた敵から、近くの敵へ雷が連鎖し、その雷のダメージでも回復する。"

values:
  # duration-seconds: 効果時間(秒) / upgrade-duration-seconds: 強化後
  duration-seconds: 8
  upgrade-duration-seconds: 12
  # lifesteal: 与えたダメージのうち体力として戻る割合 (0.08 = 8%) / upgrade-lifesteal: 強化後
  lifesteal: 0.08
  upgrade-lifesteal: 0.14
  # 雷: 1回目の武器のダメージに対する倍率 (強化後は upgrade-bolt-rate) / 連鎖の飛び移る距離(ブロック) / 飛ぶたびに掛かる倍率
  bolt-rate: 0.6
  upgrade-bolt-rate: 0.9
  chain-range: 6
  chain-decay: 0.75
