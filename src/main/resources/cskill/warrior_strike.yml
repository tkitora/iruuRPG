# クラススキル定義: 戦士の「武神の一撃」(解放ノード4 / ホットキー F)
#
# 前方の敵の頭上へ、黄色い粉のパーティクルで描いた雷を落とす。
# 近接武器(MELEE)を持っているときだけ使える。
# 近接範囲攻撃化(解放ノード2)を解放済みなら、周囲の敵にも範囲率(65%)で当たる。
# 強化(解放ノード7「武神の一撃・極」)を解放済みなら2段階ヒットになる。

id: warrior_strike
name: "武神の一撃"

# 消費MP
cost: 30

# クールダウン秒数。tickで書きたい場合は cooldown-ticks を使う。
cooldown: 20

description:
  - "前方の敵の脳天へ雷を落とし、武器ダメージの3倍で叩き割る。"

values:
  # range: 対象を探す距離(ブロック)
  range: 6.0
  # damage-rate: 通常攻撃ダメージに対する倍率
  damage-rate: 3.0
  # 強化(2段階ヒット)時の1段目・2段目の倍率。2段目は演出も大きくなる (合計6.5倍)
  upgrade-first-rate: 2.5
  upgrade-second-rate: 4.0
  # 1段目から2段目までの間隔(tick。20tick=1秒)
  upgrade-delay-ticks: 8
