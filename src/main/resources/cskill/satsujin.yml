# クラススキル定義: アサシンの「SATUJIN」(解放ノード4 / ホットキー F)
# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
version: 2
#
# 最後に攻撃した敵の背後へ瞬間移動し、混乱を100与え、持っている武器で通常攻撃を1回行う
# (通常攻撃のクールタイムは発生しない)。
# 強化(解放ノード8)を解放済みなら、同じ攻撃を最大9回、対象が死ぬまで繰り返す。
# 最後に、敵がまだ生きていれば蹴り飛ばす: 敵は前へ、自分は斜め後ろ (後ろと上) へ跳ね飛ぶ。

id: satsujin
name: "SATUJIN"

# 消費MP
cost: 40

# クールダウン秒数
cooldown: 20

description:
  - "最後に攻撃した敵の背後へ瞬間移動し、混乱を与えて攻撃する。"
  - "通常攻撃のクールタイムは発生しない。"
  - "最後に敵を蹴り飛ばし、自分は斜め後ろへ跳ね飛ぶ。"

values:
  # target-memory-seconds: 最後に攻撃した敵を覚えている時間(秒)
  target-memory-seconds: 15
  # max-distance: 移動できる最大距離(ブロック)
  max-distance: 40
  # confusion: 与える混乱の量 (100で行動停止)
  confusion: 100
  # upgrade-repeats: 強化後に追加で繰り返す回数 / upgrade-interval-ticks: その間隔(tick)
  upgrade-repeats: 9
  upgrade-interval-ticks: 3
  # 最後の蹴り: 敵の飛ぶ強さ / 敵の浮く強さ / 自分の後ろへの強さ / 自分の上への強さ (0にすると、その動きはなし)
  kick-enemy-power: 1.2
  kick-enemy-lift: 0.35
  kick-self-power: 1.0
  kick-self-lift: 0.6
