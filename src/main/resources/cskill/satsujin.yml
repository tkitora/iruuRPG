# クラススキル定義: アサシンの「SATUJIN」(解放ノード4 / ホットキー F)
# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
version: 8
#
# 効果時間のあいだ続く「コンボ強化」 (近接武器が必要):
#   - 発動の瞬間、立っているクローンはすべて消え、前方 (正面と左右32°) に赤い縁取りのクローンが3体飛ぶ。
#     クローンは、アサシンの次の攻撃を5回までコピーして (敵に向き直って、1回ごとに武器の5%のダメージ)、5回目で消える。
#   - 効果中、一撃で最大体力の40%以上のダメージを受けるとき、クローンが残っていれば、すべて壊れてそのダメージを無効にする。
#   - 強攻撃1は、跳ね返る手裏剣を、前の3方向に飛ばす。
#   - コンボのエフェクトは、赤と黒を基調にしたものに変わる。
#   - 技のダメージが 20% 増える (強化後は 35%)。
#   - 通常攻撃が速くなる (class-effects.assassin.frenzy-attack-speed、攻撃速度 +40%)。
#   - 通常攻撃のとき、届かない敵のところへ「分身」が踏み込んで斬る (本人は瞬間移動しない。カメラが揺れるため)。
#   - 通常攻撃のたびに、少しあとに「影」が周囲を 40% で斬る (一時的な範囲攻撃)。
#   - 発動した場所から半径15ブロック (class-effects.assassin.frenzy-radius) より外には出られない (近づくと縁が赤く見える)。
#   - 強攻撃0は、クローンを作らず、前方へのダッシュになる (上下には動かない)。通ったところに武器の3%のダメージ、クールタイムは2 tick。
#   - 状態異常 (混乱など) が、当たるたびに入る (通常は1回の攻撃につき1回)。
# 効果中にもう一度キーを押すと (recast-delay-seconds 秒たってから)、効果が終わり、クローンが一度でもダメージを与えた敵に、
#   効果中に与えたダメージの echo-share (10%) を返す: その30%は、横一線の斬撃を6回ランダムな向きに、そのあと70%は、
#   アサシンに対して真横に、幅の広い細い斬撃を1本 (最大8体、クローンを使った高品質の演出)。
# 強化(解放ノード8)を解放済みなら、効果時間と上がり幅が大きくなる。

id: satsujin
name: "SATUJIN"

# 消費MP
cost: 40

# クールダウン秒数
cooldown: 20

description:
  - "影をまとう。8秒間、アサシンのコンボが強くなる。"
  - "前に3体のクローンが飛び、攻撃を5回までコピーする。"
  - "一撃で最大体力の40%以上を受けると、クローンが身代わりになる。"
  - "発動地点から半径15ブロックの外には出られない。強0は前方ダッシュになる。"
  - "もう一度押すと、クローンが傷つけた敵に、与えたダメージの10%を斬撃で返す。"

values:
  # duration-seconds: 効果時間(秒) / upgrade-duration-seconds: 強化後 (「効果時間」ステータスが乗る)
  duration-seconds: 8
  upgrade-duration-seconds: 12
  # 再発動できるまでの秒数 / 返すダメージの割合
  recast-delay-seconds: 1.5
  echo-share: 0.10
