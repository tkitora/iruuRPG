# クラススキル定義: メイジの「氷槍」(解放ノード4 / ホットキー F)
# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
version: 2
#
# 前方へ青い粉の氷の槍を放ち、一直線上の敵をすべて貫通する。
# 当たった敵は移動速度が下がる。
# 遠距離武器(RANGE)を持っているときだけ使える。
# 強化(解放ノード7「氷槍・極」)を解放済みなら、当たった敵は完全に停止する。
#
# 槍が飛びきった先で砕け散る: 周囲 shatter-radius ブロックの (槍に貫かれなかった) 敵に、
# 威力の shatter-share 倍のダメージと、鈍足 (槍の半分の時間) が入る。

id: ice_lance
name: "氷槍"

# 消費MP
cost: 40

# クールダウン秒数
cooldown: 15

description:
  - "前方へ氷の槍を放ち、一直線上の敵を貫く。"
  - "当たった敵は、しばらく動きが遅くなる。遠距離武器が必要。"

values:
  # range: 槍が飛ぶ距離(ブロック)。壁にぶつかると止まる
  range: 18.0
  # width: 当たり判定の太さ
  width: 0.9
  # damage-rate: 通常の遠距離攻撃ダメージに対する倍率
  damage-rate: 3.5
  # slow-percent: 当たった敵の移動速度低下(%)
  slow-percent: 50
  # slow-seconds: 低下の持続秒数
  slow-seconds: 7
  # upgrade-slow-percent: 強化後。100以上で完全停止
  upgrade-slow-percent: 999
  # 砕け散り: 範囲(ブロック) / 与える割合 (0 でなし)
  shatter-radius: 3.0
  shatter-share: 0.3
