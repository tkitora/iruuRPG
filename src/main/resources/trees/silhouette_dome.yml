# 見本の木: 樹形 傘 (藤) (ユーザーの送った木の生成の作り方。パレットもその標準) (プロシージャルツールの読み込み、または /proceduraltool load silhouette_dome)
settings:
  kind: tree
  algorithm: silhouette
  sil-shape: 4
  sil-height: 0
  seed: 0
