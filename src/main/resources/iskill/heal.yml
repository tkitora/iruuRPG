# アイテムスキル設定: heal / 回復
#
# cost/cooldown/duration/lore/values の意味は iskill/sweep.yml を参照。

id: heal
name: "回復"

melee:
  enabled: true
  trigger: "右クリック"
  description:
    - "自身のHPを最大HPの10%回復する。"
  cost: 15
  cooldown: 10
  values:
    # heal-rate: 最大HPに対する回復割合。0.10 = 10%
    heal-rate: 0.10

range:
  enabled: true
  trigger: "シフト右クリック"
  description:
    - "周囲5ブロックの味方を回復する。"
  cost: 20
  cooldown: 12
  values:
    # radius: 回復範囲の半径
    radius: 5.0
    # heal-rate: 最大HPに対する回復割合。0.07 = 7%
    heal-rate: 0.07

deploy:
  enabled: true
  trigger: "パッシブ"
  description:
    - "攻撃せず、味方の回復に徹する。"
  lore:
    - "本来の通常ダメージを基準に、範囲内プレイヤーを回復。"
  duration: 10
  values:
    # radius: 設置回復範囲の半径
    radius: 6.0
    # attack-period-ticks: 何tickごとに回復するか。攻撃速度ステータスで短縮される
    attack-period-ticks: 40
    # heal-rate: 本来与えるダメージに掛ける回復倍率。0.10 = 1/10
    heal-rate: 0.10
