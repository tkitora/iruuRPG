# インスタンスダンジョンの定義 (1ファイル = 1ダンジョン)。
#
# 入るたびに、テンプレートワールド dungeon_template_<id> を丸ごとコピーして、
# そのプレイヤー専用のワールドを作る。座標は、テンプレートとコピーで同じ。
# 作り方 (op): いちばん簡単なのは /dungeon edit cave (エディターモード。ホットバーの道具をクリックして設定)
# コマンドで設定する場合:
#   /dungeon build cave             テンプレートワールドへ移動 (無ければ空のワールドを作る)
#   建築する → /dungeon entry cave  今の位置を入口にする
#   /dungeon spawn cave cave_crawler 今の位置にモブを置く (何体でも。cave_crawler / cave_bones / cave_spider / cave_boss)
#   /dungeon spawn cave cave_bones 35 出る確率 35% で置く (エディターでは、モブ一覧の右下で 5% 刻みに決める)
#                                   確率のモブが出た回は、ボス部屋に必要な討伐数が 1 体ずつ増える (ボスはいつも出る)
#   /dungeon exit cave              今の位置を脱出口にする (最初から見えるが、ボスを倒すまで出られない)
#   /dungeon boss cave cave_boss    このモブが倒れたらクリア (置いたモブの中に必要)
#   /dungeon rewardroom cave        今の位置を報酬部屋にする (クリアの5秒後に全員ここへ移動)
#   /dungeon chest cave             見ている宝箱 (なければ足元) を報酬の宝箱にする。中身は loot/cave.yml
#   /dungeon addchest cave [表]     見ているブロックの上 (宝箱ならその宝箱) に道中の宝箱。中身は loot/<表>.yml (省くと cave_road)
#   /dungeon removechest cave       見ている (または近くの) 道中の宝箱を消す
#   /dungeon save cave              テンプレートを保存して元の場所へ戻る
# モブが1体以上 (ボスを決めたらボスも) 置かれると「入れる」状態になる。
#
# 消える壁 (エディターの 7 番の道具「消える壁」で作る。分かれ道・寄り道の扉に使う):
#   walls:
#     - {when: kills, count: 10, blocks: [[12, 64, 3], [12, 65, 3]]}   ボス以外の敵を合わせて 10 体倒すと消える
#     - {when: gather, count: 3, blocks: [[20, 64, 8]]}               3 人が壁のそば (3 ブロック) に立つと消える (中の人が少なければ全員)
#     - {when: target, target: 4, blocks: [[30, 64, 1]]}              置いたモブ #4 を倒すと消える (確率のモブが出なかった回は消えない)
#   1 つの壁のブロックは、全部いっしょに消える (離れた場所にあってもよい)。壁はいくつでも作れる。

id: cave
name: "アトラスの洞窟"
description:
  - "アトラスの近くにある、小さな洞窟。"
  - "奥にいる「岩窟の主」を倒して、脱出口から帰ろう。"
min-level: 1
time-limit-seconds: 900
lives: 3              # death: lives のときだけ使う
# revive: 倒れたら観戦になり、仲間が体の横に5秒立つと復活。立っている人がいなくなったら失敗
# lives:  残機の分だけ入口で復活
death: revive
max-players: 4        # 1回に入れる人数 (最初の人が /dungeon invite で招く)
close-delay-seconds: 300 # クリア後、この秒数 (5分) で全員を強制送還
boss: cave_boss
reward:
  gold: 100
  xp: 200
entry:
  x: 0.5
  y: 65.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0
spawns: []
