rarity:
  mark: "🙥"

player:
  level-cap: 256
  first-release-level-cap: 20
  default-max-hp: 20.0
  default-hp-regen-per-3s: 1.0
  default-max-mp: 20.0
  default-mp-regen-per-3s: 5.0
  mp-regen-period-ticks: 60
  leveling:
    drop-experience-orbs: true
    experience-orb-speed: 0.32

mob:
  default-max-hp: 20.0
  default-max-mp: 1.0
  vanilla-health-proxy: 20.0
  spawn-distance: 3.0
  target-range: 24.0
  player-damage-multiplier: 0.10
  status-display:
    enabled: true
    y-offset: 0.0
    anchor-lift: 0.45
    line-width: 90
    view-range: 24.0
    update-period-ticks: 1
    # 頭上の表示の動きをなめらかにする補間のtick数 (大きいほど滑らかだが、少し遅れる)
    interpolation-ticks: 3

combat:
  debug-damage-in-creative: true
  melee-area-damage-rate: 0.65
  # 近接の弱・強コンボ: 左クリックが弱、Shiftを押しながら左クリックが強。弱を light-count 回つなげた最後が「最終段」
  combo:
    enabled: true
    light-count: 5               # 弱の連続回数 (最後の1回が最終段)
    window-ticks: 32             # 次の攻撃までにこれ以上あくとコンボが切れる
    heavy-damage-multiplier: 2.0 # 強のダメージ倍率 (弱を何回かつなげた後だと、1回ごとに heavy-stage-bonus が足される)
    heavy-stage-bonus: 0.15
    heavy-recovery-ticks: 10     # 強のあとの追加の硬直
    finisher-damage-multiplier: 2.0
    finisher-recovery-ticks: 8
    # アサシンのコンボ (見た目は classes/assassin.yml の combo-style)。弱5回 (5回目が最終段) と、強攻撃0〜4。
    # 通常3は40%のダメージで3回、通常4は30%で4回、通常5 (最終段) は60%で3回当たる (斬撃もその回数だけ出る)。
    # 強攻撃Nは、弱をN回出した後の右クリック (弱0回なら強攻撃0)。強攻撃を出すと弱のコンボは最初から。Shift+左クリックは、ふつうの弱。
    # 強攻撃2のジャンプのあと2.5秒以内の強攻撃0は、ステップではなく強攻撃3になる。
    # 強攻撃ごとのクールタイム (tick): 強攻撃0のステップだけ4秒 (80)。強攻撃2のジャンプのあとの強攻撃3には掛からない。リストは0, 1, 2, 3, 4の順。
    # 強攻撃を出したあと、この間 (tick) は通常攻撃 (左クリック) が始まらない
    heavy-recovery-ticks: 8
    assassin:
      heavy-cooldown-ticks: [80, 0, 0, 0, 0]
      heavy-damage-multiplier: [0.0, 0.3, 0.4, 0.6, 0.07]   # 1は周囲の斬撃 (30%)、2は薙ぎ1回ごと、3は斬撃1回ごと、4は1回ごと (20回)
      multi-hit-rate: [0.4, 0.3, 0.6]             # 通常3 / 通常4 / 通常5: 1回ごとのダメージの倍率
      multi-hit-counts: [3, 4, 3]                 # 通常3 / 通常4 / 通常5: 当たる回数
      multi-hit-gap-ticks: 4                      # 次の1回 (斬撃の演出も) までのtick数
      finisher-area-radius: 3.0                   # 通常5 (フィニッシュ) の攻撃範囲の半径 (演出も同じ大きさ)
      step-power: 1.05                            # 強攻撃0: 視点方向へのステップの強さ
      spin-radius: 2.0                            # 強攻撃1: 周囲の斬撃の半径 (攻撃範囲も演出も。発生位置はプレイヤーの位置)
      sweep-radius: 3.6                           # 強攻撃2: 前方の薙ぎの半径 / 開き (半角) / 2つ目までのtick数 / 後ろに跳ぶ強さ / 上に跳ぶ強さ (跳ぶのと1つ目の薙ぎは同時)
      sweep-half-angle: 70
      sweep-gap-ticks: 5
      hop-back-power: 0.8
      hop-up-power: 0.75
      leap-power: 0.95                            # 強攻撃3: 視点方向へ跳ぶ強さ / 上への強さ / 周りの斬撃の範囲 / 最長のtick数
      leap-up-power: 0.45
      leap-radius: 3.0
      leap-ticks: 16
      surround-hits: 20                           # 強攻撃4: 当たる回数 / 1tickに当たる回数 / 範囲の半径 / 自分の正面何ブロックを中心にするか
      surround-hits-per-tick: 2
      surround-radius: 4.0
      surround-forward: 2.0
    # メイジのコンボ (遠距離武器): 通常攻撃 = 右クリック (5段)、強攻撃 = 左クリック (通常をN回出したあとの左クリックが強攻撃N、コンボなしが強攻撃0)。
    # 通常1・2は魔法弾 (左上・右上から)、3は高速の魔力散弾 (40%×3回)、4は高密度の魔力散弾 (30%×4回)、5は魔力バースト (60%×3回)。
    # 強攻撃0 = 短距離テレポート (固有ct 6秒)。1〜4のあと2秒以内の強攻撃0は、その属性の派生 (1-2 炎の突進 / 2-2 氷の破裂 / 3-2 雷の連鎖 / 4-2 風の真空)。
    # 派生が当たると、5秒間、通常攻撃がその属性の見た目になる。
    mage:
      heavy-cooldown-ticks: [120, 0, 0, 0, 0]
      heavy-damage-multiplier: [0.0, 1.0, 0.4, 0.6, 0.07]   # 1は炎の衝撃波、2は氷の波動1つごと、3は雷、4は竜巻の1回ごと (20回)
      multi-hit-rate: [0.4, 0.3, 0.6]             # 通常3 / 通常4 / 通常5: 1回ごとのダメージの倍率
      multi-hit-counts: [3, 4, 3]                 # 通常3 / 通常4 / 通常5: 当たる回数
      multi-hit-gap-ticks: 4                      # 次の1回 (演出も) までのtick数
      burst-radius: 3.5                           # 通常5: 魔力バーストの半径
      teleport-distance: 6.0                      # 強攻撃0: テレポートの距離
      flame-radius: 4.0                           # 強攻撃1: 炎の衝撃波の半径
      hop-back-power: 0.8                         # 強攻撃2: 後ろに跳ぶ強さ / 上に跳ぶ強さ / 波動の間隔のtick数 / 波動のスキルの id
      hop-up-power: 0.75
      wave-gap-ticks: 5
      ice-wave-skill: mage_ice_wave
      thunder-forward: 4.0                        # 強攻撃3: 雷の位置 (正面何ブロック) / 引き寄せる範囲の半径
      thunder-radius: 4.0
      tornado-hits: 20                            # 強攻撃4: 当たる回数 / 1tickに当たる回数 / 範囲の半径 / 自分の正面何ブロックを中心にするか
      tornado-hits-per-tick: 2
      tornado-radius: 4.0
      tornado-forward: 2.0
      element-mode-seconds: 5.0                   # 派生が当たったあと、通常攻撃がその属性の見た目になる秒数
      flame-dash-rate: 0.05                       # 1-2: 突進の途中で2tickごとに当てる倍率 / 突進のtick数 / 強さ
      flame-dash-ticks: 8
      flame-dash-power: 1.0
      ice-burst-rate: 0.6                         # 2-2: 氷の破裂の倍率 / 個数 / 破裂が出る範囲の半径 / 正面何ブロック
      ice-burst-count: 3
      ice-burst-radius: 3.0
      ice-burst-forward: 4.0
      chain-rate: 0.5                             # 3-2: 連鎖の1回ごとの倍率 (1体に2回) / 当てる体数 / 次へ跳ぶ範囲の半径
      chain-targets: 3
      chain-radius: 6.0
      vacuum-rate: 0.15                           # 4-2: 真空の塊の1回ごとの倍率 / 回数 / 半径 / 後ろに下がる強さ
      vacuum-hits: 6
      vacuum-radius: 2.8
      backstep-power: 1.1
    # レンジャーのコンボ (クラス id は gifted)。通常攻撃は遠距離武器の右クリックで、1・2 高速の矢、3 高速の3連射 (40%×3)、
    # 4 扇形の3方向 (35%×3)、5 至近距離の散弾 (近接武器の左クリック、40%×3。近接以外・敵なしは空振りで数だけ進む)、6 強力な一撃 (100%)。
    # 強攻撃は、その武器の通常攻撃ではない方のクリック (遠距離・設置は左、近接は右)。0 後ろにジャンプ (固有ct 5秒) /
    # 1 扇形の矢 (70度・半径5・30%) / 2 後ろに跳んでワイヤー2本 (40%×2) / 3 最大3回跳ね返る矢 (当たるたびに小さな爆発) /
    # 4 視点の5ブロック先の周り (半径4) に矢の雨 (60%)。
    # 3つの攻撃のループ: 近接が当たる→次の遠距離通常が +10%・弾が速い / 遠距離が当たる→設置武器から周囲に2% / 設置のダメージ→近接 +10% (5秒)。
    ranger:
      window-ticks: 44                            # 通常攻撃の間隔。武器を持ち替える分、ほかより長い
      heavy-cooldown-ticks: [100, 0, 0, 0, 0]
      heavy-damage-multiplier: [0.0, 0.3, 0.4, 0.5, 0.6]   # 1は扇形、2はワイヤー1本ごと、3は矢が敵に当たったとき、4は矢1本ごと
      hit-rate: [1.0, 1.0, 0.4, 0.35, 0.4, 1.0]   # 通常1〜6: 1発ごとの倍率
      range-boost-percent: 10                     # 近接が当たったあとの遠距離通常: ダメージ+% / 弾速の倍率 / 有効な秒数
      range-boost-speed: 1.5
      range-boost-seconds: 10
      melee-boost-percent: 10                     # 設置のダメージのあとの近接: ダメージ+% / 有効な秒数
      melee-boost-seconds: 5
      resonance-rate: 0.02                        # 遠距離が当たったときの設置武器の共鳴: 倍率 / 続けて起きる最短のtick数
      resonance-gap-ticks: 4
      fan-angle: 14.0                             # 通常4: 3方向の間の角度
      close-radius: 3.5                           # 通常5: 敵がこの距離にいると当たる / 正面の角度 (片側)
      close-half-angle: 80.0
      back-jump-power: 1.0                        # 強攻撃0: 後ろに跳ぶ強さ / 上に跳ぶ強さ
      back-jump-up-power: 0.55
      fan-radius: 5.0                             # 強攻撃1: 扇形の半径と角度
      fan-arrow-angle: 70.0
      hop-back-power: 0.8                         # 強攻撃2: 後ろに跳ぶ強さ / 上に跳ぶ強さ / ワイヤーの長さ
      hop-up-power: 0.75
      wire-length: 8.0
      ricochet-bounces: 3                         # 強攻撃3: 跳ね返る回数 / 矢の速さ (ブロック/tick) / 飛ぶ最長tick数 / 爆発の半径と倍率
      ricochet-speed: 2.2
      ricochet-ticks: 40
      blast-radius: 2.2
      blast-rate: 0.3
      rain-forward: 5.0                           # 強攻撃4: 視点の何ブロック先を中心にするか / 雨の半径 / 矢の数 / 降らせるtick数
      rain-radius: 4.0
      rain-arrows: 20
      rain-ticks: 10
  # 武器 (アイテム) のスキルの発動: 近接も遠距離も Shift+右クリック。movement-plain: true にすると、移動スキル (dash / teleport) は右クリックだけで出る
  skill-trigger:
    melee-sneak: true
    movement-plain: false
  # 近接の範囲攻撃: 全員が持つ小さな範囲 (戦士の「近接範囲攻撃化」の下位互換)。戦士は上の 0.65 / area-radius
  melee-area-base-damage-rate: 0.40
  melee-area-base-radius: 2.0
  range-area-damage-rate: 0.45
  area-radius: 3.0
  # 遠距離範囲攻撃はクラス関係なく標準で範囲3・割合45%。メイジの「遠距離範囲の強化」で範囲5・割合60%
  range-area-expanded-damage-rate: 0.60
  range-area-expanded-radius: 5.0
  area-requires-facing: true
  range-distance: 16.0
  range-ray-size: 0.6
  # レンジャーの固有1 (神速の弾) を取ると、遠距離武器の射程にこの倍率が掛かる (弾は矢のように飛ぶ)
  ranger-range-multiplier: 2.0
  min-cooldown-ticks: 1
  status-effects:
    duration-ticks: 100
    # 爆破: 10スタックで周囲(explosion-radius)に、貯めた分のダメージ。explosion-delay-ticks 後に爆発 (0で即時)
    explosion-delay-ticks: 40
    explosion-radius: 3.0
    # 混乱: 100までスタックし、満タンでこのtick数だけ行動不能 (40 = 2秒)
    confusion-stun-ticks: 40
  cooldown-ticks:
    melee: 14
    range: 10
    deploy: 200
    special: 2
  deploy:
    radius: 6.0
    duration-ticks: 200
    min-duration-ticks: 20
    attack-period-ticks: 40
    min-attack-period-ticks: 6
    spawn-distance: 3.0
    height: 1.4
    bob-amplitude: 0.25
    bob-period-ticks: 40.0
    rotation-degrees-per-tick: 4.0
  effects:
    particle-size: 0.85
    melee-slash:
      enabled: true
      tilt: 45                  # 斬撃の傾き。向いている方向に水平な薙ぎを、横軸まわりに何度傾けるか (0 = 立てる、90 = 寝かせる)。視線の上下は無視する
      particles: 14
      radius: 1.35
      height: 1.15
      forward-offset: 0.25
      vertical-lift: 0.30
      angle-degrees: 105.0
    range-trail:
      enabled: true
      spacing: 0.55
      max-points: 30
      start-offset: 0.65
    range-impact:
      enabled: true
      particles: 12
      radius: 0.45
    range-hurt:
      enabled: true
      damage-indicators: 5
      red-dust: 5
    deploy-ring:
      enabled: true
      period-ticks: 2
      points: 72
      height: 0.15
    deploy-pulse:
      enabled: true
      points: 42

debug:
  target:
    max-health: 1000.0
    spawn-distance: 3.0

class-selection:
  # true: クラス未選択のプレイヤーがログインするとクラス選択メニューを開く
  open-on-join: true
  open-delay-ticks: 40

class-skill-points:
  # 何レベルごとに1SP獲得するか
  levels-per-point: 5
  # 獲得できるSPの上限。200Lvで完成(=40SP)。201Lv以降はエンドコンテンツ用に保留
  max-points: 40
  # SPを何ポイント使うごとに、解放ノードを順番に1つ無料で解放するか
  milestone-interval: 5

# 全クラス共通のレベル成長 (1レベルあたり)。クラス固有の成長は classes/*.yml の growth
level-growth:
  max-hp: 10
  max-mp: 0.4
  strength: 0.1
  magic: 0.1
  defense: 1.5
  hp-regen: 0.5
  mp-regen: 0.05

# 条件付きパッシブ (体力が半分以下 / 立ち止まっている間)
class-conditions:
  # 何tickごとに判定するか
  check-ticks: 5
  # 位置が動いていない判定が何回続いたら「立ち止まっている」とするか (check-ticks × この回数)
  stationary-samples: 2

# クラス効果の倍率。設計メモの式のとおり(1.0)。桁が大きすぎる場合の調整用
class-effects:
  gifted:
    # 出血 = レベル × 近接ダメージ × (100% + 近接ダメージ%) × この値
    bleed-scale: 1.0
    # 腐食・腐敗 = レベル × 遠距離ダメージ × (100% + 遠距離ダメージ%) ÷ 10 (= × 0.1)
    # 腐食は敵の防御を下げる値(0未満にならない)、腐敗は敵が被ダメージのたびに加算される特殊ダメージ
    decay-scale: 0.1
    # 本能開放の裂傷 = 設置ダメージ × 設置ダメージ% ÷ 100 × この値
    laceration-scale: 1.0
  healer:
    # 回復→敵ダメージの範囲(ブロック)
    pulse-radius: 7

tutorial:
  # デバッグ用チュートリアル (/tutorialstart, /tutorialstop)
  # 終了時のテレポート先 (物語の開始地点)。world を空にすると実行者のいるワールド
  end-location:
    world: ""
    x: 60.5
    y: 80.0
    z: 170.5
    yaw: 0.0
    pitch: 0.0
  # NPCが前方に立つ距離と、横へ移動する距離 (実行位置からの相対ブロック数)
  npc-distance: 2.5
  npc-side-offset: 2.0
  # ねずみを攻撃しなかったとき、促すまでの秒数
  idle-nudge-seconds: 20

quest:
  # 通貨の名前
  currency-name: "ゴールド"
  # サブ依頼が入れ替わる時刻 (この時刻から24時間)。タイムゾーンは下
  sub-reset-hour: 4
  time-zone: "Asia/Tokyo"
  # 一度に出るサブ依頼の件数
  sub-count: 4

crafting:
  # クラフトを1回するたびに経験が1たまり、この回数ごとにクラフトレベルが1上がる
  crafts-per-level: 3
  # ランダム強化: 1つの強化が付く確率 = base-chance + chance-per-level * レベル (上限 max-chance)
  # 強化の最大数 = 1 + レベル / slots-level-step (上限 max-slots)
  base-chance: 0.2
  chance-per-level: 0.05
  max-chance: 0.85
  slots-level-step: 4
  max-slots: 4

# クラフトのランダム強化の上限。(サーバーの config.yml に自動で足されるよう、crafting とは別の節にしてある)
craft-caps:
  # クラフトレベルの最大
  max-level: 255
  # ランダム強化の値の上限: 「クラフトレベル最大(max-level)のときの最大値」を stat-max に書く。
  # 実際の上限 = その値 × (いまのクラフトレベル / max-level)。値は 1 から上限までの完全ランダム。
  # 耐性(physical-resist / magic-resist)は % で書く。
  # 出血・腐食・腐敗・裂傷・混乱・爆破は、その武器の武器ダメージ × debuff-weapon-multiplier
  debuff-weapon-multiplier: 200
  stat-max:
    max-hp: 2000
    max-mp: 2000
    hp-regen: 100
    mp-regen: 100
    weapon-damage: 50
    strength: 1000
    magic: 1000
    strength-percent: 10
    magic-percent: 10
    melee-damage: 2000
    range-damage: 2000
    deploy-damage: 2000
    melee-damage-percent: 20
    range-damage-percent: 20
    deploy-damage-percent: 20
    crit-damage: 100
    crit-chance: 20
    magic-overload: 200
    stability: 20
    duration: 20
    attack-speed: 20
    move-speed: 50
    defense: 2000
    physical-resist: 100
    magic-resist: 100
    damage-reduction: 20
    special-damage: 2000
    absorb-percent: 5
    slow-percent: 30
    # 属性 (5色それぞれに同じ上限)
    element-damage: 2000
    element-damage-percent: 15
    element-resist: 20

# 物理: 全てのエンティティ (プレイヤー・モブ) の直接攻撃のノックバックと、エンティティ同士の衝突
# (スキルが意図的に飛ばす・引き寄せる動きは、これに関係なく動く)
physics:
  no-knockback: true   # ノックバック耐性を最大にする
  no-collision: true   # 押し合わない (チームの衝突ルールも NEVER)

# フリーマーケット (/market)。ゴールドの名前は quest.currency-name
market:
  max-price: 1000000          # 単価の上限
  max-quantity: 9999          # 1回の出品の個数の上限
  max-delay-hours: 168        # 購入可能までの期間の上限 (時間)
  max-duration-hours: 168     # 購入可能期間の上限 (時間)
  max-listings-per-player: 10 # 同時に出品できる件数
  # 手数料 = 値段の分 + 個数の分 + 待ち時間の分 + 販売期間の分 (それぞれ切り上げ、合計は最低 minimum)
  fee:
    price-percent: 1.0                # 総額 (単価×個数) の何%
    per-item: 1.0                     # 1個あたり何ゴールド
    delay-percent-per-hour: 0.1       # 購入可能までの待ち時間 1時間あたり、総額の何%
    duration-percent-per-day: 0.5     # 購入可能期間 1日あたり、総額の何%
    minimum: 1

# インスタンスダンジョン (/dungeon)。ダンジョンの中身は dungeons/*.yml
dungeon:
  max-instances: 5          # 同時に開けるダンジョンの数
  empty-close-seconds: 60   # 誰もいない状態がこの秒数続いたら閉じる
  boss-kill-percent: 80     # ボス部屋への入口が開くのに必要な、ボス以外の敵を倒した割合 (%、切り上げ)
  # 本番用: true にすると、ダンジョンは世界に置いた入口 (/dungeon gate <id>) からしか入れない。
  # false の間は、メニューやコマンドからも入れる (入口の右クリックはいつでも使える)
  require-gate: false
  gate-range: 6             # 入口から何ブロック以内なら「入口にいる」とみなすか
  blocked-commands:         # ダンジョンの中で使えないコマンド (op は使える)
    - trade
    - market
    - fm
    - tutorialstart

# 一般フィールドのモブスポナー (/spawner edit で置く。設定はスポナーごとにも変えられる)
field-spawner:
  enabled: true
  trigger-radius: 24         # プレイヤーがこの距離まで近づくと湧く (新しく置くスポナーの初期値)
  min-count: 1               # 一度に湧く数 (最小・新しく置くスポナーの初期値)
  max-count: 2               # 一度に湧く数 (最大)
  max-alive: 2               # 同時に生きられる数
  respawn-seconds: 20        # 湧いてから次に湧けるまでの間隔
  spread: 3                  # スポナーの周りにばらける距離 (ブロック)
  leash-distance: 64         # スポナーからこれ以上離れたモブは消す (また湧けるように)
  idle-despawn-minutes: 10   # 湧いてからこの分数たっても、戦闘中でなければ消す
  combat-radius: 16          # モブの近くにプレイヤーがこの距離以内にいる間は戦闘中とみなす

# 画面右のサイドバー (上に点滅する iruuRPG、下にサーバーのアドレス。間に名前・レベル・クラス・所持金・現在地・時刻)
sidebar:
  enabled: true
  title: "iruuRPG"
  address: "mc.tkgon.net"
  blink:                    # 上のタイトルと下のアドレス: ちかちか〜っと一気に点滅し、しばらく同じ色、をくり返す
    burst-seconds: 1.5      # 点滅する時間
    steady-seconds: 6.0     # 同じ色のままの時間
  default-area: "Iruu大陸"   # どのエリアにも入っていないときの現在地
  clock: game               # 時刻: game = そのワールドのゲーム内の時刻 / real = 現実の時刻 (time-zone)
  time-zone: "Asia/Tokyo"
  # 現在地のエリア: 中心 (x, z) から半径 radius ブロックの円。重なったら中心に近い方。world を省くとどのワールドでも
  areas:
    - name: "アトラス港"
      x: 60
      z: 170
      radius: 60

# yml の自動取り込み: plugins/iruuRPG (yml リポジトリの作業コピー) で interval-seconds ごとに
# git pull --ff-only origin <branch> を実行し、コミットが変わったら再起動なしで読み直す。
# 結果は plugins/iruuRPG/reload-report.txt。手動は /iruurpg sync
yml-sync:
  enabled: true
  interval-seconds: 60
  branch: main

# パーティー (/party、仲間内のチャットは /p)。ログアウトや再起動のあとも続く (plugins/iruuRPG/parties.yml)
party:
  max-size: 4            # 1つのパーティーの最大人数
  # 経験値: 敵に5%以上ダメージを与えた仲間で人数割り。パーティーでない人は本人が全部。
  # 与えていない仲間は、敵からこの距離 (ブロック) 以内なら xp-bystander-percent % をもらう
  xp-share-range: 40
  xp-bystander-percent: 5

# ファストトラベル (/travel、メインメニュー)。地点は運営が /travel set <id> [名前] で置く。近くまで歩くと使えるようになる
travel:
  channel-ticks: 60       # 移動の準備 (光の演出) の長さ (1秒=20)。動く・攻撃を受けると中断
  cost: 0                 # 1回の料金 (ゴールド)
  discover-radius: 6      # この距離 (ブロック) まで近づくと、その地点を見つけたことになる

# ストレージ: 各地のエンダーチェストを開くと専用の画面になり、アイテムをしまえる (1ページ45マス)。
# 最初の free-pages ページは無料、次のページから、ゴールドで解放する。
# 価格 (仮): 最初の有料ページ = price-base、そのあとは 1ページごとに price-growth 倍 (ゆるやかな指数、50ゴールド単位に丸める)
# 既定だと 500 → 900 → 1600 → 2900 → 5250
storage:
  max-pages: 6
  free-pages: 1
  price-base: 500
  price-growth: 1.8

# 斬撃・範囲攻撃などの派手な演出 (弧を刃が走るように描く)。重いときは enabled: false か samples-per-block を下げる
slash-vfx:
  enabled: true
  # 弧1ブロックあたりの点の数 (大きいほど滑らかだが粒子が増える)
  samples-per-block: 5
  # 斬撃の大きさの倍率 (幅は広げない。粒子の線の間隔はせまく、外側ほど明るい色になる)
  size-scale: 1.2

# 攻撃の音 (バニラの小さな音を重ねて作った音)。うるさければ volume を下げる
attack-sounds:
  enabled: true
  volume: 1.0

# 敵の追尾。見えるプレイヤーだけに気づく (壁の向こうは気づかない)
mob-ai:
  # この距離以内で、遮るものがなく見えるプレイヤーに気づく
  sight-range: 16.0
  # この距離以内なら、見えなくても気づく (足音)
  close-range: 5.0
  # これより離れたら諦める
  lose-range: 28.0
  # 見失ってから、この時間 (tick) は居場所を覚えて追う
  memory-ticks: 100

# プレイヤーのスキル (skills/*.yml を武器・クラスで使うもの) の上限
skill-limits:
  # damage-rate (武器ダメージに対する倍率) の上限。これを超える値は、この値として扱う
  player-damage-rate-max: 8.0

# バランス調整
balance:
  # レベルアップに必要な経験値の倍率 (10 = 元の10倍)
  xp-requirement-multiplier: 10.0
  # 全クラスの遠距離攻撃の射程の倍率 (combat.range-distance に掛ける)。メイジの「広域魔法」で2倍に戻る
  range-multiplier: 0.5
  # 遠距離武器の弾の速さ (ブロック/秒)。レンジャーは即着弾、メイジの「詠唱加速」は攻撃速度%ぶん速くなる
  projectile-speed: 40.0

# アクションバー
hud:
  # 近接 (赤) / 遠距離 (青) / 設置 (白) の「通常攻撃」のクールタイムのゲージ [||||||||||]: HP・MPの横に出る。
  # 通常攻撃が使えるときは緑、クールタイム中は進み具合を各色のうすい色で出す。
  # (アイテムのクールダウン表示は、武器のスキルだけ。スキルのクールタイムはゲージには出さない)
  # auto = どれかの通常攻撃がクールタイム中か、ダメージを与えていて DPS が 0 でない間 (終わって1.5秒まで) だけ出す (ふだんは HP / MP / DEF / Lv / XP の表示)、always = いつも出す、off = 出さない
  cooldown-gauges: auto
