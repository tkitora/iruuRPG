rarity:
  mark: "🙥"

player:
  level-cap: 256
  first-release-level-cap: 20
  default-max-hp: 20.0
  default-hp-regen-per-3s: 1.0
  default-max-mp: 20.0
  default-mp-regen-per-3s: 5.0
  mp-regen-period-ticks: 60
  leveling:
    drop-experience-orbs: true
    experience-orb-speed: 0.32

mob:
  default-max-hp: 20.0
  default-max-mp: 1.0
  vanilla-health-proxy: 20.0
  spawn-distance: 3.0
  target-range: 24.0
  player-damage-multiplier: 0.10
  status-display:
    enabled: true
    y-offset: 0.0
    anchor-lift: 0.45
    line-width: 90
    view-range: 24.0
    update-period-ticks: 1
    teleport-duration-ticks: 0

combat:
  debug-damage-in-creative: true
  melee-area-damage-rate: 0.65
  range-area-damage-rate: 0.45
  area-radius: 3.0
  # 遠距離範囲攻撃はクラス関係なく標準で範囲3・割合45%。メイジの「遠距離範囲の強化」で範囲5・割合60%
  range-area-expanded-damage-rate: 0.60
  range-area-expanded-radius: 5.0
  area-requires-facing: true
  range-distance: 16.0
  range-ray-size: 0.6
  min-cooldown-ticks: 1
  status-effects:
    duration-ticks: 100
    # 爆破: 10スタックで周囲(explosion-radius)に、貯めた分のダメージ。explosion-delay-ticks 後に爆発 (0で即時)
    explosion-delay-ticks: 40
    explosion-radius: 3.0
    # 混乱: 100までスタックし、満タンでこのtick数だけ行動不能 (40 = 2秒)
    confusion-stun-ticks: 40
  cooldown-ticks:
    melee: 14
    range: 10
    deploy: 200
    special: 2
  deploy:
    radius: 6.0
    duration-ticks: 200
    min-duration-ticks: 20
    attack-period-ticks: 40
    min-attack-period-ticks: 6
    spawn-distance: 3.0
    height: 1.4
    bob-amplitude: 0.25
    bob-period-ticks: 40.0
    rotation-degrees-per-tick: 4.0
  effects:
    particle-size: 0.85
    melee-slash:
      enabled: true
      particles: 14
      radius: 1.35
      height: 1.15
      forward-offset: 0.25
      vertical-lift: 0.30
      angle-degrees: 105.0
    range-trail:
      enabled: true
      spacing: 0.55
      max-points: 30
      start-offset: 0.65
    range-impact:
      enabled: true
      particles: 12
      radius: 0.45
    range-hurt:
      enabled: true
      damage-indicators: 5
      red-dust: 5
    deploy-ring:
      enabled: true
      period-ticks: 2
      points: 72
      height: 0.15
    deploy-pulse:
      enabled: true
      points: 42

debug:
  target:
    max-health: 1000.0
    spawn-distance: 3.0

class-selection:
  # true: クラス未選択のプレイヤーがログインするとクラス選択メニューを開く
  open-on-join: true
  open-delay-ticks: 40

class-skill-points:
  # 何レベルごとに1SP獲得するか
  levels-per-point: 5
  # 獲得できるSPの上限。200Lvで完成(=40SP)。201Lv以降はエンドコンテンツ用に保留
  max-points: 40
  # SPを何ポイント使うごとに、解放ノードを順番に1つ無料で解放するか
  milestone-interval: 5

# 全クラス共通のレベル成長 (1レベルあたり)。クラス固有の成長は classes/*.yml の growth
level-growth:
  max-hp: 10
  max-mp: 0.4
  strength: 0.1
  magic: 0.1
  defense: 1.5
  hp-regen: 0.5
  mp-regen: 0.05

# 条件付きパッシブ (体力が半分以下 / 立ち止まっている間)
class-conditions:
  # 何tickごとに判定するか
  check-ticks: 5
  # 位置が動いていない判定が何回続いたら「立ち止まっている」とするか (check-ticks × この回数)
  stationary-samples: 2

# クラス効果の倍率。設計メモの式のとおり(1.0)。桁が大きすぎる場合の調整用
class-effects:
  gifted:
    # 出血 = レベル × 近接ダメージ × (100% + 近接ダメージ%) × この値
    bleed-scale: 1.0
    # 腐食・腐敗 = レベル × 遠距離ダメージ × (100% + 遠距離ダメージ%) ÷ 10 (= × 0.1)
    # 腐食は敵の防御を下げる値(0未満にならない)、腐敗は敵が被ダメージのたびに加算される特殊ダメージ
    decay-scale: 0.1
    # 本能開放の裂傷 = 設置ダメージ × 設置ダメージ% ÷ 100 × この値
    laceration-scale: 1.0
  healer:
    # 回復→敵ダメージの範囲(ブロック)
    pulse-radius: 7

tutorial:
  # デバッグ用チュートリアル (/tutorialstart, /tutorialstop)
  # 終了時のテレポート先 (物語の開始地点)。world を空にすると実行者のいるワールド
  end-location:
    world: ""
    x: 60.5
    y: 80.0
    z: 170.5
    yaw: 0.0
    pitch: 0.0
  # NPCが前方に立つ距離と、横へ移動する距離 (実行位置からの相対ブロック数)
  npc-distance: 2.5
  npc-side-offset: 2.0
  # ねずみを攻撃しなかったとき、促すまでの秒数
  idle-nudge-seconds: 20

quest:
  # 通貨の名前
  currency-name: "ゴールド"
  # サブ依頼が入れ替わる時刻 (この時刻から24時間)。タイムゾーンは下
  sub-reset-hour: 4
  time-zone: "Asia/Tokyo"
  # 一度に出るサブ依頼の件数
  sub-count: 4
