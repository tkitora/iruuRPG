      recast-rate: 1.3                            # 叩きつけ: 周りの敵への倍率 (打ち上げ)
      recast-radius: 4                            # 叩きつけ: 半径 (ブロック)
      recast-rally: 2.0                           # 叩きつけ: 傷を取り返す速さがこの倍
      large-seconds: 26                           # 大 (血の誓い): クールタイム (秒)
      large-duration: 8                           # 大: 続く秒数
      large-radius: 10                            # 大: 自分に引きつける敵の範囲 (ブロック。2秒ごとに範囲に入った敵も)
      large-guard: 0.3                            # 大: その間、受けるダメージが減る割合
      large-rally: 1.5                            # 大: その間、傷は消えず、取り返す速さがこの倍
      large-burst-radius: 5                       # 大: 終わりに血が噴き出す半径 (ブロック)
      large-burst-rate: 1.2                       # 大: その倍率
      large-burst-per-percent: 0.04               # 大: 誓いの間に受けたダメージ (最大体力の%) 1 につき足す倍率
      large-burst-max: 2.0                        # 大: 足す倍率の上限
      util-seconds: 6                             # util (受け流し): クールタイム (秒)
      util-back: 0.6                              # util: 後ろへ下がる強さ
      util-parry-ticks: 12                        # util: 受け流せる時間 (tick。この間の攻撃はダメージ0になり、反撃する)
      riposte-rate: 1.3                           # 反撃: 前へ踏み込んで斬る倍率
      riposte-rally: 2.0                          # 反撃: 傷を取り返す速さがこの倍
      riposte-heal: 3                             # 反撃: 回復 (最大体力の%)
    # 戦士の遠距離 = 浮遊する大剣と鎖 (t168)。大剣が肩の後ろに浮かび、攻撃のたびに飛んでいく。鎖で縛った敵は、その点から少ししか動けない。
    warrior_range:
      # 通常1〜5: 1回の倍率 / 当たる回数 (1 剣が貫く、2 2本が交差、3 回る剣 x4、4 3本が降る、5 大剣が落ちて鎖で縛る)
      # hit-rate: [0.75, 0.5, 0.25, 0.45, 1.6]
      # hit-counts: [1, 2, 4, 3, 1]
      aim-range: 18                               # 狙える距離 (ブロック)
      hover-seconds: 6                            # 最後の攻撃のあと、大剣が浮かんでいる秒数
      bound-bonus: 0.3                            # 鎖で縛られた敵が剣から受けるダメージの増え方
      finisher-radius: 2.6                        # 通常5: 大剣の当たる半径 (ブロック)
      finisher-bind-seconds: 3                    # 通常5: 鎖で縛る秒数
      finisher-bind-radius: 2                     # 通常5: 縛られた敵が動ける半径 (ブロック)
      small-charges: 3                            # 小 (穿剣): ためておける数
      small-charge-seconds: 3.5                   # 小: 1つ以上残っている間、1つ戻る秒数
      small-empty-seconds: 9                      # 小: 使い切ったとき、全部まとめて戻るまでの秒数
      small-rate: 0.85                            # 小: 通り道の敵すべてへの倍率
      small-range: 20                             # 小: 飛ぶ距離 (ブロック。壁で止まる)
      small-speed: 1.6                            # 小: 速さ (1 tick あたりのブロック数)
      medium-seconds: 10                          # 中 (縛鎖): クールタイム (秒)
      medium-range: 18                            # 中: 鎖の届く距離 (狙った敵、いなければ前の近い敵)
      medium-rate: 0.5                            # 中: 当たったときの倍率
      medium-bind-seconds: 4                      # 中: 縛る秒数 (横に剣が刺さる)
      medium-bind-radius: 1.2                     # 中: 縛られた敵が動ける半径 (ブロック)
      medium-slow: 30                             # 中: その間の鈍足 (%)
      medium-recast-seconds: 4                    # 中: 再発動 (引き寄せ) を受け付ける秒数
      recast-rate: 0.45                           # 引き寄せ: 浮かぶ剣が3回刺す、1回の倍率
      large-seconds: 24                           # 大 (千剣の檻): クールタイム (秒)
      large-range: 18                             # 大: 檻を出せる距離 (ブロック)
      large-radius: 5                             # 大: 檻の半径 (8本の大剣が輪に降る)
      large-prison-seconds: 4                     # 大: 中の敵が出られない秒数
      large-stab-rate: 0.22                       # 大: 0.5秒ごとに中の敵を刺す倍率
      large-final-rate: 1.4                       # 大: 最後に8本が真ん中へ突き刺さる倍率 (打ち上げ)
      util-seconds: 6                             # util (退き打ち): クールタイム (秒)
      util-back: 0.9                              # util: 後ろへ跳ぶ強さ
      util-up: 0.35                               # util: 上への強さ
      util-radius: 3.5                            # util: 元いた所に落ちる剣が縛る半径 (ブロック)
      util-rate: 0.3                              # util: その倍率
      util-bind-seconds: 2                        # util: 縛る秒数
      util-bind-radius: 1.5                       # util: 縛られた敵が動ける半径
    # 戦士のランタン = 孤立させる結界 (t168)。周り3.5ブロックに他の敵がいない「孤立」した敵には、ランタンの攻撃が強く当たる。スタンは無し。
    warrior_deploy:
      # 通常1〜5: 1回の倍率 / 当たる回数 (1 鉄の楔、2 鎖の柵 (触れるたび)、3 引き剥がす鉤、4 檻 x3、5 断罪の鐘)
      # hit-rate: [0.9, 0.3, 0.8, 0.35, 0.6]
      # hit-counts: [1, 1, 1, 3, 1]
      isolate-radius: 3.5                         # 「孤立」: この半径に他の敵がいない
      isolate-bonus: 0.4                          # 孤立した敵へのダメージの増え方
      fence-half-width: 3                         # 通常2: 柵の半分の長さ (ブロック。3秒残る)
      hook-radius: 4                              # 通常3: 狙いからこの範囲のいちばん近い敵を引き剥がす
      cage-radius: 4.5                            # 通常4: 狙いからこの範囲のいちばん近い敵を檻に入れる
      cage-size: 2.6                              # 通常4: 檻の半径 (ほかの敵は入れない。中の敵は少し動ける)
      bell-radius: 7                              # 通常5: 鐘の届く半径 (設置の場所から)
      bell-isolated: 1.5                          # 通常5: 孤立した敵には、さらにこの割合だけ強く当たる
    ranger_deploy:
      normal-gap-ticks: 10
    ranger_range:
      normal-gap-ticks: 8
  # 武器 (アイテム) のスキルの発動: 武器の別のボタン (近接は右、遠距離は左。combat.skill-slots を見る)
  # 近接の範囲攻撃: 全員が持つ小さな範囲 (戦士の「近接範囲攻撃化」の下位互換)。戦士は上の 0.65 / area-radius
  melee-area-base-damage-rate: 0.40
  melee-area-base-radius: 2.0
  range-area-damage-rate: 0.45
  area-radius: 3.0
  # 遠距離範囲攻撃はクラス関係なく標準で範囲3・割合45%。メイジの「遠距離範囲の強化」で範囲5・割合60%
  range-area-expanded-damage-rate: 0.60
  range-area-expanded-radius: 5.0
  area-requires-facing: true
  range-distance: 16.0
  range-ray-size: 0.6
  # レンジャーの固有1 (神速の弾) を取ると、遠距離武器の射程にこの倍率が掛かる (弾は矢のように飛ぶ)
  ranger-range-multiplier: 2.0
  min-cooldown-ticks: 1
  status-effects:
    duration-ticks: 100
    # 爆破: 10スタックで周囲(explosion-radius)に、貯めた分のダメージ。explosion-delay-ticks 後に爆発 (0で即時)
    explosion-delay-ticks: 40
    explosion-radius: 3.0
    # 混乱: 100までスタックし、満タンでこのtick数だけ行動不能 (40 = 2秒)
    confusion-stun-ticks: 40
    # 気絶 (stun のステータス = 1回の攻撃で気絶させる確率%): 気絶する tick 数 (30 = 1.5秒。効果時間で延びる) と、同じ相手を続けて気絶させない免疫の tick 数 (100 = 5秒)
    stun-ticks: 30
    stun-immunity-ticks: 100
  cooldown-ticks:
    melee: 14
    range: 10
    deploy: 200
    special: 2
  deploy:
    radius: 6.0
    duration-ticks: 200
    min-duration-ticks: 20
    attack-period-ticks: 40
    min-attack-period-ticks: 6
    spawn-distance: 3.0
    height: 1.4
    bob-amplitude: 0.25
    bob-period-ticks: 40.0
    rotation-degrees-per-tick: 4.0
  effects:
    particle-size: 0.85
    # 攻撃の当たる範囲の地面の印 (敵の行動の telegraph・スキルの溜め): 印のフォント (iruurpg:marks、パック iruumark.zip) の円・扇・四角を、
    # 文字の表示 (text display) で地面に寝かせて (ブロックの上面と同じ向き)、範囲の形に合わせる。中身と外周を、別の色・濃さで出す。
    # 部品は重ならないので、半透明でも濃さがそろう。enabled: false = 今までのパーティクルの輪郭
    ground-mark:
      enabled: true
      fill-opacity: 90          # 中身の濃さ (0〜255。0 = 中身を出さない)
      rim-opacity: 210          # 外周の濃さ (0 = 外周を出さない)
      rim-width: 0.15           # 外周の太さ (ブロック。0 = 外周なし)。円・扇は、半径に対する割合の近い段 (3〜25%) に丸める
      rim-whiten: 0.35          # 外周の色を、中身の色より、どれだけ白に寄せるか (0〜1)
      outline: false            # true = 今までのパーティクルの輪郭も出す (印が範囲と合っているかを、ゲームで確かめるとき)
    melee-slash:
      enabled: true
      tilt: 45                  # 斬撃の傾き。向いている方向に水平な薙ぎを、横軸まわりに何度傾けるか (0 = 立てる、90 = 寝かせる)。視線の上下は無視する
      particles: 14
      radius: 1.35
      height: 1.15
      forward-offset: 0.25
      vertical-lift: 0.30
      angle-degrees: 105.0
    range-trail:
      enabled: true
      spacing: 0.55
      max-points: 30
      start-offset: 0.65
    range-impact:
      enabled: true
      particles: 12
      radius: 0.45
    range-hurt:
      enabled: true
      damage-indicators: 5
      red-dust: 5
    # 攻撃が当たったときの演出 (t166、全クラス・全攻撃): 刃は敵を横切る光の筋と火花、遠距離は火花の飛び散り、会心は大きく。
    # size: 大きさ、per-tick: 1人が1tickに出す数の上限 (範囲攻撃で多数に当たっても重くならないように)
    hit-vfx:
      enabled: true
      size: 1.0
      per-tick: 6
    deploy-ring:
      enabled: true
      period-ticks: 2
      points: 72
      height: 0.15
    deploy-pulse:
      enabled: true
      points: 42

debug:
  target:
    max-health: 1000.0
    spawn-distance: 3.0

class-selection:
  # true: クラス未選択のプレイヤーがログインするとクラス選択メニューを開く
  open-on-join: true
  open-delay-ticks: 40

class-skill-points:
  # 何レベルごとに1SP獲得するか
  levels-per-point: 5
  # 獲得できるSPの上限。200Lvで完成(=40SP)。201Lv以降はエンドコンテンツ用に保留
  max-points: 40
  # SPを何ポイント使うごとに、解放ノードを順番に1つ無料で解放するか
  milestone-interval: 5

# 全クラス共通のレベル成長 (1レベルあたり)。クラス固有の成長は classes/*.yml の growth
level-growth:
  max-hp: 10
  max-mp: 0.4
  strength: 0.1
  magic: 0.1
  defense: 1.5
  hp-regen: 0.5
  mp-regen: 0.05

# 条件付きパッシブ (体力が半分以下 / 立ち止まっている間)
class-conditions:
  # 何tickごとに判定するか
  check-ticks: 5
  # 位置が動いていない判定が何回続いたら「立ち止まっている」とするか (check-ticks × この回数)
  stationary-samples: 2

# クラス効果の倍率。設計メモの式のとおり(1.0)。桁が大きすぎる場合の調整用
class-effects:
  gifted:
    # 出血 = レベル × 近接ダメージ × (100% + 近接ダメージ%) × この値
    bleed-scale: 1.0
    # 腐食・腐敗 = レベル × 遠距離ダメージ × (100% + 遠距離ダメージ%) ÷ 10 (= × 0.1)
    # 腐食は敵の防御を下げる値(0未満にならない)、腐敗は敵が被ダメージのたびに加算される特殊ダメージ
    decay-scale: 0.1
    # 本能開放の裂傷 = 設置ダメージ × 設置ダメージ% ÷ 100 × この値
    laceration-scale: 1.0
    # 本能開放の発動中に付く移動速度上昇のレベル (1 = 移動速度上昇 I、0 でなし)
    instinct-speed-level: 1
  assassin:
    # SATUJIN (コンボ強化) の間、通常攻撃に足される攻撃速度 (%)
    frenzy-attack-speed: 40
    # SATUJIN の間、発動した場所からこの半径 (ブロック) より外には出られない
    frenzy-radius: 12
  healer:
    # 回復→敵ダメージ (命の反響) の範囲(ブロック)
    pulse-radius: 7
    # (t168 で計算を直した) 受けた回復をためて、1回の反響で周りの敵に与える。レベルの倍率は無くした
    pulse-interval-ticks: 20                    # 反響は、この間隔 (tick) に1回まで (その間の回復はためて、次の反響で出す)
    pulse-overheal-share: 0.25                  # 回復しすぎた分 (HP が満タンで入らなかった分) は、この割合だけ数える
    pulse-rate: 1.0                             # ためた回復のこの割合が、ダメージになる (緑属性の強化が掛かる)
    pulse-cap: 100                              # 1回の反響でためられる上限 (最大体力の%)

tutorial:
  # デバッグ用チュートリアル (/tutorialstart, /tutorialstop)
  # 終了時のテレポート先 (物語の開始地点)。world を空にすると実行者のいるワールド
  end-location:
    world: ""
    x: 60.5
    y: 80.0
    z: 170.5
    yaw: 0.0
    pitch: 0.0
  # NPCが前方に立つ距離と、横へ移動する距離 (実行位置からの相対ブロック数)
  npc-distance: 2.5
  npc-side-offset: 2.0
  # ねずみを攻撃しなかったとき、促すまでの秒数
  idle-nudge-seconds: 20

quest:
  # 通貨の名前
  currency-name: "ゴールド"
  # サブ依頼が入れ替わる時刻 (この時刻から24時間)。タイムゾーンは下
  sub-reset-hour: 4
  time-zone: "Asia/Tokyo"
  # 一度に出るサブ依頼の件数
  sub-count: 4

crafting:
  # クラフトを1回するたびに経験が1たまり、この回数ごとにクラフトレベルが1上がる
  crafts-per-level: 3
  # ランダム強化: 1つの強化が付く確率 = base-chance + chance-per-level * レベル (上限 max-chance)
  # 強化の最大数 = 1 + レベル / slots-level-step (上限 max-slots)
  base-chance: 0.2
  chance-per-level: 0.05
  max-chance: 0.85
  slots-level-step: 4
  max-slots: 4

# クラフトのランダム強化の上限。(サーバーの config.yml に自動で足されるよう、crafting とは別の節にしてある)
craft-caps:
  # クラフトレベルの最大
  max-level: 255
  # ランダム強化の値の上限: 「クラフトレベル最大(max-level)のときの最大値」を stat-max に書く。
  # 実際の上限 = その値 × (いまのクラフトレベル / max-level)。値は 1 から上限までの完全ランダム。
  # 耐性(physical-resist / magic-resist)は % で書く。
  # 出血・腐食・腐敗・裂傷・混乱・爆破は、その武器の武器ダメージ × debuff-weapon-multiplier
  debuff-weapon-multiplier: 200
  stat-max:
    max-hp: 2000
    max-mp: 2000
    hp-regen: 100
    mp-regen: 100
    weapon-damage: 50
    strength: 1000
    magic: 1000
    strength-percent: 10
    magic-percent: 10
    melee-damage: 2000
    range-damage: 2000
    deploy-damage: 2000
    melee-damage-percent: 20
    range-damage-percent: 20
    deploy-damage-percent: 20
    crit-damage: 100
    crit-chance: 20
    magic-overload: 200
    stability: 20
    duration: 20
    attack-speed: 20
    move-speed: 50
    defense: 2000
    physical-resist: 100
    magic-resist: 100
    damage-reduction: 20
    special-damage: 2000
    absorb-percent: 5
    slow-percent: 30
    # 属性 (5色それぞれに同じ上限)
    element-damage: 2000
    element-damage-percent: 15
    element-resist: 20

# 物理: 全てのエンティティ (プレイヤー・モブ) の直接攻撃のノックバックと、エンティティ同士の衝突
# (スキルが意図的に飛ばす・引き寄せる動きは、これに関係なく動く)
physics:
  no-knockback: true   # ノックバック耐性を最大にする
  no-collision: true   # 押し合わない (チームの衝突ルールも NEVER)

# フリーマーケット (/market)。ゴールドの名前は quest.currency-name
market:
  max-price: 1000000          # 単価の上限
  max-quantity: 9999          # 1回の出品の個数の上限
  max-delay-hours: 168        # 購入可能までの期間の上限 (時間)
  max-duration-hours: 168     # 購入可能期間の上限 (時間)
  max-listings-per-player: 10 # 同時に出品できる件数
  # 手数料 = 値段の分 + 個数の分 + 待ち時間の分 + 販売期間の分 (それぞれ切り上げ、合計は最低 minimum)
  fee:
    price-percent: 1.0                # 総額 (単価×個数) の何%
    per-item: 1.0                     # 1個あたり何ゴールド
    delay-percent-per-hour: 0.1       # 購入可能までの待ち時間 1時間あたり、総額の何%
    duration-percent-per-day: 0.5     # 購入可能期間 1日あたり、総額の何%
    minimum: 1

# インスタンスダンジョン (/dungeon)。ダンジョンの中身は dungeons/*.yml
dungeon:
  max-instances: 5          # 同時に開けるダンジョンの数
  empty-close-seconds: 60   # 誰もいない状態がこの秒数続いたら閉じる
  boss-kill-percent: 80     # ボス部屋への入口が開くのに必要な、ボス以外の敵を倒した割合 (%、切り上げ)
  # 本番用: true にすると、ダンジョンは世界に置いた入口 (/dungeon gate <id>) からしか入れない。
  # false の間は、メニューやコマンドからも入れる (入口の右クリックはいつでも使える)
  require-gate: false
  gate-range: 6             # 入口から何ブロック以内なら「入口にいる」とみなすか
  blocked-commands:         # ダンジョンの中で使えないコマンド (op は使える)
    - trade
    - market
    - fm
    - tutorialstart

# 一般フィールドのモブスポナー (/spawner edit で置く。設定はスポナーごとにも変えられる)
field-spawner:
  enabled: true
  default-radius: 48         # プレイヤーがこの距離まで近づくと湧く (新しく置くスポナーの初期値。スポナーごとに 8〜128)
  min-count: 1               # 一度に湧く数 (最小・新しく置くスポナーの初期値)
  max-count: 2               # 一度に湧く数 (最大)
  max-alive: 2               # 同時に生きられる数
  respawn-seconds: 20        # 湧いてから次に湧けるまでの間隔
  spread: 3                  # スポナーの周りにばらける距離 (ブロック)
  leash-distance: 64         # スポナーからこれ以上離れたモブは消す (また湧けるように)
  idle-despawn-minutes: 10   # 湧いてからこの分数たっても、戦闘中でなければ消す
  combat-radius: 16          # モブの近くにプレイヤーがこの距離以内にいる間は戦闘中とみなす

# 画面右のサイドバー (上に点滅する iruuRPG、下にサーバーのアドレス。間に名前・レベル・クラス・所持金・現在地・時刻)
sidebar:
  enabled: true
  title: "iruuRPG"
  address: "mc.tkgon.net"
  blink:                    # 上のタイトルと下のアドレス: ちかちか〜っと一気に点滅し、しばらく同じ色、をくり返す
    burst-seconds: 1.5      # 点滅する時間
    steady-seconds: 6.0     # 同じ色のままの時間
  default-area: "Iruu大陸"   # どのエリアにも入っていないときの現在地
  clock: game               # 時刻: game = そのワールドのゲーム内の時刻 / real = 現実の時刻 (time-zone)
  time-zone: "Asia/Tokyo"
  # 現在地のエリア: 中心 (x, z) から半径 radius ブロックの円。重なったら中心に近い方。world を省くとどのワールドでも
  areas:
    - name: "アトラス港"
      x: 60
      z: 170
      radius: 60

# yml の自動取り込み: plugins/iruuRPG (yml リポジトリの作業コピー) で interval-seconds ごとに
# git pull --ff-only origin <branch> を実行し、コミットが変わったら再起動なしで読み直す。
# 結果は plugins/iruuRPG/reload-report.txt。手動は /iruurpg sync
yml-sync:
  enabled: true
  interval-seconds: 60
  # 自動の同期は、時計の何秒に動くか (0〜59)。毎分 0 秒に動くほかの仕事 (同じフォルダを pull するスクリプト) と、git のロックで、ぶつからないように
  second: 30
  branch: main

# パーティー (/party、仲間内のチャットは /p)。ログアウトや再起動のあとも続く (plugins/iruuRPG/parties.yml)
party:
  max-size: 4            # 1つのパーティーの最大人数
  # 経験値: 敵に5%以上ダメージを与えた仲間で人数割り。パーティーでない人は本人が全部。
  # 与えていない仲間は、敵からこの距離 (ブロック) 以内なら xp-bystander-percent % をもらう
  xp-share-range: 40
  xp-bystander-percent: 5

# ファストトラベル (/travel、メインメニュー)。地点は運営が /travel set <id> [名前] で置く。近くまで歩くと使えるようになる
travel:
  channel-ticks: 60       # 移動の準備 (光の演出) の長さ (1秒=20)。動く・攻撃を受けると中断
  cost: 0                 # 1回の料金 (ゴールド)
  discover-radius: 6      # この距離 (ブロック) まで近づくと、その地点を見つけたことになる

# ストレージ: 各地のエンダーチェストを開くと専用の画面になり、アイテムをしまえる (1ページ45マス)。
# 最初の free-pages ページは無料、次のページから、ゴールドで解放する。
# 価格 (仮): 最初の有料ページ = price-base、そのあとは 1ページごとに price-growth 倍 (ゆるやかな指数、50ゴールド単位に丸める)
# 既定だと 500 → 900 → 1600 → 2900 → 5250
storage:
  max-pages: 6
  free-pages: 1
  price-base: 500
  price-growth: 1.8

# 斬撃・範囲攻撃などの派手な演出 (弧を刃が走るように描く)。重いときは enabled: false か samples-per-block を下げる
slash-vfx:
  enabled: true
  # 弧1ブロックあたりの点の数 (大きいほど滑らかだが粒子が増える)
  samples-per-block: 10
  # 斬撃の粒子の大きさ (小さいほど細かい刃になる)
  particle-size: 0.7
  # 斬撃の大きさの倍率 (幅は広げない。粒子の線の間隔はせまく、外側ほど明るい色になる)
  size-scale: 1.2

# 技の粒子 (グラデーションで描く演出) の細かさ。size-scale は粒子の大きさ (小さいほど細かい)、density は点の数の倍率 (大きいほど密で、粒子が増える)
vfx:
  size-scale: 0.8
  # 線・輪・球ではなく、ぽつぽつと出る点 (光の粒など) の大きさの倍率。ほぼ元の大きさに戻してある
  sparse-size-scale: 0.95
  density: 2.2

# 攻撃の音 (バニラの小さな音を重ねて作った音)。うるさければ volume を下げる
attack-sounds:
  enabled: true
  volume: 1.0

# 音の作り (t166): 音の役割ごとに、重ねるバニラの音を書き換えられる (書いた役割だけ。読み直しで反映)。
#   1行 = "音の名前 音量 ピッチ" (音の名前は org.bukkit.Sound の名前。例: ITEM_TRIDENT_THROW)。
#   主な役割: BLADE (近接の素振り) / BLADE_HEAVY (戦士の斬撃) / WIND (アサシンなどの技の斬撃) / HIT_CUT (近接の命中) / HIT_PIERCE (遠距離の命中) /
#   HIT_CRIT (会心で足す音) / SHADOW_SLICE・SHADOW_CROSS・SHADOW_DASH・SHADOW_FLURRY (アサシンの近接スキル)。役割の一覧は Sfx.java。
#   例:
#   sound-design:
#     BLADE: ["ITEM_TRIDENT_THROW 0.45 1.7", "ENTITY_PHANTOM_FLAP 0.25 2.0"]
sound-design: {}

# 敵の追尾。見えるプレイヤーだけに気づく (壁の向こうは気づかない)
mob-ai:
  # この距離以内で、遮るものがなく見えるプレイヤーに気づく
  sight-range: 16.0
  # この距離以内なら、見えなくても気づく (足音)
  close-range: 5.0
  # これより離れたら諦める
  lose-range: 28.0
  # 見失ってから、この時間 (tick) は居場所を覚えて追う
  memory-ticks: 100

# プレイヤーのスキル (skills/*.yml を武器・クラスで使うもの) の上限
skill-limits:
  # damage-rate (武器ダメージに対する倍率) の上限。これを超える値は、この値として扱う
  player-damage-rate-max: 8.0

# バランス調整
balance:
  # レベルアップに必要な経験値の倍率 (10 = 元の10倍)
  xp-requirement-multiplier: 10.0
  # 全クラスの遠距離攻撃の射程の倍率 (combat.range-distance に掛ける)。メイジの「広域魔法」で2倍に戻る
  range-multiplier: 0.5
  # 遠距離武器の弾の速さ (ブロック/秒)。レンジャーは即着弾、メイジの「詠唱加速」は攻撃速度%ぶん速くなる
  projectile-speed: 40.0

# アクションバー
hud:
  # 近接 (赤) / 遠距離 (青) / 設置 (白) の「通常攻撃」のクールタイムのゲージ [||||||||||]: HP・MPの横に出る。
  # 通常攻撃が使えるときは緑、クールタイム中は進み具合を各色のうすい色で出す。
  # (アイテムのクールダウン表示は、武器のスキルだけ。スキルのクールタイムはゲージには出さない)
  # auto = どれかの通常攻撃か強攻撃がクールタイム中か、ダメージを与えていて DPS が 0 でない間 (終わって1.5秒まで) だけ出す (ふだんは HP / MP / DEF / Lv / XP の表示)、always = いつも出す、off = 出さない
  cooldown-gauges: auto
  # ゲージが出ている間、持っている武器の強1〜強5 のアイコン (フォント iruurpg:hud) を、遠距離のゲージの上に並べる。クールタイム中は暗くなり、残りの秒が重なる
  # (強攻撃ごとのクールタイムがある武器だけ: クラスのコンボの近接・遠距離と、メイジの杖)。false で出さない
  heavy-icons: true

# プロシージャルツール (/proceduraltool、別名 /treetool)。木・岩・スパイク・結晶・クモの巣を、部位ごとに選んだブロックで作る
treetool:
  # 1本の木のブロック数の上限 (超えたら作らない)
  max-blocks: 60000
  # 1tickに調べて置くブロック数 (少しずつ。多いと一瞬重くなる)
  blocks-per-tick: 4000
  # (木は FastAsyncWorldEdit 経由で置くので、//undo と //redo で戻せる)
  # プレビュー (選んだブロックのままの試し置き): 設定を最後に変えてから反映するまでの tick (15 = 0.75秒。変えるたびに数え直す)
  preview-delay-ticks: 15
  # プレビューで1tickに送るブロック数 / プレビューする木のブロック数の上限 (超えたら見せない)
  preview-blocks-per-tick: 3000
  preview-max-blocks: 40000
  # true にすると、地形など固いブロックも置き換える。false は空気と草花だけ
  replace-solid: false
  # メニューで設定できる高さと幅の上限 (岩・スパイク・結晶。木の大きさは、木の数字で決まる)
  max-height: 80
  max-width: 60
  # クモの巣: 選べる点の数 / 点のまわりの地形を読む範囲の大きさ (ブロック数。超えたら作らない)。巣は空気にしか置かない
  web-max-points: 16
  web-max-volume: 400000
  # 部位ごとのブロックの初期値 (画面の部位のアイコン、または /proceduraltool block で、プレイヤーごとに選び直せる。選んだブロックは設定と一緒に保存される)
  materials:
    trunk: OAK_LOG
    root: OAK_LOG
    branch: OAK_LOG
    twig: OAK_LOG
    leaf: OAK_LEAVES
    snow: SNOW_BLOCK
    # 岩・スパイク・結晶の部位
    stone: GRAY_WOOL
    stone-light: LIGHT_GRAY_WOOL
    stone-dark: BLUE_WOOL
    moss: LIME_WOOL
    crystal: LIGHT_BLUE_WOOL
    crystal-core: WHITE_WOOL
    # クモの巣 (糸は本物のクモの巣ブロック。プレビューでもクモの巣のまま見える)
    web-frame: COBWEB
    web: COBWEB

# モデル機能 (model/): Blockbench の .bbmodel を、敵に着せる。モデルは plugins/iruuRPG/models/*.bbmodel、パックは resourcepacks/iruumodel.zip (docs/models.md)
model:
  enabled: true
  auto-build: true         # 起動時にモデルを読み、パックを作る (中身が同じなら書き換えない)
  base-item: PAPER         # 部品を表示するアイテム (パックが、このアイテムのモデルに部品を足す)
  cmd-base: 8100000        # 部品の custom model data の最初の番号
  update-ticks: 2          # 何tickごとにモデルの姿勢を更新するか
  view-distance: 48.0      # この距離にプレイヤーがいるときだけ更新する
  walk-speed: 1.0          # モデルの walk アニメーションが想定する歩く速さ (ブロック/秒)。mob の実際の速さとの比で、walk の再生速度を変える (足が地面を滑らない)
  death-vanish-seconds: 0.6  # death アニメーションのあと、煙を出して縮んで消えるまでの秒数 (0 で煙なし: 0.6 秒止まって消える)

# BGM (bgm/): plugins/iruuRPG/bgm/ の .nbs (Note Block Studio) を、範囲 (bgm/volumes.yml) に入ったプレイヤーに流す。音量はメニューの「設定」。
bgm:
  enabled: true
  check-ticks: 10          # 何tickごとに、プレイヤーがどの範囲にいるかを調べるか (10 = 0.5秒)
  watch-ticks: 100         # 何tickごとに、bgm フォルダの曲と volumes.yml が変わっていないか見るか (100 = 5秒)。変わっていれば、再起動なしで読み直す

# リソースパック (pack/): 入ってきたプレイヤーに、下のパックを送る。サーバー専用パック (server.zip: 草ブロックを全面草にする) と、
# モデル機能のパック (iruumodel.zip: /iruumodel build が作る) と、アイテムの見た目のパック (iruuitem.zip: itempack/ が作る) は別のパック。zip は plugins/iruuRPG/resourcepacks/ にある。
resourcepack:
  enabled: false
  # zip を置いた場所の URL (Web サーバーが resourcepacks/ を配る)。末尾は / でも無くてもよい。空で host を使う
  base-url: ""
  prompt: "iruuRPG のリソースパック"
  packs:
    server:
      file: server.zip
      enabled: true
      required: false
    models:
      file: iruumodel.zip
      enabled: true
      required: false
    items:
      file: iruuitem.zip
      enabled: true
      required: false
  # Web サーバーが無いときの、プラグイン内蔵の小さな配信 (GET だけ、packs の zip だけ)。port をプレイヤーに開けること
  host:
    enabled: false
    port: 8765
    bind: 0.0.0.0
    public-host: ""

# ペイントブラシ (/ibrush)。建築用のツールで、ゲームの処理とは別 (tools/brush)。描画は FastAsyncWorldEdit 経由なので //undo で戻せる
brush:
  # 半径の上限 (大きいと重い)
  max-radius: 32
  # 1回で変えるブロック数の上限 (超えたら途中で止める)
  max-blocks: 120000
  # 見ている先のブロックを探す距離
  range: 120
  # 右クリックの長押しで続けて使うときの最短の間隔 (tick)
  cooldown-ticks: 4
  # プレビューで見せるブロック数の上限と、見せている時間 (tick)。プレビューは本人にだけ見え、世界は変わらない
  preview-blocks: 1500
  preview-ticks: 80
  # 追従プレビュー (/ibrush preview): 設定を変えるか見ている所が動いてから更新するまでの tick (15 = 0.75秒) と、使える半径の上限
  preview-delay-ticks: 15
  preview-max-radius: 16
  # 右クリックを押したままなぞるとき、グラデーション「なぞった線に沿って」が最初→最後になるまでの長さ (ブロック)
  stroke-length: 24
  # 選択ツール (別のアイテム)。探すのは少しずつ (1tickに調べるブロック数)、表示は縁だけを近くの粒子で
  selection:
    max-radius: 64
    max-blocks: 300000
    blocks-per-tick: 20000
    display-range: 20
    display-particles: 800

