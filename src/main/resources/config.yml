rarity:
  mark: "🙥"

# アイテムの yaml が変わったら、ゲーム内のアイテムを新しい内容に作り直す (docs/item-patch.md)。
# false にすると、作り直しも印付けもしない (アイテムはそのまま)。true に戻すと、次の読み直し・ログインで確認する
item-patch:
  enabled: true

# 素材以外 (武器・防具) をスタックさせない移行 (design/item-foundation-2026-10-31.md)。off / dry-run / apply
#   off: 何もしない (新しく作る武器・防具は、もとから重ならない)
#   dry-run: 何も変えず、何を何個どう変えるかを plugins/iruuRPG/item-migration-report.txt に書く (プレイヤーはログインしたとき)
#   apply: 重なっている武器・防具を 1 個ずつに分け、印を付ける。変える前に backups/item-migration/ にバックアップ。/itemmigration restore で戻せる
item-migration:
  mode: "off"            # 引用符が要る (YAML では off が「いいえ」になる)

player:
  level-cap: 256
  first-release-level-cap: 20
  initial-max-hp: 20.0       # 初期体力 (新しく始めるプレイヤー。すでに遊んでいる人の体力は変わらない)
  default-hp-regen-per-3s: 1.0
  default-max-mp: 20.0
  default-mp-regen-per-3s: 5.0
  mp-regen-period-ticks: 60
  leveling:
    drop-experience-orbs: true
    experience-orb-speed: 0.32

# 体幹 (モデルに hurt アニメーションがある敵): 当たるたびにゲージがたまり、満タンで「よろける」(hurt を再生して一瞬止まる)。
# すべての被弾で hurt を出すのではなく、数発に1回。大きなスタンではない。敵ごとに mobs の model: の poise: で上書きできる
poise:
  max: 100                 # 満タンの値
  per-hit: 30              # 1発ごとに必ずたまる量 (HP の多い敵でも、たまるのが遅くなりすぎない)
  damage-scale: 100        # 与えたダメージの割合 (最大HPに対する) にかける量。最大HPの10%のダメージで +10
  drain-delay: 2.5         # 当たらないまま、この秒数がたつと減り始める
  drain-per-second: 30     # 減る速さ (1秒あたり)
  flinch-seconds: 0.35     # よろけて止まる長さ (秒)
  min-interval: 1.5        # よろけてから、次によろけられるまでの秒数 (よろけ続けない)

mob:
  default-max-hp: 20.0
  default-max-mp: 1.0
  vanilla-health-proxy: 20.0
  spawn-distance: 3.0
  attack-tags: true          # 敵の名前の前に [物・近] のように、物理/魔法と近接/遠距離を出す
  target-range: 24.0
  player-damage-multiplier: 0.10
  # /iruurpg btdebug で出す、ビヘイビアツリーの敵の状態表示: この距離内の敵だけ表示する
  behavior-view:
    range: 40.0
  status-display:
    enabled: true
    y-offset: 0.0
    anchor-lift: 0.45
    line-width: 90
    view-range: 24.0
    update-period-ticks: 1
    # 頭上の表示の動きをなめらかにする補間のtick数 (大きいほど滑らかだが、少し遅れる)
    interpolation-ticks: 3

combat:
  debug-damage-in-creative: true
  melee-area-damage-rate: 0.65
  # 右クリックの長押し: true なら、押しっぱなしの右クリック (クライアントが4tickごとに送り直す) で、右クリックの攻撃
  # (遠距離・設置の通常攻撃、近接の強攻撃) を連続して出せる。間隔は、それぞれのクールタイムのまま。左クリックは、押しっぱなしでも1回しか届かない
  hold-right-click: true
  # アサシンの分身を、本人と同じスキンの人型のエンティティで出す (パケットで本人以外にも見える)。false か、出せないときは、従来の粒子の人型
  clone-entity: true
  # ブロックを右クリックしてから、この tick の間は、左クリック (通常攻撃) として数えない (右クリックのあとの腕振りが、通常攻撃になるのを防ぐ)
  right-click-block-left-lock-ticks: 10
  # 近接の弱・強コンボ: 左クリックが弱、Shiftを押しながら左クリックが強。弱を light-count 回つなげた最後が「最終段」
  combo:
    enabled: true
    light-count: 5               # 弱の連続回数 (最後の1回が最終段)
    window-ticks: 32             # 次の攻撃までにこれ以上あくとコンボが切れる
    heavy-damage-multiplier: 2.0 # 強のダメージ倍率 (弱を何回かつなげた後だと、1回ごとに heavy-stage-bonus が足される)
    heavy-stage-bonus: 0.15
    heavy-recovery-ticks: 8      # 強のあとの追加の硬直。強攻撃を出したあと、この間 (tick) は通常攻撃 (左クリック) が始まらない
    finisher-damage-multiplier: 2.0
    finisher-recovery-ticks: 8
    # メイジのコンボ (遠距離武器): 通常攻撃 = 右クリック (5段)、強攻撃 = 左クリック (通常をN回出したあとの左クリックが強攻撃N、コンボなしが強攻撃0)。
    # 色は武器の属性と紫 (強い技ほど紫が多い)。通常攻撃は、武器の通常の間隔に normal-gap-extra-ticks だけあきが足される (2〜4tick程度)。
    # 通常1は左から弧を描く弾 (85%)、2は右から (90%)、3は左・上・右の弾3発 (38%×3)、4は扇から収束して交差する大きな弾3発 (45%×3)、
    # 5は通常1〜4が当たった敵の足元に立つ魔力の円柱 (80%×2)。通常1〜4の弾は、狙った敵がいればその敵を追う。
    # 強攻撃1 = 通常1が当たった敵を追う弾2発 (70%、当てていないときは前方への直進弾)、2 = 足元から広がる根 (20%ずつ、半径 root-radius)、
    # 3 = 前方に1ブロックごとのスパイク6本 (90%)、4 = 狙った場所の崩壊する球 (170%、縮んで引き込み、光ってから爆発)。
    # 強攻撃0 はそれ自体の効果はなく、再発動できる強攻撃があればそれを発動する (1 当てた敵への追加弾 / 2 根を自分に戻して MP を回復 /
    # 3 スパイクが当たった敵に空中から追加のスパイク3本 (30%) / 4 光っている球をすぐ爆発 (60%))。強攻撃1〜4を撃つと、echo-delay-ticks 後にもう一度自動で出る。
    mage:
      normal-gap-extra-ticks: 3                   # 通常攻撃と次の通常攻撃の間隔に足すtick数 (右クリックの長押しは1回の扱い)
      # 通常1〜5: 1回の倍率 / 当たる回数 (1 左から弧を描く弾、2 右から、3 左・上・右の3発、4 扇から収束して交差する大きな弾3発、5 当てた敵の足元からの円柱 x2)
      # hit-rate: [0.85, 0.9, 0.38, 0.45, 0.8]
      # hit-counts: [1, 1, 3, 3, 2]
      # 強攻撃1〜4の倍率: 1 追加の弾1発 (当てていないときの直進弾は straight-share 倍)、2 根の1回ごと、3 スパイクの1回 (1体に1回)、4 爆発
      # heavy-damage-multiplier: [0.0, 0.7, 0.2, 0.9, 1.7]
      reactivate-seconds: 3.0                     # 強攻撃3の再発動を受け付ける秒数
      echo-delay-ticks: 40                        # 強攻撃0: 強攻撃がもう一度出るまで / クールタイム秒 / 1回当てるごとに縮む秒 / 同時に待てる数 / もう一度の倍率
      echo-cooldown-seconds: 8.0
      echo-cut-seconds: 1.0
      echo-queue-max: 3
      echo-rate: 1.0
      funnel-straight-ticks: 5                    # 通常4: 交差したあと直進するtick数 (1tick 1.5ブロック)
      pillar-radius: 1.6                          # 通常5: 円柱の半径 / 高さ / 出るまでのtick / 2回目までのtick / 敵を探す距離
      pillar-height: 4.0
      pillar-delay-ticks: 5
      pillar-gap-ticks: 4
      pillar-reach: 24.0
      seeker-count: 2                             # 強攻撃1: 通常1が当てた敵への追加の弾の数 / 速さ / 飛ぶ最長tick / 当てていないときの直進弾の倍率
      seeker-speed: 1.4
      seeker-ticks: 50
      straight-share: 1.4
      root-radius: 6.0                            # 強攻撃2: 根の半径 / 広がりきるまでのtick / 残るtick / ダメージの間隔tick / 根の数 / 再発動で戻るMP (最大MPの割合、残り時間に比例)
      root-spread-ticks: 20
      root-life-ticks: 80
      root-period-ticks: 10
      root-count: 13
      root-mp-share: 0.12
      spike-count: 6                              # 強攻撃3: スパイクの数 (1ブロックごと) / 1本ごとに奥へ傾く角度 / 高さ / 太さ / 立っているtick
      spike-lean-step: 12.0
      spike-height: 2.5
      spike-width: 0.8
      spike-stand-ticks: 16
      spike-extra-count: 3                        # 強攻撃3の再発動: 空中からのスパイクの数 / 間隔tick / 1本の倍率
      spike-extra-gap-ticks: 3
      spike-extra-rate: 0.3
      sphere-radius: 4.0                          # 強攻撃4: 球の半径 / 縮むtick / 光るtick / 爆発の半径 / 引き込む強さ / 再発動で即爆発したときの倍率の割合
      sphere-shrink-ticks: 20
      sphere-glow-ticks: 40
      sphere-blast-radius: 3.5
      sphere-pull: 0.3
      sphere-early-share: 0.6
    # 戦士のシールド (戦士の近接コンボの強攻撃0「堅陣」と、通常2・強攻撃1で増える): 数 / 軽減する割合 / 残る最長の秒数。受けるたびに1枚なくなる
    warrior:
      shield-count: 3
      shield-seconds: 10
      shield-cut: 0.4
    # クラスごと・武器の種類ごとのコンボ (得意な武器を持ったときだけ出る)。通常攻撃5回 (5回目が最終段) と、強攻撃0〜4 (通常をN回出したあとが強攻撃N)。
    # 近接は左クリックが通常・右クリックが強攻撃、遠距離と設置は右クリックが通常・左クリックが強攻撃。
    # plan 名: cleric_melee / cleric_range / cleric_deploy、ranger_melee / ranger_range / ranger_deploy、mage_melee / mage_deploy (遠距離のメイジは mage)、
    #          assassin_melee / assassin_range / assassin_deploy、warrior_melee / warrior_range / warrior_deploy。
    # アサシンの近接コンボは、得意な武器を持てば常に使える。戦士の近接コンボは、守り (受けるダメージが減る・シールド) と一撃の重さ。
    # どのクラスがどの武器でコンボを出すか (得意) は、アイテムの classes: と、武器の種類ごとの既定値で決まる。
    # 作りは同じで、plan 名の下に次のキーを書くと数値を変えられる:
    #   hit-rate: [5つ]               通常1〜5の1ヒットの倍率 / hit-counts: [5つ] 通常1〜5のヒット数
    #   heavy-damage-multiplier: [5つ] 強攻撃0〜4の倍率 (意味は技ごと) / heavy-cooldown-ticks: [5つ] 強攻撃0〜4のクールタイム
    #   window-ticks: 通常攻撃の間隔 / normal-gap-ticks: 通常攻撃と次の最短の間隔
    # 設置・持続するもの (地面の陣・罠・壁など) は、必ず3秒以内に消え、同じ技をもう一度出すと前のは消える (2周目に残らない)。
    # 設置武器のコンボは、狙った場所に置いて数秒だけ残る物 (ランタン・罠・爆弾・砲台・旗) が基本。メイジの設置 (ランタン) だけは従来どおり。
    # レンジャーの遠距離の矢が受ける重力 (ブロック/tick^2。0 でまっすぐ飛ぶ)。照準は落ちる分だけ上げて補正される
    arrow-gravity: 0.02
    # レンジャーの矢: 落ち方に掛ける倍率 / 視線の先に当てるための狙い上げの割合 (1 = 視線の先に届く、小さいほど遠くで下に落ちる)
    arrow-drop-scale: 2.5
    arrow-aim-compensation: 0.6
    # 設置武器のコンボの通常攻撃の間隔 (tick、攻撃速度で短くなる):
    deploy-normal-ticks: 14
    # 置いたものから受ける回復の合計は、1秒あたり最大体力のこの割合(%)まで (ランタンを重ねても回復が増えすぎない)
    deploy-heal-cap: 1.5
    # 杖(遠距離)の光が、味方1人に1秒で与える回復の上限(最大体力の%)
    ally-heal-cap: 4.0
    # 設置武器のコンボ: 右クリックで置いた場所が残る時間と、次に置けるまでのクールタイム
    deploy-hold:
      life-seconds: 10                            # 置いた場所が残る秒数 (効果時間のステータスで延びる)
      cooldown-seconds: 10                        # 次の場所に置けるまでの秒数 (アイテムの灰色オーバーレイで見える)
    assassin_melee:
      stand-clone-seconds: 4.5                    # 強攻撃0のクローンが立っている秒数 (最大2体。強攻撃0のクールタイムは8秒)
      stand-clone-distance: 5                     # 強攻撃0のクローンを、向いている方へ飛ばす距離 (ブロック)
      clone-charge-rate: 0.15                     # 強攻撃0の2度目の再発動: クローンが突進して与える1体あたりの倍率 (武器ダメージ比)
      effect-clone-scale: 1                       # コンボ演出で出るクローン (立つクローン・アイテムスワップのクローン以外) の大きさ。人間モデルで光る縁取りは付かない (1未満にすると粒子の小さな姿になる。サーバーはプレイヤー型の拡大縮小ができない)
      step-dash-power: 0.5                        # 通常攻撃2の踏み込みの強さ (3 tick)
      shuriken-bounces: 3                         # 強攻撃1の手裏剣が跳ね返る回数
      shuriken-speed: 2                           # 強攻撃1の手裏剣の速さ (1tickあたりのブロック数。スワップのクローンの手裏剣も同じ)
      shuriken-range: 12                          # 強攻撃1の手裏剣の射程 (跳ね返りも含めて飛ぶ距離の合計。ブロック)
      shuriken-decay: 0.5                         # 手裏剣が跳ね返るたびに減るダメージの割合
      swap-copies: 10                             # アイテムスワップのクローンがコピーする攻撃の回数 (通常攻撃と強攻撃の両方)
      swap-copy-rate: 0.05                        # クローンのコピー1回の倍率 (武器ダメージの5%)
      swap-guard-share: 0.4                       # アイテムスワップ中、一撃で最大体力のこの割合以上のダメージを受けると、クローンがすべて壊れてそのダメージを無効にする
      swap-dash-power: 1.2                        # アイテムスワップ中の強攻撃0 (前方ダッシュ) の強さ (1 tick あたり)
      swap-dash-ticks: 5                          # そのダッシュの長さ (tick)
      swap-dash-rate: 0.03                        # そのダッシュが移動地点に与える倍率 (武器ダメージの3%。クールタイムは2 tick)
    cleric_melee:
      normal-gap-ticks: 10
    warrior_melee:
      normal-gap-ticks: 10
    ranger_deploy:
      normal-gap-ticks: 10
    ranger_range:
      normal-gap-ticks: 8
  # 武器 (アイテム) のスキルの発動: 近接も遠距離も Shift+右クリック。movement-plain: true にすると、移動スキル (dash / teleport) は右クリックだけで出る
  skill-trigger:
    melee-sneak: true
    movement-plain: false
  # 近接の範囲攻撃: 全員が持つ小さな範囲 (戦士の「近接範囲攻撃化」の下位互換)。戦士は上の 0.65 / area-radius
  melee-area-base-damage-rate: 0.40
  melee-area-base-radius: 2.0
  range-area-damage-rate: 0.45
  area-radius: 3.0
  # 遠距離範囲攻撃はクラス関係なく標準で範囲3・割合45%。メイジの「遠距離範囲の強化」で範囲5・割合60%
  range-area-expanded-damage-rate: 0.60
  range-area-expanded-radius: 5.0
  area-requires-facing: true
  range-distance: 16.0
  range-ray-size: 0.6
  # レンジャーの固有1 (神速の弾) を取ると、遠距離武器の射程にこの倍率が掛かる (弾は矢のように飛ぶ)
  ranger-range-multiplier: 2.0
  min-cooldown-ticks: 1
  status-effects:
    duration-ticks: 100
    # 爆破: 10スタックで周囲(explosion-radius)に、貯めた分のダメージ。explosion-delay-ticks 後に爆発 (0で即時)
    explosion-delay-ticks: 40
    explosion-radius: 3.0
    # 混乱: 100までスタックし、満タンでこのtick数だけ行動不能 (40 = 2秒)
    confusion-stun-ticks: 40
    # 気絶 (stun のステータス = 1回の攻撃で気絶させる確率%): 気絶する tick 数 (30 = 1.5秒。効果時間で延びる) と、同じ相手を続けて気絶させない免疫の tick 数 (100 = 5秒)
    stun-ticks: 30
    stun-immunity-ticks: 100
  cooldown-ticks:
    melee: 14
    range: 10
    deploy: 200
    special: 2
  deploy:
    radius: 6.0
    duration-ticks: 200
    min-duration-ticks: 20
    attack-period-ticks: 40
    min-attack-period-ticks: 6
    spawn-distance: 3.0
    height: 1.4
    bob-amplitude: 0.25
    bob-period-ticks: 40.0
    rotation-degrees-per-tick: 4.0
  effects:
    particle-size: 0.85
    # 攻撃の当たる範囲の地面の印 (敵の行動の telegraph・スキルの溜め): 印のフォント (iruurpg:marks、パック iruumark.zip) の円・扇・四角を、
    # 文字の表示 (text display) で地面に寝かせて (ブロックの上面と同じ向き)、範囲の形に合わせる。中身と外周を、別の色・濃さで出す。
    # 部品は重ならないので、半透明でも濃さがそろう。enabled: false = 今までのパーティクルの輪郭
    ground-mark:
      enabled: true
      fill-opacity: 90          # 中身の濃さ (0〜255。0 = 中身を出さない)
      rim-opacity: 210          # 外周の濃さ (0 = 外周を出さない)
      rim-width: 0.15           # 外周の太さ (ブロック。0 = 外周なし)。円・扇は、半径に対する割合の近い段 (3〜25%) に丸める
      rim-whiten: 0.35          # 外周の色を、中身の色より、どれだけ白に寄せるか (0〜1)
      outline: false            # true = 今までのパーティクルの輪郭も出す (印が範囲と合っているかを、ゲームで確かめるとき)
    melee-slash:
      enabled: true
      tilt: 45                  # 斬撃の傾き。向いている方向に水平な薙ぎを、横軸まわりに何度傾けるか (0 = 立てる、90 = 寝かせる)。視線の上下は無視する
      particles: 14
      radius: 1.35
      height: 1.15
      forward-offset: 0.25
      vertical-lift: 0.30
      angle-degrees: 105.0
    range-trail:
      enabled: true
      spacing: 0.55
      max-points: 30
      start-offset: 0.65
    range-impact:
      enabled: true
      particles: 12
      radius: 0.45
    range-hurt:
      enabled: true
      damage-indicators: 5
      red-dust: 5
    deploy-ring:
      enabled: true
      period-ticks: 2
      points: 72
      height: 0.15
    deploy-pulse:
      enabled: true
      points: 42

debug:
  target:
    max-health: 1000.0
    spawn-distance: 3.0

class-selection:
  # true: クラス未選択のプレイヤーがログインするとクラス選択メニューを開く
  open-on-join: true
  open-delay-ticks: 40

class-skill-points:
  # 何レベルごとに1SP獲得するか
  levels-per-point: 5
  # 獲得できるSPの上限。200Lvで完成(=40SP)。201Lv以降はエンドコンテンツ用に保留
  max-points: 40
  # SPを何ポイント使うごとに、解放ノードを順番に1つ無料で解放するか
  milestone-interval: 5

# 全クラス共通のレベル成長 (1レベルあたり)。クラス固有の成長は classes/*.yml の growth
level-growth:
  max-hp: 10
  max-mp: 0.4
  strength: 0.1
  magic: 0.1
  defense: 1.5
  hp-regen: 0.5
  mp-regen: 0.05

# 条件付きパッシブ (体力が半分以下 / 立ち止まっている間)
class-conditions:
  # 何tickごとに判定するか
  check-ticks: 5
  # 位置が動いていない判定が何回続いたら「立ち止まっている」とするか (check-ticks × この回数)
  stationary-samples: 2

# クラス効果の倍率。設計メモの式のとおり(1.0)。桁が大きすぎる場合の調整用
class-effects:
  gifted:
    # 出血 = レベル × 近接ダメージ × (100% + 近接ダメージ%) × この値
    bleed-scale: 1.0
    # 腐食・腐敗 = レベル × 遠距離ダメージ × (100% + 遠距離ダメージ%) ÷ 10 (= × 0.1)
    # 腐食は敵の防御を下げる値(0未満にならない)、腐敗は敵が被ダメージのたびに加算される特殊ダメージ
    decay-scale: 0.1
    # 本能開放の裂傷 = 設置ダメージ × 設置ダメージ% ÷ 100 × この値
    laceration-scale: 1.0
    # 本能開放の発動中に付く移動速度上昇のレベル (1 = 移動速度上昇 I、0 でなし)
    instinct-speed-level: 1
  assassin:
    # SATUJIN (コンボ強化) の間、通常攻撃に足される攻撃速度 (%)
    frenzy-attack-speed: 40
    # SATUJIN の間、発動した場所からこの半径 (ブロック) より外には出られない
    frenzy-radius: 12
  healer:
    # 回復→敵ダメージの範囲(ブロック)
    pulse-radius: 7

tutorial:
  # デバッグ用チュートリアル (/tutorialstart, /tutorialstop)
  # 終了時のテレポート先 (物語の開始地点)。world を空にすると実行者のいるワールド
  end-location:
    world: ""
    x: 60.5
    y: 80.0
    z: 170.5
    yaw: 0.0
    pitch: 0.0
  # NPCが前方に立つ距離と、横へ移動する距離 (実行位置からの相対ブロック数)
  npc-distance: 2.5
  npc-side-offset: 2.0
  # ねずみを攻撃しなかったとき、促すまでの秒数
  idle-nudge-seconds: 20

quest:
  # 通貨の名前
  currency-name: "ゴールド"
  # サブ依頼が入れ替わる時刻 (この時刻から24時間)。タイムゾーンは下
  sub-reset-hour: 4
  time-zone: "Asia/Tokyo"
  # 一度に出るサブ依頼の件数
  sub-count: 4

crafting:
  # クラフトを1回するたびに経験が1たまり、この回数ごとにクラフトレベルが1上がる
  crafts-per-level: 3
  # ランダム強化: 1つの強化が付く確率 = base-chance + chance-per-level * レベル (上限 max-chance)
  # 強化の最大数 = 1 + レベル / slots-level-step (上限 max-slots)
  base-chance: 0.2
  chance-per-level: 0.05
  max-chance: 0.85
  slots-level-step: 4
  max-slots: 4

# クラフトのランダム強化の上限。(サーバーの config.yml に自動で足されるよう、crafting とは別の節にしてある)
craft-caps:
  # クラフトレベルの最大
  max-level: 255
  # ランダム強化の値の上限: 「クラフトレベル最大(max-level)のときの最大値」を stat-max に書く。
  # 実際の上限 = その値 × (いまのクラフトレベル / max-level)。値は 1 から上限までの完全ランダム。
  # 耐性(physical-resist / magic-resist)は % で書く。
  # 出血・腐食・腐敗・裂傷・混乱・爆破は、その武器の武器ダメージ × debuff-weapon-multiplier
  debuff-weapon-multiplier: 200
  stat-max:
    max-hp: 2000
    max-mp: 2000
    hp-regen: 100
    mp-regen: 100
    weapon-damage: 50
    strength: 1000
    magic: 1000
    strength-percent: 10
    magic-percent: 10
    melee-damage: 2000
    range-damage: 2000
    deploy-damage: 2000
    melee-damage-percent: 20
    range-damage-percent: 20
    deploy-damage-percent: 20
    crit-damage: 100
    crit-chance: 20
    magic-overload: 200
    stability: 20
    duration: 20
    attack-speed: 20
    move-speed: 50
    defense: 2000
    physical-resist: 100
    magic-resist: 100
    damage-reduction: 20
    special-damage: 2000
    absorb-percent: 5
    slow-percent: 30
    # 属性 (5色それぞれに同じ上限)
    element-damage: 2000
    element-damage-percent: 15
    element-resist: 20

# 物理: 全てのエンティティ (プレイヤー・モブ) の直接攻撃のノックバックと、エンティティ同士の衝突
# (スキルが意図的に飛ばす・引き寄せる動きは、これに関係なく動く)
physics:
  no-knockback: true   # ノックバック耐性を最大にする
  no-collision: true   # 押し合わない (チームの衝突ルールも NEVER)

# フリーマーケット (/market)。ゴールドの名前は quest.currency-name
market:
  max-price: 1000000          # 単価の上限
  max-quantity: 9999          # 1回の出品の個数の上限
  max-delay-hours: 168        # 購入可能までの期間の上限 (時間)
  max-duration-hours: 168     # 購入可能期間の上限 (時間)
  max-listings-per-player: 10 # 同時に出品できる件数
  # 手数料 = 値段の分 + 個数の分 + 待ち時間の分 + 販売期間の分 (それぞれ切り上げ、合計は最低 minimum)
  fee:
    price-percent: 1.0                # 総額 (単価×個数) の何%
    per-item: 1.0                     # 1個あたり何ゴールド
    delay-percent-per-hour: 0.1       # 購入可能までの待ち時間 1時間あたり、総額の何%
    duration-percent-per-day: 0.5     # 購入可能期間 1日あたり、総額の何%
    minimum: 1

# インスタンスダンジョン (/dungeon)。ダンジョンの中身は dungeons/*.yml
dungeon:
  max-instances: 5          # 同時に開けるダンジョンの数
  empty-close-seconds: 60   # 誰もいない状態がこの秒数続いたら閉じる
  boss-kill-percent: 80     # ボス部屋への入口が開くのに必要な、ボス以外の敵を倒した割合 (%、切り上げ)
  # 本番用: true にすると、ダンジョンは世界に置いた入口 (/dungeon gate <id>) からしか入れない。
  # false の間は、メニューやコマンドからも入れる (入口の右クリックはいつでも使える)
  require-gate: false
  gate-range: 6             # 入口から何ブロック以内なら「入口にいる」とみなすか
  blocked-commands:         # ダンジョンの中で使えないコマンド (op は使える)
    - trade
    - market
    - fm
    - tutorialstart

# 一般フィールドのモブスポナー (/spawner edit で置く。設定はスポナーごとにも変えられる)
field-spawner:
  enabled: true
  default-radius: 48         # プレイヤーがこの距離まで近づくと湧く (新しく置くスポナーの初期値。スポナーごとに 8〜128)
  min-count: 1               # 一度に湧く数 (最小・新しく置くスポナーの初期値)
  max-count: 2               # 一度に湧く数 (最大)
  max-alive: 2               # 同時に生きられる数
  respawn-seconds: 20        # 湧いてから次に湧けるまでの間隔
  spread: 3                  # スポナーの周りにばらける距離 (ブロック)
  leash-distance: 64         # スポナーからこれ以上離れたモブは消す (また湧けるように)
  idle-despawn-minutes: 10   # 湧いてからこの分数たっても、戦闘中でなければ消す
  combat-radius: 16          # モブの近くにプレイヤーがこの距離以内にいる間は戦闘中とみなす

# 画面右のサイドバー (上に点滅する iruuRPG、下にサーバーのアドレス。間に名前・レベル・クラス・所持金・現在地・時刻)
sidebar:
  enabled: true
  title: "iruuRPG"
  address: "mc.tkgon.net"
  blink:                    # 上のタイトルと下のアドレス: ちかちか〜っと一気に点滅し、しばらく同じ色、をくり返す
    burst-seconds: 1.5      # 点滅する時間
    steady-seconds: 6.0     # 同じ色のままの時間
  default-area: "Iruu大陸"   # どのエリアにも入っていないときの現在地
  clock: game               # 時刻: game = そのワールドのゲーム内の時刻 / real = 現実の時刻 (time-zone)
  time-zone: "Asia/Tokyo"
  # 現在地のエリア: 中心 (x, z) から半径 radius ブロックの円。重なったら中心に近い方。world を省くとどのワールドでも
  areas:
    - name: "アトラス港"
      x: 60
      z: 170
      radius: 60

# yml の自動取り込み: plugins/iruuRPG (yml リポジトリの作業コピー) で interval-seconds ごとに
# git pull --ff-only origin <branch> を実行し、コミットが変わったら再起動なしで読み直す。
# 結果は plugins/iruuRPG/reload-report.txt。手動は /iruurpg sync
yml-sync:
  enabled: true
  interval-seconds: 60
  # 自動の同期は、時計の何秒に動くか (0〜59)。毎分 0 秒に動くほかの仕事 (同じフォルダを pull するスクリプト) と、git のロックで、ぶつからないように
  second: 30
  branch: main

# パーティー (/party、仲間内のチャットは /p)。ログアウトや再起動のあとも続く (plugins/iruuRPG/parties.yml)
party:
  max-size: 4            # 1つのパーティーの最大人数
  # 経験値: 敵に5%以上ダメージを与えた仲間で人数割り。パーティーでない人は本人が全部。
  # 与えていない仲間は、敵からこの距離 (ブロック) 以内なら xp-bystander-percent % をもらう
  xp-share-range: 40
  xp-bystander-percent: 5

# ファストトラベル (/travel、メインメニュー)。地点は運営が /travel set <id> [名前] で置く。近くまで歩くと使えるようになる
travel:
  channel-ticks: 60       # 移動の準備 (光の演出) の長さ (1秒=20)。動く・攻撃を受けると中断
  cost: 0                 # 1回の料金 (ゴールド)
  discover-radius: 6      # この距離 (ブロック) まで近づくと、その地点を見つけたことになる

# ストレージ: 各地のエンダーチェストを開くと専用の画面になり、アイテムをしまえる (1ページ45マス)。
# 最初の free-pages ページは無料、次のページから、ゴールドで解放する。
# 価格 (仮): 最初の有料ページ = price-base、そのあとは 1ページごとに price-growth 倍 (ゆるやかな指数、50ゴールド単位に丸める)
# 既定だと 500 → 900 → 1600 → 2900 → 5250
storage:
  max-pages: 6
  free-pages: 1
  price-base: 500
  price-growth: 1.8

# 斬撃・範囲攻撃などの派手な演出 (弧を刃が走るように描く)。重いときは enabled: false か samples-per-block を下げる
slash-vfx:
  enabled: true
  # 弧1ブロックあたりの点の数 (大きいほど滑らかだが粒子が増える)
  samples-per-block: 10
  # 斬撃の粒子の大きさ (小さいほど細かい刃になる)
  particle-size: 0.7
  # 斬撃の大きさの倍率 (幅は広げない。粒子の線の間隔はせまく、外側ほど明るい色になる)
  size-scale: 1.2

# 技の粒子 (グラデーションで描く演出) の細かさ。size-scale は粒子の大きさ (小さいほど細かい)、density は点の数の倍率 (大きいほど密で、粒子が増える)
vfx:
  size-scale: 0.8
  # 線・輪・球ではなく、ぽつぽつと出る点 (光の粒など) の大きさの倍率。ほぼ元の大きさに戻してある
  sparse-size-scale: 0.95
  density: 2.2

# 攻撃の音 (バニラの小さな音を重ねて作った音)。うるさければ volume を下げる
attack-sounds:
  enabled: true
  volume: 1.0

# 敵の追尾。見えるプレイヤーだけに気づく (壁の向こうは気づかない)
mob-ai:
  # この距離以内で、遮るものがなく見えるプレイヤーに気づく
  sight-range: 16.0
  # この距離以内なら、見えなくても気づく (足音)
  close-range: 5.0
  # これより離れたら諦める
  lose-range: 28.0
  # 見失ってから、この時間 (tick) は居場所を覚えて追う
  memory-ticks: 100

# プレイヤーのスキル (skills/*.yml を武器・クラスで使うもの) の上限
skill-limits:
  # damage-rate (武器ダメージに対する倍率) の上限。これを超える値は、この値として扱う
  player-damage-rate-max: 8.0

# バランス調整
balance:
  # レベルアップに必要な経験値の倍率 (10 = 元の10倍)
  xp-requirement-multiplier: 10.0
  # 全クラスの遠距離攻撃の射程の倍率 (combat.range-distance に掛ける)。メイジの「広域魔法」で2倍に戻る
  range-multiplier: 0.5
  # 遠距離武器の弾の速さ (ブロック/秒)。レンジャーは即着弾、メイジの「詠唱加速」は攻撃速度%ぶん速くなる
  projectile-speed: 40.0

# アクションバー
hud:
  # 近接 (赤) / 遠距離 (青) / 設置 (白) の「通常攻撃」のクールタイムのゲージ [||||||||||]: HP・MPの横に出る。
  # 通常攻撃が使えるときは緑、クールタイム中は進み具合を各色のうすい色で出す。
  # (アイテムのクールダウン表示は、武器のスキルだけ。スキルのクールタイムはゲージには出さない)
  # auto = どれかの通常攻撃がクールタイム中か、ダメージを与えていて DPS が 0 でない間 (終わって1.5秒まで) だけ出す (ふだんは HP / MP / DEF / Lv / XP の表示)、always = いつも出す、off = 出さない
  cooldown-gauges: auto

# プロシージャルツール (/proceduraltool、別名 /treetool)。木・岩・スパイク・結晶を、部位ごとの色違いのウールで作る (あとから手動で本物のブロックに変える)
treetool:
  # 1本の木のブロック数の上限 (超えたら作らない)
  max-blocks: 60000
  # 1tickに調べて置くブロック数 (少しずつ。多いと一瞬重くなる)
  blocks-per-tick: 4000
  # (木は FastAsyncWorldEdit 経由で置くので、//undo と //redo で戻せる)
  # プレビュー (ガラスの木): 設定を最後に変えてから反映するまでの tick (15 = 0.75秒。変えるたびに数え直す)
  preview-delay-ticks: 15
  # プレビューで1tickに送るブロック数 / プレビューする木のブロック数の上限 (超えたら見せない)
  preview-blocks-per-tick: 3000
  preview-max-blocks: 40000
  # true にすると、地形など固いブロックも置き換える。false は空気と草花だけ
  replace-solid: false
  # メニューで設定できる高さと幅の上限
  max-height: 80
  max-width: 60
  # クモの巣: 選べる点の数 / 点のまわりの地形を読む範囲の大きさ (ブロック数。超えたら作らない)。巣は空気にしか置かない
  web-max-points: 16
  web-max-volume: 400000
  # 部位ごとのブロック
  materials:
    trunk: BROWN_WOOL
    root: BLACK_WOOL
    branch: ORANGE_WOOL
    twig: YELLOW_WOOL
    leaf: GREEN_WOOL
    # 岩・スパイク・結晶の部位
    stone: GRAY_WOOL
    stone-light: LIGHT_GRAY_WOOL
    stone-dark: BLUE_WOOL
    moss: LIME_WOOL
    crystal: LIGHT_BLUE_WOOL
    crystal-core: WHITE_WOOL
    # クモの巣 (糸は本物のクモの巣ブロック。プレビューでもクモの巣のまま見える)
    web-frame: COBWEB
    web: COBWEB

# モデル機能 (model/): Blockbench の .bbmodel を、敵に着せる。モデルは plugins/iruuRPG/models/*.bbmodel、パックは resourcepacks/iruumodel.zip (docs/models.md)
model:
  enabled: true
  auto-build: true         # 起動時にモデルを読み、パックを作る (中身が同じなら書き換えない)
  base-item: PAPER         # 部品を表示するアイテム (パックが、このアイテムのモデルに部品を足す)
  cmd-base: 8100000        # 部品の custom model data の最初の番号
  update-ticks: 2          # 何tickごとにモデルの姿勢を更新するか
  view-distance: 48.0      # この距離にプレイヤーがいるときだけ更新する
  walk-speed: 1.0          # モデルの walk アニメーションが想定する歩く速さ (ブロック/秒)。mob の実際の速さとの比で、walk の再生速度を変える (足が地面を滑らない)
  death-vanish-seconds: 0.6  # death アニメーションのあと、煙を出して縮んで消えるまでの秒数 (0 で煙なし: 0.6 秒止まって消える)

# BGM (bgm/): plugins/iruuRPG/bgm/ の .nbs (Note Block Studio) を、範囲 (bgm/volumes.yml) に入ったプレイヤーに流す。音量はメニューの「設定」。
bgm:
  enabled: true
  check-ticks: 10          # 何tickごとに、プレイヤーがどの範囲にいるかを調べるか (10 = 0.5秒)
  watch-ticks: 100         # 何tickごとに、bgm フォルダの曲と volumes.yml が変わっていないか見るか (100 = 5秒)。変わっていれば、再起動なしで読み直す

# リソースパック (pack/): 入ってきたプレイヤーに、下のパックを送る。サーバー専用パック (server.zip: 草ブロックを全面草にする) と、
# モデル機能のパック (iruumodel.zip: /iruumodel build が作る) と、アイテムの見た目のパック (iruuitem.zip: itempack/ が作る) は別のパック。zip は plugins/iruuRPG/resourcepacks/ にある。
resourcepack:
  enabled: false
  # zip を置いた場所の URL (Web サーバーが resourcepacks/ を配る)。末尾は / でも無くてもよい。空で host を使う
  base-url: ""
  prompt: "iruuRPG のリソースパック"
  packs:
    server:
      file: server.zip
      enabled: true
      required: false
    models:
      file: iruumodel.zip
      enabled: true
      required: false
    items:
      file: iruuitem.zip
      enabled: true
      required: false
  # Web サーバーが無いときの、プラグイン内蔵の小さな配信 (GET だけ、packs の zip だけ)。port をプレイヤーに開けること
  host:
    enabled: false
    port: 8765
    bind: 0.0.0.0
    public-host: ""

# ペイントブラシ (/ibrush)。建築用のツールで、ゲームの処理とは別 (tools/brush)。描画は FastAsyncWorldEdit 経由なので //undo で戻せる
brush:
  # 半径の上限 (大きいと重い)
  max-radius: 32
  # 1回で変えるブロック数の上限 (超えたら途中で止める)
  max-blocks: 120000
  # 見ている先のブロックを探す距離
  range: 120
  # 右クリックの長押しで続けて使うときの最短の間隔 (tick)
  cooldown-ticks: 4
  # プレビューで見せるブロック数の上限と、見せている時間 (tick)。プレビューは本人にだけ見え、世界は変わらない
  preview-blocks: 1500
  preview-ticks: 80
  # 追従プレビュー (/ibrush preview): 設定を変えるか見ている所が動いてから更新するまでの tick (15 = 0.75秒) と、使える半径の上限
  preview-delay-ticks: 15
  preview-max-radius: 16
  # 右クリックを押したままなぞるとき、グラデーション「なぞった線に沿って」が最初→最後になるまでの長さ (ブロック)
  stroke-length: 24
  # 選択ツール (別のアイテム)。探すのは少しずつ (1tickに調べるブロック数)、表示は縁だけを近くの粒子で
  selection:
    max-radius: 64
    max-blocks: 300000
    blocks-per-tick: 20000
    display-range: 20
    display-particles: 800

