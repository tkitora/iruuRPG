      util-power: 1                               # util: 1 tick に進むブロック数 (前へ。Shift を押しながらだと後ろへ。移動中は無敵)
      util-ticks: 5                               # util: その長さ (tick)
      util-rate: 0.2                              # util: すり抜けた敵への倍率 (刻印も刻む)
    # クレリックの近接 = メイスと盾 (サブタンク) (t168、nekorozv がすべて任せた。ClericMeleeCombo の通常攻撃と ClericSkills のスキル)。値はすべて仮。
