rarity:
  mark: "🙥"

# アイテムの yaml が変わったら、ゲーム内のアイテムを新しい内容に作り直す (docs/item-patch.md)。
# false にすると、作り直しも印付けもしない (アイテムはそのまま)。true に戻すと、次の読み直し・ログインで確認する
item-patch:
  enabled: true

# 素材以外 (武器・防具) をスタックさせない移行 (design/item-foundation-2026-10-31.md)。off / dry-run / apply
#   off: 何もしない (新しく作る武器・防具は、もとから重ならない)
#   dry-run: 何も変えず、何を何個どう変えるかを plugins/iruuRPG/item-migration-report.txt に書く (プレイヤーはログインしたとき)
#   apply: 重なっている武器・防具を 1 個ずつに分け、印を付ける。変える前に backups/item-migration/ にバックアップ。/itemmigration restore で戻せる
item-migration:
  mode: "off"            # 引用符が要る (YAML では off が「いいえ」になる)

player:
  level-cap: 256
  first-release-level-cap: 20
  initial-max-hp: 20.0       # 初期体力 (新しく始めるプレイヤー。すでに遊んでいる人の体力は変わらない)
  default-hp-regen-per-3s: 1.0
  default-max-mp: 20.0
  default-mp-regen-per-3s: 5.0
  mp-regen-period-ticks: 60
  leveling:
    drop-experience-orbs: true
    experience-orb-speed: 0.32

# 体幹 (モデルに hurt アニメーションがある敵): 当たるたびにゲージがたまり、満タンで「よろける」(hurt を再生して一瞬止まる)。
# すべての被弾で hurt を出すのではなく、数発に1回。大きなスタンではない。敵ごとに mobs の model: の poise: で上書きできる
poise:
  max: 100                 # 満タンの値
  per-hit: 30              # 1発ごとに必ずたまる量 (HP の多い敵でも、たまるのが遅くなりすぎない)
  damage-scale: 100        # 与えたダメージの割合 (最大HPに対する) にかける量。最大HPの10%のダメージで +10
  drain-delay: 2.5         # 当たらないまま、この秒数がたつと減り始める
  drain-per-second: 30     # 減る速さ (1秒あたり)
  flinch-seconds: 0.35     # よろけて止まる長さ (秒)
  min-interval: 1.5        # よろけてから、次によろけられるまでの秒数 (よろけ続けない)

mob:
  default-max-hp: 20.0
  default-max-mp: 1.0
  vanilla-health-proxy: 20.0
  spawn-distance: 3.0
  attack-tags: true          # 敵の名前の前に [物・近] のように、物理/魔法と近接/遠距離を出す
  target-range: 24.0
  player-damage-multiplier: 0.10
  # /iruurpg btdebug で出す、ビヘイビアツリーの敵の状態表示: この距離内の敵だけ表示する
  behavior-view:
    range: 40.0
  status-display:
    enabled: true
    y-offset: 0.0
    anchor-lift: 0.45
    line-width: 90
    view-range: 24.0
    update-period-ticks: 1
    # 頭上の表示の動きをなめらかにする補間のtick数 (大きいほど滑らかだが、少し遅れる)
    interpolation-ticks: 3

combat:
  debug-damage-in-creative: true
  melee-area-damage-rate: 0.65
  # 右クリックの長押し: true なら、押しっぱなしの右クリック (クライアントが4tickごとに送り直す) で、右クリックの攻撃
  # (遠距離・設置の通常攻撃) を連続して出せる。間隔は、それぞれのクールタイムのまま。左クリックは、押しっぱなしでも1回しか届かない。
  # (近接の右クリック = アイテムスキルは、押しっぱなしでも1回)
  hold-right-click: true
  # アサシンの分身を、本人と同じスキンの人型のエンティティで出す (パケットで本人以外にも見える)。false か、出せないときは、従来の粒子の人型
  clone-entity: true
  # ブロックを右クリックしてから、この tick の間は、左クリック (通常攻撃) として数えない (右クリックのあとの腕振りが、通常攻撃になるのを防ぐ)
  right-click-block-left-lock-ticks: 10
  # スキル (2026-11-02 の改編、既定のキーは t164)。武器の「通常のボタン」= 近接は左、遠距離・設置は右。もう一方を「別のボタン」とする。
  #   小 = F → 左、中 = F → 右 (どの武器でも同じ)、大 = F → F、
  #   util (回避) = 別のボタンだけ (近接 右 / 遠距離 左)、ULT = Shift+Q (クラススキル)、アイテムスキル = Q、通常攻撃 = 通常のボタンだけ。
  #   F だけでは何も出ない。Q でアイテムを落とすことはない。設置の武器には 小・中・大・util は無い (ULT だけ。Shift+F で設置を消す)。
  #   設定 → キー操作 で、プレイヤーごとに Q と F を入れ替えられる (t162)。
  # key-window-ticks: F のあと、2 つ目のキー (ボタン・F) を待つ時間
  # cooldown-seconds: 各スキルのクールタイム (秒)。default が全クラス、クラスの id (warrior / mage / healer / gifted / assassin) の下は、そのクラスだけ。
  #   ULT はクラススキルのクールタイムの代わりに、これを使う。小・中・大 は、クラスの技ができるまで、今までのスキル1〜3 (下の heavy-input) のクールタイム。
  #   util は、クラスの技ができるまで無い。(プレイヤーのスキルのクールタイム短縮も掛かる)
  skill-slots:
    key-window-ticks: 20
    cooldown-seconds:
      default: {small: 7, medium: 12, large: 25, util: 5, ult: 100}
      warrior: {medium: 10, large: 30}
      healer: {util: 15}
      gifted: {small: 3, medium: 7, large: 20}
      assassin: {large: 24}
  # 今までのスキル1〜6 (以前の強攻撃)。いまは 小・中・大 がスキル1〜3 を出す (クラスの技ができるまで)。
  # keep-chain: true なら、強攻撃のあとも通常攻撃のコンボが続く (false: 強攻撃でコンボが1段目に戻る、t116 より前の動き)
  # later-cooldown-ticks: コンボの設定 (heavy-cooldown-ticks) が無いときの、スキル2〜スキル6 (強2〜強5 と t138 のスキル6) のクールタイム (tick)。スキル1 は各コンボの値
  heavy-input:
    keep-chain: true
    later-cooldown-ticks: [60, 80, 100, 120, 140]
  # Q キー: keep-items: true なら、ホットバーの Q / Ctrl+Q で何も落とさない (false: 武器以外は今までどおり落とせる)
  q-key:
    keep-items: true
  # 近接の弱・強コンボ (クラスのコンボがない武器): 左クリックが弱、強攻撃 (小・中・大) が強。弱を light-count 回つなげた最後が「最終段」
  combo:
    enabled: true
    light-count: 5               # 弱の連続回数 (最後の1回が最終段)
    window-ticks: 32             # 次の攻撃までにこれ以上あくとコンボが切れる
    heavy-damage-multiplier: 2.0 # 強のダメージ倍率 (弱を何回かつなげた後だと、1回ごとに heavy-stage-bonus が足される)
    heavy-stage-bonus: 0.15
    heavy-recovery-ticks: 8      # 強のあとの追加の硬直。強攻撃を出したあと、この間 (tick) は通常攻撃 (左クリック) が始まらない
    finisher-damage-multiplier: 2.0
    finisher-recovery-ticks: 8
    # メイジのコンボ (遠距離武器): 通常攻撃 = 右クリック (5段)、強攻撃 = 強1〜強5 (小・中・大 が強1〜強3) (設定の番号は 0〜4。強1 = 番号0 は、前の強攻撃の再発動)。
    # 色は武器の属性と紫 (強い技ほど紫が多い)。通常攻撃は、武器の通常の間隔に normal-gap-extra-ticks だけあきが足される (2〜4tick程度)。
    # 通常1は左から弧を描く弾 (85%)、2は右から (90%)、3は左・上・右の弾3発 (38%×3)、4は扇から収束して交差する大きな弾3発 (45%×3)、
    # 5は通常1〜4が当たった敵の足元に立つ魔力の円柱 (80%×2)。通常1〜4の弾は、狙った敵がいればその敵を追う。
    # 強2 = 通常1が当たった敵を追う弾2発 (70%、当てていないときは前方への直進弾)、強3 = 足元から広がる根 (20%ずつ、半径 root-radius)、
    # 強4 = 前方に1ブロックごとのスパイク6本 (90%)、強5 = 狙った場所の崩壊する球 (170%、縮んで引き込み、光ってから爆発)。
    # 強1 はそれ自体の効果はなく、再発動できる強攻撃があればそれを発動する (強2 当てた敵への追加弾 / 強3 根を自分に戻して MP を回復 /
    # 強4 スパイクが当たった敵に空中から追加のスパイク3本 (30%) / 強5 光っている球をすぐ爆発 (60%))。強2〜強5を撃つと、echo-delay-ticks 後にもう一度自動で出る。
    mage:
      normal-gap-extra-ticks: 3                   # 通常攻撃と次の通常攻撃の間隔に足すtick数 (右クリックの長押しは1回の扱い)
      # 通常1〜5: 1回の倍率 / 当たる回数 (1 左から弧を描く弾、2 右から、3 左・上・右の3発、4 扇から収束して交差する大きな弾3発、5 当てた敵の足元からの円柱 x2)
      # hit-rate: [0.85, 0.9, 0.38, 0.45, 0.8]
      # hit-counts: [1, 1, 3, 3, 2]
      # 強2〜強5の倍率 (リストの2〜5番目): 強2 追加の弾1発 (当てていないときの直進弾は straight-share 倍)、強3 根の1回ごと、強4 スパイクの1回 (1体に1回)、強5 爆発
      # heavy-damage-multiplier: [0.0, 0.7, 0.2, 0.9, 1.7]
      reactivate-seconds: 3.0                     # 強4の再発動を受け付ける秒数
      echo-delay-ticks: 40                        # 強2〜強5がもう一度出るまで / クールタイム秒 / 1回当てるごとに縮む秒 / 同時に待てる数 / もう一度の倍率
      echo-cooldown-seconds: 8.0
      echo-cut-seconds: 1.0
      echo-queue-max: 3
      echo-rate: 1.0
      funnel-straight-ticks: 5                    # 通常4: 交差したあと直進するtick数 (1tick 1.5ブロック)
      pillar-radius: 1.6                          # 通常5: 円柱の半径 / 高さ / 出るまでのtick / 2回目までのtick / 敵を探す距離
      pillar-height: 4.0
      pillar-delay-ticks: 5
      pillar-gap-ticks: 4
      pillar-reach: 24.0
      seeker-count: 2                             # 強2: 通常1が当てた敵への追加の弾の数 / 速さ / 飛ぶ最長tick / 当てていないときの直進弾の倍率
      seeker-speed: 1.4
      seeker-ticks: 50
      straight-share: 1.4
      root-radius: 6.0                            # 強3: 根の半径 / 広がりきるまでのtick / 残るtick / ダメージの間隔tick / 根の数 / 再発動で戻るMP (最大MPの割合、残り時間に比例)
      root-spread-ticks: 20
      root-life-ticks: 80
      root-period-ticks: 10
      root-count: 13
      root-mp-share: 0.12
      spike-count: 6                              # 強4: スパイクの数 (1ブロックごと) / 1本ごとに奥へ傾く角度 / 高さ / 太さ / 立っているtick
      spike-lean-step: 12.0
      spike-height: 2.5
      spike-width: 0.8
      spike-stand-ticks: 16
      spike-extra-count: 3                        # 強4の再発動: 空中からのスパイクの数 / 間隔tick / 1本の倍率
      spike-extra-gap-ticks: 3
      spike-extra-rate: 0.3
      # 強5: 球の半径 / 爆発まで縮み続けるtick / いちばん小さくなって光る (ハイライト・フラッシュ) tick / 爆発の半径 /
      # 引き寄せ (1tickに足す速さ。敵の動きに足すだけなので、それより速く離れる敵は抜け出せる) / 再発動で即爆発を受け付け始めるtick / そのときの倍率の割合 / 殻の粒の数
      sphere-radius: 4.0
      sphere-shrink-ticks: 50
      sphere-highlight-ticks: 8
      sphere-blast-radius: 3.5
      sphere-pull: 0.035
      sphere-early-after-ticks: 20
      sphere-early-share: 0.6
      sphere-flow-count: 140
      vfx-density: 0.6                            # メイジの演出の粒の量 / 大きさ (1 = 減らさない)。画面を占めすぎないように
      vfx-size: 0.85
    # 戦士のシールド (戦士の近接コンボの強1「堅陣」と、通常2・強2で増える): 数 / 軽減する割合 / 残る最長の秒数。受けるたびに1枚なくなる
    warrior:
      shield-count: 3
      shield-seconds: 10
      shield-cut: 0.4
    # クラスごと・武器の種類ごとのコンボ (得意な武器を持ったときだけ出る)。通常攻撃5回 (5回目が最終段) と、強攻撃 強1〜強5 (小・中・大 が強1〜強3)。
    # 設定のリスト (heavy-damage-multiplier / heavy-cooldown-ticks) は強1〜強5 の順 (番号 0〜4)。強攻撃のあとも、通常攻撃のコンボは続く。
    # heavy-cooldown-ticks を書かないとき、強2〜強5 のクールタイムは heavy-input.later-cooldown-ticks (60 / 80 / 100 / 120 tick。強1 は各コンボの値)。
    # plan 名: cleric_melee / cleric_range / cleric_deploy、ranger_melee / ranger_range / ranger_deploy、mage_melee / mage_deploy (遠距離のメイジは mage)、
    #          assassin_melee / assassin_range / assassin_deploy、warrior_melee / warrior_range / warrior_deploy。
    # アサシンの近接コンボは、得意な武器を持てば常に使える。戦士の近接コンボは、守り (受けるダメージが減る・シールド) と一撃の重さ。
    # どのクラスがどの武器でコンボを出すか (得意) は、アイテムの classes: と、武器の種類ごとの既定値で決まる。
    # 作りは同じで、plan 名の下に次のキーを書くと数値を変えられる:
    #   hit-rate: [5つ]               通常1〜5の1ヒットの倍率 / hit-counts: [5つ] 通常1〜5のヒット数
    #   heavy-damage-multiplier: [5つ] 強1〜強5の倍率 (意味は技ごと) / heavy-cooldown-ticks: [5つ] 強1〜強5のクールタイム
    #   window-ticks: 通常攻撃の間隔 / normal-gap-ticks: 通常攻撃と次の最短の間隔
    # 設置・持続するもの (地面の陣・罠・壁など) は、必ず3秒以内に消え、同じ技をもう一度出すと前のは消える (2周目に残らない)。
    # 設置武器のコンボは、狙った場所に置いて数秒だけ残る物 (ランタン・罠・爆弾・砲台・旗) が基本。メイジの設置 (ランタン) だけは従来どおり。
    # レンジャーの遠距離の矢が受ける重力 (ブロック/tick^2。0 でまっすぐ飛ぶ)。照準は落ちる分だけ上げて補正される
    arrow-gravity: 0.02
    # レンジャーの矢: 落ち方に掛ける倍率 / 視線の先に当てるための狙い上げの割合 (1 = 視線の先に届く、小さいほど遠くで下に落ちる)
    arrow-drop-scale: 2.5
    arrow-aim-compensation: 0.6
    # 設置武器のコンボの通常攻撃の間隔 (tick、攻撃速度で短くなる):
    deploy-normal-ticks: 14
    # 置いたものから受ける回復の合計は、1秒あたり最大体力のこの割合(%)まで (ランタンを重ねても回復が増えすぎない)
    deploy-heal-cap: 1.5
    # 杖(遠距離)の光が、味方1人に1秒で与える回復の上限(最大体力の%)
    ally-heal-cap: 4.0
    # 設置武器のコンボ: 右クリックで置いた場所が残る時間と、次に置けるまでのクールタイム
    deploy-hold:
      life-seconds: 10                            # 置いた場所が残る秒数 (効果時間のステータスで延びる)
      cooldown-seconds: 10                        # 次の場所に置けるまでの秒数 (アイテムの灰色オーバーレイで見える)
    assassin_melee:
      stand-clone-seconds: 10                     # 強1のクローン (中のデコイ) が立っている秒数 (分身は最大4体。2026-11-02 の改編で「残すものは 10 秒ほど」)
      decoy-hit-rate: 0.2                         # 強1のクローン (中のデコイ) が、近くの敵を斬る倍率 (強1の倍率比)
      decoy-hit-ticks: 10                         # その間隔 (tick)
      decoy-reach: 3.5                            # 斬る敵を探す範囲 (ブロック)
      util-decoy-seconds: 10                      # スキル6 (util の影渡り) で、走り出した所に残す分身の秒数
      stand-clone-distance: 5                     # 強1のクローンを、向いている方へ飛ばす距離 (ブロック)
      clone-charge-rate: 0.15                     # 強1の2度目の再発動: クローンが突進して与える1体あたりの倍率 (武器ダメージ比)
      effect-clone-scale: 1                       # コンボ演出で出るクローン (立つクローン・アイテムスワップのクローン以外) の大きさ。人間モデルで光る縁取りは付かない (1未満にすると粒子の小さな姿になる。サーバーはプレイヤー型の拡大縮小ができない)
      step-dash-power: 0.5                        # 通常攻撃2の踏み込みの強さ (3 tick)
      shuriken-bounces: 3                         # 強2の手裏剣が跳ね返る回数
      shuriken-speed: 2                           # 強2の手裏剣の速さ (1tickあたりのブロック数。スワップのクローンの手裏剣も同じ)
      shuriken-range: 12                          # 強2の手裏剣の射程 (跳ね返りも含めて飛ぶ距離の合計。ブロック)
      shuriken-decay: 0.5                         # 手裏剣が跳ね返るたびに減るダメージの割合
      swap-copies: 0                              # アイテムスワップのクローンがコピーする攻撃の回数 (通常攻撃と強攻撃の両方)。0 = 制限なし (立っている間ずっと)
      swap-copy-rate: 0.05                        # クローンのコピー1回の倍率 (武器ダメージの5%)
      swap-guard-share: 0.4                       # アイテムスワップ中、一撃で最大体力のこの割合以上のダメージを受けると、クローンがすべて壊れてそのダメージを無効にする
      swap-dash-power: 1.2                        # アイテムスワップ中の強1 (前方ダッシュ) の強さ (1 tick あたり)
      swap-dash-ticks: 5                          # そのダッシュの長さ (tick)
      swap-dash-rate: 0.03                        # そのダッシュが移動地点に与える倍率 (武器ダメージの3%。クールタイムは2 tick)
      # --- 近接武器のスキル (t161 の作り直し、nekorozv。AssassinSkills)。倍率は武器ダメージ比。値はすべて仮 ---
      clone-copies: 3                             # 立っている分身 (util・大) が、スキルをまねる回数。最後のあとに消える
      clone-copy-share: 0.5                       # 分身がまねたときの倍率 (元の技の倍率比)
      small-charges: 3                            # 小: ためておける数
      small-charge-seconds: 3                     # 小: 1つ以上残っている間、1つ戻る秒数
      small-empty-seconds: 8                      # 小: 使い切ったとき、全部まとめて戻るまでの秒数 (その間は1つずつ戻らない)
      small-chain-seconds: 2.5                    # 小: この秒数の内に続けて使うと、次の斬り方になる (1 右→左、2 左→右、3 後ろ上の2方向から前の1点へ)
      small-rate: 0.55                            # 小 1・2回目: 前の扇の敵への倍率
      small-rate-3: 0.45                          # 小 3回目: 前の1点の周りの敵への倍率 (2回当たる)
      small-reach: 3.2                            # 小: 届く距離 (ブロック)
      medium-rate: 0.3                            # 中: ランダムな3連斬りの1回の倍率
      medium-finish-rate: 0.7                     # 中: 最後の斜め斬りの倍率
      medium-cross-share: 0.65                    # 中: オフハンドに武器があるときの十字斬り1本の倍率 (斜め斬りの倍率比。2本当たる)
