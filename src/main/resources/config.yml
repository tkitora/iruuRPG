rarity:
  mark: "🙥"

player:
  level-cap: 256
  first-release-level-cap: 20
  default-max-hp: 20.0
  default-hp-regen-per-3s: 1.0
  default-max-mp: 20.0
  default-mp-regen-per-3s: 5.0
  mp-regen-period-ticks: 60
  leveling:
    drop-experience-orbs: true
    experience-orb-speed: 0.32

mob:
  default-max-hp: 20.0
  default-max-mp: 1.0
  vanilla-health-proxy: 20.0
  spawn-distance: 3.0
  target-range: 24.0
  player-damage-multiplier: 0.10
  status-display:
    enabled: true
    y-offset: 0.0
    anchor-lift: 0.45
    line-width: 90
    view-range: 24.0
    update-period-ticks: 1
    teleport-duration-ticks: 0

combat:
  debug-damage-in-creative: true
  melee-area-damage-rate: 0.65
  range-area-damage-rate: 0.45
  area-radius: 3.0
  # 遠距離範囲攻撃はクラス関係なく標準で範囲3・割合45%。メイジの「遠距離範囲の強化」で範囲5・割合60%
  range-area-expanded-damage-rate: 0.60
  range-area-expanded-radius: 5.0
  area-requires-facing: true
  range-distance: 16.0
  range-ray-size: 0.6
  min-cooldown-ticks: 1
  status-effects:
    duration-ticks: 100
    explosion-delay-ticks: 40
    explosion-radius: 3.0
  cooldown-ticks:
    melee: 14
    range: 10
    deploy: 200
    special: 2
  deploy:
    radius: 6.0
    duration-ticks: 200
    min-duration-ticks: 20
    attack-period-ticks: 40
    min-attack-period-ticks: 6
    spawn-distance: 3.0
    height: 1.4
    bob-amplitude: 0.25
    bob-period-ticks: 40.0
    rotation-degrees-per-tick: 4.0
  effects:
    particle-size: 0.85
    melee-slash:
      enabled: true
      particles: 14
      radius: 1.35
      height: 1.15
      forward-offset: 0.25
      vertical-lift: 0.30
      angle-degrees: 105.0
    range-trail:
      enabled: true
      spacing: 0.55
      max-points: 30
      start-offset: 0.65
    range-impact:
      enabled: true
      particles: 12
      radius: 0.45
    range-hurt:
      enabled: true
      damage-indicators: 5
      red-dust: 5
    deploy-ring:
      enabled: true
      period-ticks: 2
      points: 72
      height: 0.15
    deploy-pulse:
      enabled: true
      points: 42

debug:
  target:
    max-health: 1000.0
    spawn-distance: 3.0

class-selection:
  # true: クラス未選択のプレイヤーがログインするとクラス選択メニューを開く
  open-on-join: true
  open-delay-ticks: 40

class-skill-points:
  # 何レベルごとに1SP獲得するか
  levels-per-point: 5
  # 獲得できるSPの上限。200Lvで完成(=40SP)。201Lv以降はエンドコンテンツ用に保留
  max-points: 40
  # SPを何ポイント使うごとに、解放ノードを順番に1つ無料で解放するか
  milestone-interval: 5
