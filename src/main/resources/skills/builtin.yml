# プラグインに最初から入っているスキル。サーバーの skills/*.yml に同じ id のスキルを書くと、そちらが優先される
# (このファイルは jar に入っていて、サーバーには出さない)。

skills:
  # その場で突き。武器のスキルや他のスキル (コンボの段) から、この id で呼べる (以前はアサシンの強攻撃1だったが、今の強攻撃1は周囲の斬撃)。
  assassin_thrust:
    name: "突き"
    template: beam
    look:
      colors: ["#ffffff", "#bcd0ff", "#ffffff"]
      particle: END_ROD
      size: 1.0
      width: 0.7
      sound: sharp
    shape:
      range: 4.2
      radius: 1.0
    timing:
      windup-ticks: 4
    effects:
      damage-rate: 2.2

  # 氷の波動 (以前はメイジの強攻撃2だった。今のコンボでは使っていないが、ほかのスキルや武器から id で呼べる)。
  mage_ice_wave:
    name: "氷の波動"
    template: wave
    look:
      colors: ["#8fdcff", "#d8f6ff", "#ffffff"]
      particle: SNOWFLAKE
      size: 1.0
      width: 1.0
      sound: magic
    shape:
      range: 14
      radius: 1.6
      angle: 110
    timing:
      windup-ticks: 4
      speed: 18
    effects:
      damage-rate: 0.4
