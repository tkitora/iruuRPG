# ダンジョン「アトラスの洞窟」の道中の宝箱の基本の表 (dungeons/cave.yml の chests の table: cave_road)。
# 1人1つにつき1回、ボスを倒す前でも開けられる。ゴールド・経験値・アイテム (weight の比で1つ)。
# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
# (yml リポジトリが管理しているファイルは入れ替えない)
version: 1

gold: [15, 40]
xp: [30, 80]
items:
  - item: moon_herb
    weight: 35
    amount: [1, 3]
  - item: crawler_shell
    weight: 30
    amount: [1, 3]
  - item: old_bone
    weight: 25
    amount: [1, 2]
  - item: cave_silk
    weight: 9
    amount: 1
  - item: cave_heart        # 激レアの素材 (1%)
    weight: 1
    amount: 1
    announce: true
