# クラス定義: 戦士 (赤 / 筋力特化)
#
# growth      : レベル1ごとに自動で加算される固有成長 (全クラス共通の成長は config.yml の level-growth)
# spend       : SPを1使うごとにノードのレベルを1上げられる (上限なし)。per-level がノード1レベルあたり
#               値が負のステータスは同じノードで下がる (トレードオフ)
# milestones  : SPを5使うごとに上から順に無料で解放される。順番は固定 (8個 = 40SP)
#   node_type: passive / active
#   effect_type: status (ステータス加算) / skill (name のスキル効果フラグ)
#   condition : 省略=常時 / hp_below_half (体力が半分未満の間) / stationary (立ち止まっている間)
#   active の hot_key は全クラス F
# 数値は design/class-redesign-2026-10-09.md の1SPあたり表と、ステータス解放の配分に基づく。

# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
version: 15

id: warrior
name: "戦士🗡"
icon: IRON_SWORD
# クラスの紹介 (クラス選択・クラス変更・スキル画面で同じ文言を出す)
catchphrase: "筋力こそパワー！"
description:
  - "前線を張り戦場をコントロールできるクラス"
features:
  - "近接"
  - "物理"
  - "赤属性"
  - "比較的高耐久"

growth:
  strength: 0.1
  defense: 0.7

spend:
  strength:
    name: "筋力"
    icon: IRON_AXE
    description:
      - "筋力が上がり、物理攻撃の威力が増す。"
    per-level:
      strength: 2.4
  defense:
    name: "防御"
    icon: SHIELD
    description:
      - "防御が上がり、受けるダメージが減る。"
    per-level:
      defense: 17
  crit_chance:
    name: "会心率"
    icon: AMETHYST_SHARD
    description:
      - "会心が出やすくなる。"
    per-level:
      crit-chance: 1.3
  strength_percent:
    name: "筋力%"
    icon: NETHERITE_AXE
    description:
      - "筋力が大きく伸びる。代わりに魔力が少し落ちる。"
    per-level:
      strength-percent: 3.9
      magic-percent: -1.95
  red_damage:
    name: "赤属性ダメージ"
    icon: REDSTONE
    description:
      - "赤属性の与ダメージが増える。"
    per-level:
      element-stats:
        damage:
          red: 65

# 固有0: 最初から有効なパッシブ (SP不要)
innate:
  - node_name: "薙ぎ払い"
    icon: DIAMOND_AXE
    node_type: passive
    effect_type: skill
    name: melee_area
    description:
      - "近接攻撃が周囲の敵にも当たる (範囲3・威力65%)"

milestones:
  # 1: SP 5 (ステータス)
  - node_name: "剛力の鍛錬"
    icon: IRON_INGOT
    description:
      - "筋力と体力が大きく伸びる。"
    node_type: passive
    effect_type: status
    status:
      strength-percent: 21
      max-hp: 400
  # 2: SP 10 (クラス特有 = 固有1: 周りの敵に狙われやすい / コード側 warrior_taunt)
  - node_name: "挑発"
    icon: BELL
    node_type: passive
    effect_type: skill
    name: warrior_taunt
    description:
      - "周りの敵に優先して狙われやすくなる。"
      - "(近くの敵は一度だけ振り向き、そのあとは狙いを変えない)"
  # 3: SP 15 (ステータス)
  - node_name: "不屈の肉体"
    icon: GOLDEN_APPLE
    description:
      - "体力と会心の威力が伸びる。"
    node_type: passive
    effect_type: status
    status:
      max-hp: 400
      crit-damage: 36
  # 4: SP 20 (クラススキル / F)
  - node_name: "武神の一撃"
    icon: NETHER_STAR
    node_type: active
    hot_key: F
    name: warrior_strike
  # 5: SP 25 (ステータス)
  - node_name: "会心の極意"
    icon: AMETHYST_CLUSTER
    description:
      - "会心の威力と筋力が伸びる。"
    node_type: passive
    effect_type: status
    status:
      crit-damage: 36
      strength-percent: 21
  # 6: SP 30 (クラス特有: 体力が半分を下回っている間)
  - node_name: "背水の陣"
    icon: REDSTONE_BLOCK
    description:
      - "体力が半分を下回っている間だけ、守りと筋力が上がる。"
    node_type: passive
    effect_type: status
    condition: hp_below_half
    status:
      protection: 8
      strength-percent: 25
  # 7: SP 35 (ステータス)
  - node_name: "戦士の極意"
    icon: NETHERITE_CHESTPLATE
    description:
      - "筋力と体力がさらに伸びる。"
    node_type: passive
    effect_type: status
    status:
      strength-percent: 21
      max-hp: 400
  # 8: SP 40 (クラススキル強化)
  - node_name: "武神の一撃・極"
    icon: END_CRYSTAL
    description:
      - "武神の一撃の効果時間が12秒になり、回復の割合と雷の威力が増す。"
      - "雷と演出が大きくなる。"
    node_type: passive
    effect_type: skill
    name: warrior_strike_upgrade

# コンボの見た目 (見た目だけ。ダメージ・硬直は変わらない)。書き方は design/combo-style-example.yml
# 戦士: 大きくゆっくり振る重い斬撃。プレイヤーの向いている方向に対して水平な薙ぎを、傾き (tilt。横軸まわりの回転) だけで変える。
# 視線の上下は無視する。roll は薙ぐ向きだけ (0 = 右から左へ、180 = 左から右へ)。
# forward / drop / side は、弧の真ん中の位置 (目の前の何ブロック / 下 / 右)。
combo-style:
  light:
    # 通常1: 右上から左下 / 通常2: 左上から右下 / 通常3: 横方向 (通常4・5はコードの専用の演出)
    - [{radius: 2.0, angle: 140, tilt: 40, roll: 0, forward: 2.0, drop: 0.4, side: 0.2, duration: 0.14, scale: 1.1, roll-jitter: 0}]
    - [{radius: 2.0, angle: 140, tilt: 40, roll: 180, forward: 2.0, drop: 0.4, side: -0.2, duration: 0.14, scale: 1.1, roll-jitter: 0}]
    - [{radius: 2.4, angle: 160, tilt: 85, roll: 0, forward: 2.0, drop: 0.5, duration: 0.16, scale: 1.1, roll-jitter: 0}]
    - [{radius: 2.2, angle: 150, tilt: 25, roll: 0, forward: 2.0, drop: 0.5, duration: 0.14, scale: 1.1, roll-jitter: 0}]
  finisher:
    sound: sweep
    burst: 18
    cuts:
      - {radius: 2.8, angle: 170, tilt: 30, roll: 0, forward: 2.1, drop: 0.3, duration: 0.14, scale: 1.3, roll-jitter: 0}
      - {radius: 2.8, angle: 180, tilt: 60, roll: 180, forward: 2.0, drop: 0.5, duration: 0.2, scale: 1.25, roll-jitter: 0, delay: 0.1}
  heavy:
    sound: sweep
    burst: 8
    cuts:
      - {radius: 3.0, angle: 170, tilt: 45, roll: 0, forward: 2.0, drop: 0.4, duration: 0.24, scale: 1.3, roll-jitter: 0}
      - {radius: 2.6, angle: 150, tilt: 65, roll: 180, forward: 2.1, drop: 0.5, duration: 0.14, scale: 1.15, delay: 0.1, roll-jitter: 0}

# スキル画面の「コンボ解説」(武器の種類ごと)。弱1〜5 / スキル1〜6 (F・Q から始まる 2 つのキーで出す: t138。スキル1〜5 は以前の強1〜強5)、【】は敵への効果。倍率や範囲は書かない
combo-guide:
  melee:
    - "弱1: 前方へ振り下ろす【吹き飛ばし】"
    - "弱2: 盾で殴りつける【鈍足・吹き飛ばし】"
    - "弱3: 前方を横に薙ぐ"
    - "弱4: 一体へ鉄槌を落とす【鈍足】"
    - "弱5: 大地を砕く【吹き飛ばし】"
    - "スキル1: 盾で殴り、盾を展開する【鈍足】"
    - "スキル2: 足踏みで地を揺らす【鈍足】"
    - "スキル3: 回転斬り"
    - "スキル4: 溜めて前方を大きく縦切り【打ち上げ】"
    - "スキル5: 盾を構えて突進"
    - "スキル6: 三つ又の地割れ【打ち上げ】"
  range:
    - "弱1: 斬撃波を飛ばす"
    - "弱2: 交差する斬撃波"
    - "弱3: 往復するブーメラン斧"
    - "弱4: 地を走る衝撃波【吹き飛ばし】"
    - "弱5: 跳び上がって槍を投げる"
    - "スキル1: 雄叫びで押し返す【吹き飛ばし】"
    - "スキル2: 貫く大斧の一閃"
    - "スキル3: 槍の雨"
    - "スキル4: 鎖で捕らえて斬る【引き寄せ】"
    - "スキル5: 攻城槍の爆発【吹き飛ばし】"
    - "スキル6: 戻ってくる大斧 (行きと帰りに斬る)"
  deploy:
    - "弱1: 時限爆弾【吹き飛ばし】"
    - "弱2: 左右に爆弾を2つ【吹き飛ばし】"
    - "弱3: 近づくと爆発する地雷"
    - "弱4: 一列に地雷を3つ"
    - "弱5: 戦旗の衝撃波【吹き飛ばし・鈍足】"
    - "スキル1: 守りのトーテム【鈍足】"
    - "スキル2: 走る地割れ【打ち上げ】"
    - "スキル3: 防壁を築く【吹き飛ばし】"
    - "スキル4: 十字に爆弾を4つ【吹き飛ばし】"
    - "スキル5: 吸い込む大爆弾【引き寄せ】"
    - "スキル6: 近くの敵を撃つ弩砲【吹き飛ばし】"
