# クラス定義: 戦士 (赤 / 筋力特化)
#
# growth      : レベル1ごとに自動で加算される固有成長 (全クラス共通の成長は config.yml の level-growth)
# spend       : SPを1使うごとにノードのレベルを1上げられる (上限なし)。per-level がノード1レベルあたり
#               値が負のステータスは同じノードで下がる (トレードオフ)
# milestones  : SPを5使うごとに上から順に無料で解放される。順番は固定 (8個 = 40SP)
#   node_type: passive / active
#   effect_type: status (ステータス加算) / skill (name のスキル効果フラグ)
#   condition : 省略=常時 / hp_below_half (体力が半分未満の間) / stationary (立ち止まっている間)
#   active の hot_key は全クラス F
# 数値は design/class-redesign-2026-10-09.md の1SPあたり表と、ステータス解放の配分に基づく。

# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
version: 6

id: warrior
name: "戦士"
icon: IRON_SWORD
description:
  - "筋力を武器に、近接戦で敵を叩き伏せる前衛。"
  - "体力と防御に優れ、窮地でこそ本領を発揮する。"

growth:
  strength: 0.1
  defense: 0.7

spend:
  strength:
    name: "筋力"
    icon: IRON_AXE
    description:
      - "筋力が上がり、物理攻撃の威力が増す。"
    per-level:
      strength: 2.4
  defense:
    name: "防御"
    icon: SHIELD
    description:
      - "防御が上がり、受けるダメージが減る。"
    per-level:
      defense: 17
  crit_chance:
    name: "会心率"
    icon: AMETHYST_SHARD
    description:
      - "会心が出やすくなる。"
    per-level:
      crit-chance: 1.3
  strength_percent:
    name: "筋力%"
    icon: NETHERITE_AXE
    description:
      - "筋力が大きく伸びる。代わりに魔力が少し落ちる。"
    per-level:
      strength-percent: 3.9
      magic-percent: -1.95
  red_damage:
    name: "赤属性ダメージ"
    icon: REDSTONE
    description:
      - "赤属性の与ダメージが増える。"
    per-level:
      element-stats:
        damage:
          red: 65

# 固有0: 最初から有効なパッシブ (SP不要)
innate:
  - node_name: "薙ぎ払い"
    icon: DIAMOND_AXE
    node_type: passive
    effect_type: skill
    name: melee_area
    description:
      - "近接攻撃が周囲の敵にも当たる (範囲3・威力65%)"

milestones:
  # 1: SP 5 (ステータス)
  - node_name: "剛力の鍛錬"
    icon: IRON_INGOT
    description:
      - "筋力と体力が大きく伸びる。"
    node_type: passive
    effect_type: status
    status:
      strength-percent: 21
      max-hp: 400
  # 2: SP 10 (クラス特有 = 固有1: 周りの敵に狙われやすい / コード側 warrior_taunt)
  - node_name: "挑発"
    icon: BELL
    node_type: passive
    effect_type: skill
    name: warrior_taunt
    description:
      - "周りの敵に優先して狙われやすくなる。"
      - "(近くの敵は一度だけ振り向き、そのあとは狙いを変えない)"
  # 3: SP 15 (ステータス)
  - node_name: "不屈の肉体"
    icon: GOLDEN_APPLE
    description:
      - "体力と会心の威力が伸びる。"
    node_type: passive
    effect_type: status
    status:
      max-hp: 400
      crit-damage: 36
  # 4: SP 20 (クラススキル / F)
  - node_name: "武神の一撃"
    icon: NETHER_STAR
    node_type: active
    hot_key: F
    name: warrior_strike
  # 5: SP 25 (ステータス)
  - node_name: "会心の極意"
    icon: AMETHYST_CLUSTER
    description:
      - "会心の威力と筋力が伸びる。"
    node_type: passive
    effect_type: status
    status:
      crit-damage: 36
      strength-percent: 21
  # 6: SP 30 (クラス特有: 体力が半分を下回っている間)
  - node_name: "背水の陣"
    icon: REDSTONE_BLOCK
    description:
      - "体力が半分を下回っている間だけ、守りと筋力が上がる。"
    node_type: passive
    effect_type: status
    condition: hp_below_half
    status:
      protection: 8
      strength-percent: 25
  # 7: SP 35 (ステータス)
  - node_name: "戦士の極意"
    icon: NETHERITE_CHESTPLATE
    description:
      - "筋力と体力がさらに伸びる。"
    node_type: passive
    effect_type: status
    status:
      strength-percent: 21
      max-hp: 400
  # 8: SP 40 (クラススキル強化)
  - node_name: "武神の一撃・極"
    icon: END_CRYSTAL
    description:
      - "武神の一撃が2段階の雷になり、威力と演出が増す。"
      - "発動したときの減った体力の分だけ、武神の一撃のダメージが増える。"
      - "この一撃だけ、与えたダメージの0.5%を吸血する。"
    node_type: passive
    effect_type: skill
    name: warrior_strike_upgrade

# コンボの見た目 (見た目だけ。ダメージ・硬直は変わらない)。書き方は design/combo-style-example.yml
# 戦士: 大きくゆっくり振る重い斬撃。プレイヤーの向いている方向に対して水平な薙ぎを、傾き (tilt。横軸まわりの回転) だけで変える。
# 視線の上下は無視する。roll は薙ぐ向きだけ (0 = 右から左へ、180 = 左から右へ)。
# forward / drop / side は、弧の真ん中の位置 (目の前の何ブロック / 下 / 右)。
combo-style:
  light:
    - [{radius: 2.0, angle: 140, tilt: 40, roll: 180, forward: 2.0, drop: 0.4, side: -0.2, duration: 0.14, scale: 1.1, roll-jitter: 0}]
    - [{radius: 2.0, angle: 140, tilt: 40, roll: 0, forward: 2.0, drop: 0.4, side: 0.2, duration: 0.14, scale: 1.1, roll-jitter: 0}]
    - [{radius: 2.4, angle: 160, tilt: 55, roll: 180, forward: 2.0, drop: 0.4, duration: 0.16, scale: 1.1, roll-jitter: 0}]
    - [{radius: 2.2, angle: 150, tilt: 25, roll: 0, forward: 2.0, drop: 0.5, duration: 0.14, scale: 1.1, roll-jitter: 0}]
  finisher:
    sound: sweep
    burst: 18
    cuts:
      - {radius: 2.8, angle: 170, tilt: 30, roll: 0, forward: 2.1, drop: 0.3, duration: 0.14, scale: 1.3, roll-jitter: 0}
      - {radius: 2.8, angle: 180, tilt: 60, roll: 180, forward: 2.0, drop: 0.5, duration: 0.2, scale: 1.25, roll-jitter: 0, delay: 0.1}
  heavy:
    sound: sweep
    burst: 8
    cuts:
      - {radius: 3.0, angle: 170, tilt: 45, roll: 0, forward: 2.0, drop: 0.4, duration: 0.24, scale: 1.3, roll-jitter: 0}
      - {radius: 2.6, angle: 150, tilt: 65, roll: 180, forward: 2.1, drop: 0.5, duration: 0.14, scale: 1.15, delay: 0.1, roll-jitter: 0}
