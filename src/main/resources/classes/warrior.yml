# クラス定義: 戦士 (赤 / 筋力特化)
#
# growth      : レベル1ごとに自動で加算される固有成長 (全クラス共通の成長は config.yml の level-growth)
# spend       : SP(1レベル=1SP)で上限なくレベルを上げられるノード。per-level が1レベルあたり
#               値が負のステータスは同じノードで下がる (トレードオフ)
# milestones  : SPを5使うごとに上から順に無料で解放される。順番は固定 (8個 = 40SP)
#   node_type: passive / active
#   effect_type: status (ステータス加算) / skill (name のスキル効果フラグ)
#   condition : 省略=常時 / hp_below_half (体力が半分未満の間) / stationary (立ち止まっている間)
#   active の hot_key は全クラス F
# 数値は design/class-redesign-2026-10-09.md の1SPあたり表と、ステータス解放の配分に基づく。

id: warrior
name: "戦士"
icon: IRON_SWORD

growth:
  strength: 0.1
  defense: 0.7

spend:
  strength:
    name: "筋力"
    icon: IRON_AXE
    per-level:
      strength: 2.4
  defense:
    name: "防御"
    icon: SHIELD
    per-level:
      defense: 17
  crit_chance:
    name: "会心率"
    icon: AMETHYST_SHARD
    per-level:
      crit-chance: 1.3
  strength_percent:
    name: "筋力%"
    icon: NETHERITE_AXE
    per-level:
      strength-percent: 3.9
      magic-percent: -1.95
  red_damage:
    name: "赤属性ダメージ"
    icon: REDSTONE
    per-level:
      element-stats:
        damage:
          red: 65

milestones:
  # 1: SP 5 (ステータス)
  - node_name: "剛力の鍛錬"
    icon: IRON_INGOT
    node_type: passive
    effect_type: status
    status:
      strength-percent: 21
      max-hp: 400
  # 2: SP 10 (クラス特有: 近接範囲攻撃化 / 範囲3・周囲45%の威力はコード側)
  - node_name: "薙ぎ払い"
    icon: DIAMOND_AXE
    node_type: passive
    effect_type: skill
    name: melee_area
    description:
      - "近接攻撃が周囲の敵にも当たる"
  # 3: SP 15 (ステータス)
  - node_name: "不屈の肉体"
    icon: GOLDEN_APPLE
    node_type: passive
    effect_type: status
    status:
      max-hp: 400
      crit-damage: 36
  # 4: SP 20 (クラススキル / F)
  - node_name: "武神の一撃"
    icon: NETHER_STAR
    node_type: active
    hot_key: F
    name: warrior_strike
  # 5: SP 25 (ステータス)
  - node_name: "会心の極意"
    icon: AMETHYST_CLUSTER
    node_type: passive
    effect_type: status
    status:
      crit-damage: 36
      strength-percent: 21
  # 6: SP 30 (クラス特有: 体力が半分を下回っている間)
  - node_name: "背水の陣"
    icon: REDSTONE_BLOCK
    node_type: passive
    effect_type: status
    condition: hp_below_half
    status:
      protection: 8
      strength-percent: 25
  # 7: SP 35 (ステータス)
  - node_name: "戦士の極意"
    icon: NETHERITE_CHESTPLATE
    node_type: passive
    effect_type: status
    status:
      strength-percent: 21
      max-hp: 400
  # 8: SP 40 (クラススキル強化)
  - node_name: "武神の一撃・極"
    icon: END_CRYSTAL
    node_type: passive
    effect_type: skill
    name: warrior_strike_upgrade
