# クラス定義: メイジ (青 / 遠距離・魔法のアタッカー)
#
# 書き方は classes/warrior.yml を参照。
# ダメージ寄り・防御薄めのクラス。数値は200Lv時点で装備のみ比
# ダメージ約1.6倍・実効HP約1.5倍になるように試算して決めた (仮)。
#
# 固有スキルのホットキーは F(アイテムスワップ)。
# 右クリックは遠距離武器の通常攻撃に使うので避けている。

id: mage
name: "メイジ"
icon: BLAZE_ROD

growth:
  max-hp: 0.5
  magic: 1.4
  defense: 0.3

spend:
  magic:
    name: "魔力"
    icon: AMETHYST_SHARD
    stat: magic
    per-level: 8
  range_damage:
    name: "遠距離ダメージ"
    icon: BOW
    stat: range-damage
    per-level: 10
  magic_overload:
    name: "魔力増幅"
    icon: ENCHANTED_BOOK
    stat: magic-overload
    per-level: 0.6
  max_mp:
    name: "最大MP"
    icon: LAPIS_LAZULI
    stat: max-mp
    per-level: 3
  magic_resist:
    name: "魔法耐性"
    icon: PRISMARINE_SHARD
    stat: magic-resist
    per-level: 0.006

milestones:
  # 1: SP 5
  - node_name: "魔力の泉"
    icon: LAPIS_BLOCK
    node_type: passive
    effect_type: status
    status:
      max-mp: 40
  # 2: SP 10 (遠距離範囲: 範囲3・45% -> 範囲5・60%)
  - node_name: "広域魔法"
    icon: HEART_OF_THE_SEA
    node_type: passive
    effect_type: skill
    name: range_area_expand
  # 3: SP 15
  - node_name: "遠術の心得"
    icon: SPYGLASS
    node_type: passive
    effect_type: status
    status:
      range-damage-percent: 15
  # 4: SP 20
  - node_name: "氷槍"
    icon: PACKED_ICE
    node_type: active
    hot_key: F
    name: ice_lance
  # 5: SP 25
  - node_name: "魔導の極意"
    icon: AMETHYST_CLUSTER
    node_type: passive
    effect_type: status
    status:
      magic-percent: 10
  # 6: SP 30
  - node_name: "魔力増幅の理"
    icon: ENCHANTING_TABLE
    node_type: passive
    effect_type: status
    status:
      magic-overload: 6
  # 7: SP 35
  - node_name: "氷槍・極 (完全停止)"
    icon: BLUE_ICE
    node_type: passive
    effect_type: skill
    name: ice_lance_upgrade
  # 8: SP 40
  - node_name: "賢者の肉体"
    icon: GOLDEN_APPLE
    node_type: passive
    effect_type: status
    status:
      max-hp: 60
