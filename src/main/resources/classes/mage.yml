# クラス定義: メイジ (青 / 魔力特化)
# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
version: 4
# 書き方は classes/warrior.yml を参照。固有スキルのホットキーは全クラス F。

id: mage
name: "メイジ📖"
icon: BLAZE_ROD
# クラスの紹介 (クラス選択・クラス変更・スキル画面で同じ文言を出す)
catchphrase: "1%の天才と99%の魔力"
description:
  - "多彩な魔法で相手を殲滅できるクラス"
features:
  - "遠距離"
  - "魔法"
  - "青属性"
  - "低耐久"

growth:
  magic: 0.1
  max-mp: 0.1

spend:
  magic:
    name: "魔力"
    icon: AMETHYST_SHARD
    description:
      - "魔力が上がり、魔法の威力が増す。"
    per-level:
      magic: 2.4
  max_mp:
    name: "最大MP"
    icon: LAPIS_LAZULI
    description:
      - "最大MPが増え、スキルを多く使える。"
    per-level:
      max-mp: 1.5
  mp_regen:
    name: "MP回復"
    icon: PRISMARINE_CRYSTALS
    description:
      - "MPの回復が速くなる。"
    per-level:
      mp-regen: 0.2
  magic_percent:
    name: "魔力%"
    icon: ENCHANTED_BOOK
    description:
      - "魔力が大きく伸びる。代わりに筋力が少し落ちる。"
    per-level:
      magic-percent: 3.9
      strength-percent: -1.95
  blue_damage:
    name: "青属性ダメージ"
    icon: LAPIS_BLOCK
    description:
      - "青属性の与ダメージが増える。"
    per-level:
      element-stats:
        damage:
          blue: 65

# 固有0: 最初から有効なパッシブ (SP不要)
innate:
  - node_name: "魔導の射程"
    icon: SPYGLASS
    node_type: passive
    effect_type: skill
    name: range_double
    description:
      - "遠距離攻撃の射程が2倍になる。"

milestones:
  # 1: SP 5 (ステータス)
  - node_name: "魔導の素養"
    icon: ENCHANTING_TABLE
    description:
      - "魔力と魔法の威力が伸びる。"
    node_type: passive
    effect_type: status
    status:
      magic-percent: 21
      magic-overload: 3
  # 2: SP 10 (クラス特有 = 固有1: 遠距離範囲攻撃の強化 / 範囲5・60%はコード側)
  - node_name: "広域魔法"
    icon: HEART_OF_THE_SEA
    node_type: passive
    effect_type: skill
    name: range_area_expand
    description:
      - "遠距離攻撃の範囲が広がり、威力も上がる。"
  # 3: SP 15 (ステータス)
  - node_name: "魔力の泉"
    icon: LAPIS_BLOCK
    description:
      - "魔法の威力と攻撃速度が伸びる。"
    node_type: passive
    effect_type: status
    status:
      magic-overload: 3
      attack-speed: 20
  # 4: SP 20 (クラススキル / F)
  - node_name: "流星"
    icon: FIREWORK_STAR
    node_type: active
    hot_key: F
    name: meteor
  # 5: SP 25 (ステータス)
  - node_name: "魔導の極意"
    icon: AMETHYST_CLUSTER
    description:
      - "攻撃速度と魔力が伸びる。"
    node_type: passive
    effect_type: status
    status:
      attack-speed: 20
      magic-percent: 21
  # 6: SP 30 (クラス特有 = 固有2: 攻撃速度でスキルのクールタイムが減り、弾も速くなる / コード側 attack_speed_cooldown)
  - node_name: "詠唱加速"
    icon: CLOCK
    node_type: passive
    effect_type: skill
    name: attack_speed_cooldown
    description:
      - "攻撃速度の%の分だけ、スキルのクールタイムが短くなり、"
      - "遠距離攻撃の弾も速くなる。"
      - "(最大で80%短くなる)"
  # 7: SP 35 (ステータス)
  - node_name: "賢者の叡智"
    icon: BOOK
    description:
      - "魔力と魔法の威力がさらに伸びる。"
    node_type: passive
    effect_type: status
    status:
      magic-percent: 21
      magic-overload: 3
  # 8: SP 40 (クラススキル強化)
  - node_name: "流星・極"
    icon: END_CRYSTAL
    description:
      - "流星の数が増え、撃ち切るまで自分もチャージを行う。"
      - "撃ち切った後、長く太いビームを放つ。"
    node_type: passive
    effect_type: skill
    name: meteor_upgrade

# スキル画面の「コンボ解説」(武器の種類ごと)。弱1〜5 / 強0〜4、【】は敵への効果。倍率や範囲は書かない
combo-guide:
  melee:
    - "弱1: 大鎌で往復の薙ぎ"
    - "弱2: 刈り上げる斬撃【打ち上げ】"
    - "弱3: 周囲を回転斬り"
    - "弱4: 踏み込んで薙ぐ"
    - "弱5: 引き寄せて全周を刈る【引き寄せ・鈍足】"
    - "強0: 跳び上がって斬り上げ【打ち上げ】"
    - "強1: 前方へ3連薙ぎ"
    - "強2: 直線斬り【鈍足】"
    - "強3: 踏み込んで薙ぐ"
    - "強4: 3連突進斬り"
    - "※ 強のあと、もう一度右クリックで追撃"
    - "※ 追撃: 強0 急降下【吹き飛ばし】 強2 斜め斬り【鈍足】"
    - "※ 追撃: 強4 振り下ろし【打ち上げ】"
  range:
    - "弱1: 左から弧を描く魔弾"
    - "弱2: 右から弧を描く魔弾"
    - "弱3: 三方から魔弾"
    - "弱4: 交差する大魔弾"
    - "弱5: 当てた敵の足元に魔法柱"
    - "強0: 強2〜強4の再発動"
    - "強1: 当てた敵へ追尾弾"
    - "強2: 根が広がる (再発動でMP回復)"
    - "強3: 結晶の棘 (再発動で空から棘)"
    - "強4: 縮む球体【引き寄せ・吹き飛ばし】"
    - "※ 強4の再発動で、球体をすぐ爆発させる"
    - "※ 武器が光っている間は、強1〜強4が遅れてもう一度出る"
  deploy:
    - "弱1: 敵を撃つ魔塔"
    - "弱2: 小さな魔塔を2本"
    - "弱3: 噴き上がる魔法陣【鈍足】"
    - "弱4: 光るランタンを3つ"
    - "弱5: 星を降らせる灯台"
    - "強0: 足元に召喚陣"
    - "強1: 順に炸裂する魔法陣"
    - "強2: 吸い込む光球【引き寄せ・鈍足】"
    - "強3: 追尾する光弾"
    - "強4: ブラックホール【引き寄せ】"
