# クラス定義。
# ツリー形状は skill-tree-shape.yml を共有し、ここでは各 node の中身を書く。
#
# node_type:
#   passive: 取得すると常時効果
#   active: hot_key で cskill を発動できる
#
# passive + effect_type:
#   status: status: に item yml の stats と同じキーを書く
#   skill: name: に cskill/*.yml のIDを書く。将来の解放条件用
#
# active:
#   hot_key: F/Q/L/R/SL/SR
#     F  = アイテムスワップ。通常動作をキャンセル
#     Q  = アイテムドロップ。通常動作をキャンセル
#     L  = 左クリック
#     R  = 右クリック
#     SL = シフト左クリック
#     SR = シフト右クリック
#   name: cskill/*.yml のID

