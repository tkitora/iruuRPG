# クラス定義: アサシン (橙 / 橙ダメージ・超低耐久)
# 書き方は classes/warrior.yml を参照。固有スキルのホットキーは全クラス F。
#
# 橙以外の属性ダメージを減らす値や、防御系を減らす値は、+側と同じ価値だけ減らす初期案。
# (白・緑の属性ダメージの減少量と、保護の減少量は仮置き)

# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
version: 18

id: assassin
name: "アサシン⚔"
icon: IRON_SWORD
# クラスの紹介 (クラス選択・クラス変更・スキル画面で同じ文言を出す)
catchphrase: "機動力と手数"
description:
  - "分身を用いて敵を切り刻むクラス"
features:
  - "機動力"
  - "手数"
  - "低耐久"

growth:
  attack-speed: 0.05
  element-stats:
    damage:
      orange: 0.8

spend:
  attack_speed:
    name: "攻撃速度"
    icon: CLOCK
    description:
      - "攻撃が速くなる。"
    per-level:
      attack-speed: 0.5
  move_speed:
    name: "移動速度"
    icon: FEATHER
    description:
      - "移動が速くなる。"
    per-level:
      move-speed: 0.5
  glass_cannon:
    name: "紙一重"
    icon: TNT
    description:
      - "攻撃力が大きく増える。代わりに防御と耐性を大きく捨てる。"
    per-level:
      strength: 2.4
      magic: 2.4
      defense: -17
      physical-resist: -0.0075
      magic-resist: -0.0075
      damage-reduction: -0.75
      protection: -0.3
  strength_elements:
    name: "筋力と属性"
    icon: IRON_SWORD
    description:
      - "筋力と、全ての属性のダメージが増える。"
    per-level:
      strength: 1.8
      element-stats:
        damage:
          red: 19
          blue: 19
          white: 19
          green: 19
          orange: 19
  crit_damage:
    name: "会心ダメージ"
    icon: AMETHYST_SHARD
    description:
      - "会心したときの威力が増える。"
    per-level:
      crit-damage: 1.1

# 固有0: 最初から有効なパッシブ (SP不要)
innate:
  - node_name: "二刀流"
    icon: IRON_SWORD
    node_type: passive
    effect_type: skill
    name: assassin_dual
    description:
      - "オフハンドにも近接武器を持てる。"
      - "近接攻撃のたびに、メインハンドとオフハンドが交互に攻撃する。"
      - "(ホットバーやオフハンドの中身は入れ替わらない)"

milestones:
  # 1: SP 5 (ステータス)
  - node_name: "鋭い腕"
    icon: IRON_INGOT
    description:
      - "筋力と会心率が伸びる。"
    node_type: passive
    effect_type: status
    status:
      strength: 60
      crit-chance: 5
  # 2: SP 10 (クラス特有 = 固有1: 近接攻撃で10%、両手で同時に攻撃 / コード側 assassin_double)
  - node_name: "双牙"
    icon: PRISMARINE_SHARD
    node_type: passive
    effect_type: skill
    name: assassin_double
    description:
      - "近接攻撃のとき10%の確率で、メインハンドとオフハンドが同時に攻撃する。"
      - "(斬撃が十字に交差する)"
  # 3: SP 15 (ステータス)
  - node_name: "惑わす刃"
    icon: POPPED_CHORUS_FRUIT
    description:
      - "混乱を与えやすくなり、筋力が伸びる。"
    node_type: passive
    effect_type: status
    status:
      confusion: 1
      strength: 60
  # 4: SP 20 (クラススキル / F。通常攻撃扱いなので、固有0・固有1も発動する)
  - node_name: "SATUJIN"
    icon: NETHERITE_SWORD
    node_type: active
    hot_key: F
    name: satsujin
  # 5: SP 25 (ステータス)
  - node_name: "混濁の眼"
    icon: SPIDER_EYE
    description:
      - "混乱を与えやすくなり、会心率が伸びる。"
    node_type: passive
    effect_type: status
    status:
      confusion: 1
      crit-chance: 5
  # 6: SP 30 (ステータス。以前の「連撃」は、解放しなくても常に使えるコンボになった)
  - node_name: "影走り"
    icon: FEATHER
    description:
      - "攻撃速度と会心ダメージが伸びる。"
    node_type: passive
    effect_type: status
    status:
      attack-speed: 10
      crit-damage: 36
  # 7: SP 35 (ステータス)
  - node_name: "鋭い腕・極"
    icon: NETHERITE_INGOT
    description:
      - "筋力と会心率がさらに伸びる。"
    node_type: passive
    effect_type: status
    status:
      strength: 60
      crit-chance: 5
  # 8: SP 40 (クラススキル強化)
  - node_name: "SATUJIN・極"
    icon: END_CRYSTAL
    description:
      - "SATUJINの効果時間が12秒になり、技の強化の幅が大きくなる。"
    node_type: passive
    effect_type: skill
    name: satsujin_upgrade

# アサシンのコンボ (近接) は、得意な (黄色の) 近接武器を持てば常に使える (解放するスキルは要らない)。手数・ダメージ・動きはコード (AssassinMeleeCombo) が決める。
# 下の combo-style は、いまは使われていない (コンボは自分で斬撃を描く)。
combo-style:
  light:
    - [{radius: 2.0, angle: 120, tilt: 55, roll: 180, forward: 2.0, drop: 0.4, duration: 0.08, scale: 1.0, roll-jitter: 0}]
    - [{radius: 2.0, angle: 120, tilt: 55, roll: 0, forward: 2.0, drop: 0.4, duration: 0.08, scale: 1.0, roll-jitter: 0}]
    - [{radius: 1.9, angle: 110, tilt: 45, roll: 0, forward: 2.0, drop: 0.4, duration: 0.07, scale: 0.95, roll-jitter: 0}]
    - [{radius: 1.8, angle: 110, tilt: 45, roll: 0, forward: 2.0, drop: 0.4, duration: 0.07, scale: 0.95, roll-jitter: 0}]
  finisher:
    sound: sweep
    burst: 16
    cuts:
      - {radius: 2.5, angle: 170, tilt: 55, roll: 0, forward: 2.0, drop: 0.4, duration: 0.16, scale: 1.3, roll-jitter: 0}
      - {radius: 2.0, angle: 150, tilt: 65, roll: 0, forward: 2.0, drop: 0.55, duration: 0.14, scale: 1.1, roll-jitter: 0, delay: 0.05}

# スキル画面の「コンボ解説」(武器の種類ごと)。弱1〜5 / スキル1〜6 (F・Q から始まる 2 つのキーで出す: t138。スキル1〜5 は以前の強1〜強5)、【】は敵への効果。倍率や範囲は書かない
combo-guide:
  melee:
    - "弱1: 交差する2連斬り"
    - "弱2: 踏み込んで2連斬り"
    - "弱3: 分身が背後から斬る【混乱】"
    - "弱4: 回転する刃"
    - "弱5: 分身2体で挟み斬り"
    - "スキル1: 分身を置く"
    - "スキル2: 跳ね返る手裏剣"
    - "スキル3: 刃の嵐"
    - "スキル4: 分身2体が往復"
    - "スキル5: 分身3体で処刑【混乱】"
    - "スキル6: 影渡り (敵の列を駆け抜けて斬る)【混乱】"
    - "※ スキル1は、もう一度出すと分身が増え、3回目で突撃"
  range:
    - "弱1: 2本の剣が前方を薙ぐ"
    - "弱2: 2本の剣が交差"
    - "弱3: 3本の剣が敵を追う"
    - "弱4: 4本の剣が周りを回る"
    - "弱5: 5本の剣が頭上から落ちる"
    - "スキル1: 4本の剣が大きく周回"
    - "スキル2: 5本の剣を扇状に飛ばす"
    - "スキル3: 大剣で直線を貫く"
    - "スキル4: 追尾する剣を4本"
    - "スキル5: 剣の渦【引き寄せ】"
    - "スキル6: 千本針 (扇状に7本)"
  deploy:
    - "弱1: 煙缶と投げ短剣【鈍足】"
    - "弱2: 小さな煙缶を2つ【鈍足】"
    - "弱3: 近づくと炸裂する煙爆弾【鈍足】"
    - "弱4: 煙缶を3つ【鈍足】"
    - "弱5: 短剣を降らす黒煙の柱"
    - "スキル1: 足元に煙幕【鈍足】"
    - "スキル2: 時間差で爆発する囮"
    - "スキル3: 一列に煙爆弾を3つ"
    - "スキル4: 短剣を連射する煙缶"
    - "スキル5: 夜の帳で覆う"
    - "スキル6: 毒霧の罠【鈍足・混乱】"
