# クラス定義: アサシン (橙 / 橙ダメージ・超低耐久)
# 書き方は classes/warrior.yml を参照。固有スキルのホットキーは全クラス F。
#
# 橙以外の属性ダメージを減らす値や、防御系を減らす値は、+側と同じ価値だけ減らす初期案。
# (白・緑の属性ダメージの減少量と、保護の減少量は仮置き)

# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
version: 10

id: assassin
name: "アサシン"
icon: IRON_SWORD
description:
  - "手数で圧倒する近接のクラス。色(属性)に縛られず、"
  - "二本の武器で攻め立て、混乱を重ねて爆ぜさせる。"

growth:
  attack-speed: 0.05
  element-stats:
    damage:
      orange: 0.8

spend:
  attack_speed:
    name: "攻撃速度"
    icon: CLOCK
    description:
      - "攻撃が速くなる。"
    per-level:
      attack-speed: 0.5
  move_speed:
    name: "移動速度"
    icon: FEATHER
    description:
      - "移動が速くなる。"
    per-level:
      move-speed: 0.5
  glass_cannon:
    name: "紙一重"
    icon: TNT
    description:
      - "攻撃力が大きく増える。代わりに防御と耐性を大きく捨てる。"
    per-level:
      strength: 2.4
      magic: 2.4
      defense: -17
      physical-resist: -0.0075
      magic-resist: -0.0075
      damage-reduction: -0.75
      protection: -0.3
  strength_elements:
    name: "筋力と属性"
    icon: IRON_SWORD
    description:
      - "筋力と、全ての属性のダメージが増える。"
    per-level:
      strength: 1.8
      element-stats:
        damage:
          red: 19
          blue: 19
          white: 19
          green: 19
          orange: 19
  crit_damage:
    name: "会心ダメージ"
    icon: AMETHYST_SHARD
    description:
      - "会心したときの威力が増える。"
    per-level:
      crit-damage: 1.1

# 固有0: 最初から有効なパッシブ (SP不要)
innate:
  - node_name: "二刀流"
    icon: IRON_SWORD
    node_type: passive
    effect_type: skill
    name: assassin_dual
    description:
      - "オフハンドにも近接武器を持てる。"
      - "近接攻撃のたびに、メインハンドとオフハンドが交互に攻撃する。"
      - "(ホットバーやオフハンドの中身は入れ替わらない)"

milestones:
  # 1: SP 5 (ステータス)
  - node_name: "鋭い腕"
    icon: IRON_INGOT
    description:
      - "筋力と会心率が伸びる。"
    node_type: passive
    effect_type: status
    status:
      strength: 60
      crit-chance: 5
  # 2: SP 10 (クラス特有 = 固有1: 近接攻撃で10%、両手で同時に攻撃 / コード側 assassin_double)
  - node_name: "双牙"
    icon: PRISMARINE_SHARD
    node_type: passive
    effect_type: skill
    name: assassin_double
    description:
      - "近接攻撃のとき10%の確率で、メインハンドとオフハンドが同時に攻撃する。"
      - "(斬撃が十字に交差する)"
  # 3: SP 15 (ステータス)
  - node_name: "惑わす刃"
    icon: POPPED_CHORUS_FRUIT
    description:
      - "混乱を与えやすくなり、筋力が伸びる。"
    node_type: passive
    effect_type: status
    status:
      confusion: 1
      strength: 60
  # 4: SP 20 (クラススキル / F。通常攻撃扱いなので、固有0・固有1も発動する)
  - node_name: "SATUJIN"
    icon: NETHERITE_SWORD
    node_type: active
    hot_key: F
    name: satsujin
  # 5: SP 25 (ステータス)
  - node_name: "混濁の眼"
    icon: SPIDER_EYE
    description:
      - "混乱を与えやすくなり、会心率が伸びる。"
    node_type: passive
    effect_type: status
    status:
      confusion: 1
      crit-chance: 5
  # 6: SP 30 (クラス特有 = 固有2: アサシンの連撃コンボ / コード側 assassin_combo)
  - node_name: "連撃"
    icon: NETHERITE_SWORD
    node_type: passive
    effect_type: skill
    name: assassin_combo
    description:
      - "通常攻撃が5段の連撃になる。3段目から複数回当たり、5段目で大きく斬る。"
      - "通常攻撃を出したあとの右クリックで、その段数に応じた強攻撃が出る。"
      - "(これを解放するまでは、ほかのクラスと同じ通常攻撃)"
  # 7: SP 35 (ステータス)
  - node_name: "鋭い腕・極"
    icon: NETHERITE_INGOT
    description:
      - "筋力と会心率がさらに伸びる。"
    node_type: passive
    effect_type: status
    status:
      strength: 60
      crit-chance: 5
  # 8: SP 40 (クラススキル強化)
  - node_name: "SATUJIN・極"
    icon: END_CRYSTAL
    description:
      - "同じ攻撃を最大9回、対象が倒れるまで繰り返す。"
    node_type: passive
    effect_type: skill
    name: satsujin_upgrade

# コンボの見た目 (見た目だけ。ダメージ・硬直は変わらない)。書き方は design/combo-style-example.yml
# アサシンのコンボ (固有2「連撃」を解放したときだけ。それまでは、ほかのクラスと同じ通常攻撃) (手数・ダメージ・強攻撃は config.yml の combat.combo.assassin):
#   通常1 左からの斬撃 / 通常2 右からの斬撃 (両手に近接武器があるときは、十字の斬撃と音)
#   通常3 正面に斬撃 (40%のダメージで3回) / 通常4 正面に斬撃 (30%のダメージで4回)
#       斬撃の角度は、横からの斬撃と、斜めからの切り下ろしから、1回ごとにランダムに選ぶ (ここで書く傾き・位置・大きさは共通)
#   通常5 (フィニッシュ) 正面に斬撃 (60%のダメージで3回)。少し派手な音とエフェクト。両手に近接武器があるときは、左回りと右回りの2つ
# 1回の攻撃に斬撃が2つ以上あるときは、2つ目以降を2tick遅らせ、少しずつ角度をずらす。
# 強攻撃 0〜4 (右クリック) は、見た目も動きも ComboMoves (コード) が出す。
# 斬撃は、プレイヤーの向いている方向に対して水平な薙ぎを、傾き (tilt。横軸まわりの回転) で変える。視線の上下は無視する。
# roll は薙ぐ向きだけ (0 = 右から左へ、180 = 左から右へ)。
combo-style:
  light:
    - [{radius: 2.0, angle: 120, tilt: 55, roll: 180, forward: 2.0, drop: 0.4, duration: 0.08, scale: 1.0, roll-jitter: 0}]
    - [{radius: 2.0, angle: 120, tilt: 55, roll: 0, forward: 2.0, drop: 0.4, duration: 0.08, scale: 1.0, roll-jitter: 0}]
    - [{radius: 1.9, angle: 110, tilt: 45, roll: 0, forward: 2.0, drop: 0.4, duration: 0.07, scale: 0.95, roll-jitter: 0}]
    - [{radius: 1.8, angle: 110, tilt: 45, roll: 0, forward: 2.0, drop: 0.4, duration: 0.07, scale: 0.95, roll-jitter: 0}]
  finisher:
    sound: sweep
    burst: 16
    cuts:
      - {radius: 2.5, angle: 170, tilt: 55, roll: 0, forward: 2.0, drop: 0.4, duration: 0.16, scale: 1.3, roll-jitter: 0}
      - {radius: 2.0, angle: 150, tilt: 65, roll: 0, forward: 2.0, drop: 0.55, duration: 0.14, scale: 1.1, roll-jitter: 0, delay: 0.05}
