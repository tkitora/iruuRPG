# クラス定義: アサシン (橙 / 橙ダメージ・超低耐久)
# 書き方は classes/warrior.yml を参照。固有スキルのホットキーは全クラス F。
#
# 橙以外の属性ダメージを減らす値や、防御系を減らす値は、+側と同じ価値だけ減らす初期案。
# (白・緑の属性ダメージの減少量と、保護の減少量は仮置き)

# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
version: 23

id: assassin
name: "アサシン⚔"
icon: IRON_SWORD
# クラスの紹介 (クラス選択・クラス変更・スキル画面で同じ文言を出す)
catchphrase: "機動力と手数"
description:
  - "分身を用いて敵を切り刻むクラス"
features:
  - "機動力"
  - "手数"
  - "低耐久"

growth:
  attack-speed: 0.05
  element-stats:
    damage:
      orange: 0.8

spend:
  attack_speed:
    name: "攻撃速度"
    icon: CLOCK
    description:
      - "攻撃が速くなる。"
    per-level:
      attack-speed: 0.5
  move_speed:
    name: "移動速度"
    icon: FEATHER
    description:
      - "移動が速くなる。"
    per-level:
      move-speed: 0.5
  glass_cannon:
    name: "紙一重"
    icon: TNT
    description:
      - "攻撃力が大きく増える。代わりに防御と耐性を大きく捨てる。"
    per-level:
      strength: 2.4
      magic: 2.4
      defense: -17
      physical-resist: -0.0075
      magic-resist: -0.0075
      damage-reduction: -0.75
      protection: -0.3
  strength_elements:
    name: "筋力と属性"
    icon: IRON_SWORD
    description:
      - "筋力と、全ての属性のダメージが増える。"
    per-level:
      strength: 1.8
      element-stats:
        damage:
          red: 19
          blue: 19
          white: 19
          green: 19
          orange: 19
  crit_damage:
    name: "会心ダメージ"
    icon: AMETHYST_SHARD
    description:
      - "会心したときの威力が増える。"
    per-level:
      crit-damage: 1.1

# 固有0: 最初から有効なパッシブ (SP不要)
innate:
  - node_name: "二刀流"
    icon: IRON_SWORD
    node_type: passive
    effect_type: skill
    name: assassin_dual
    description:
      - "オフハンドにも近接武器を持てる。"
      - "近接攻撃のたびに、メインハンドとオフハンドが交互に攻撃する。"
      - "(ホットバーやオフハンドの中身は入れ替わらない)"

milestones:
  # 1: SP 5 (ステータス)
  - node_name: "鋭い腕"
    icon: IRON_INGOT
    description:
      - "筋力と会心率が伸びる。"
    node_type: passive
    effect_type: status
    status:
      strength: 60
      crit-chance: 5
  # 2: SP 10 (クラス特有 = 固有1: 近接攻撃で10%、両手で同時に攻撃 / コード側 assassin_double)
  - node_name: "双牙"
    icon: PRISMARINE_SHARD
    node_type: passive
    effect_type: skill
    name: assassin_double
    description:
      - "近接攻撃のとき10%の確率で、メインハンドとオフハンドが同時に攻撃する。"
      - "(斬撃が十字に交差する)"
  # 3: SP 15 (ステータス)
  - node_name: "惑わす刃"
    icon: POPPED_CHORUS_FRUIT
    description:
      - "混乱を与えやすくなり、筋力が伸びる。"
    node_type: passive
    effect_type: status
    status:
      confusion: 1
      strength: 60
  # 4: SP 20 (クラススキル / F。通常攻撃扱いなので、固有0・固有1も発動する)
  - node_name: "SATUJIN"
    icon: NETHERITE_SWORD
    node_type: active
    hot_key: F
    name: satsujin
  # 5: SP 25 (ステータス)
  - node_name: "混濁の眼"
    icon: SPIDER_EYE
    description:
      - "混乱を与えやすくなり、会心率が伸びる。"
    node_type: passive
    effect_type: status
    status:
      confusion: 1
      crit-chance: 5
  # 6: SP 30 (ステータス。以前の「連撃」は、解放しなくても常に使えるコンボになった)
  - node_name: "影走り"
    icon: FEATHER
    description:
      - "攻撃速度と会心ダメージが伸びる。"
    node_type: passive
    effect_type: status
    status:
      attack-speed: 10
      crit-damage: 36
  # 7: SP 35 (ステータス)
  - node_name: "鋭い腕・極"
    icon: NETHERITE_INGOT
    description:
      - "筋力と会心率がさらに伸びる。"
    node_type: passive
    effect_type: status
    status:
      strength: 60
      crit-chance: 5
  # 8: SP 40 (クラススキル強化)
  - node_name: "SATUJIN・極"
    icon: END_CRYSTAL
    description:
      - "SATUJINの効果時間が12秒になり、技の強化の幅が大きくなる。"
    node_type: passive
    effect_type: skill
    name: satsujin_upgrade

# アサシンのコンボ (近接) は、得意な (黄色の) 近接武器を持てば常に使える (解放するスキルは要らない)。手数・ダメージ・動きはコード (AssassinMeleeCombo) が決める。
# 下の combo-style は、いまは使われていない (コンボは自分で斬撃を描く)。
combo-style:
  light:
    - [{radius: 2.0, angle: 120, tilt: 55, roll: 180, forward: 2.0, drop: 0.4, duration: 0.08, scale: 1.0, roll-jitter: 0}]
    - [{radius: 2.0, angle: 120, tilt: 55, roll: 0, forward: 2.0, drop: 0.4, duration: 0.08, scale: 1.0, roll-jitter: 0}]
    - [{radius: 1.9, angle: 110, tilt: 45, roll: 0, forward: 2.0, drop: 0.4, duration: 0.07, scale: 0.95, roll-jitter: 0}]
    - [{radius: 1.8, angle: 110, tilt: 45, roll: 0, forward: 2.0, drop: 0.4, duration: 0.07, scale: 0.95, roll-jitter: 0}]
  finisher:
    sound: sweep
    burst: 16
    cuts:
      - {radius: 2.5, angle: 170, tilt: 55, roll: 0, forward: 2.0, drop: 0.4, duration: 0.16, scale: 1.3, roll-jitter: 0}
      - {radius: 2.0, angle: 150, tilt: 65, roll: 0, forward: 2.0, drop: 0.55, duration: 0.14, scale: 1.1, roll-jitter: 0, delay: 0.05}

# スキル画面の「コンボ解説」(武器の種類ごと)。弱1〜5 / スキル1〜6 (F・Q から始まる 2 つのキーで出す: t138。スキル1〜5 は以前の強1〜強5)、【】は敵への効果。倍率や範囲は書かない
combo-guide:
  melee:
    - "弱1: 交差する2連斬り"
    - "弱2: 踏み込んで2連斬り"
    - "弱3: 分身が背後から斬る【混乱】"
    - "弱4: 回転する刃"
    - "弱5: 分身2体で挟み斬り"
    - "小: 連斬 (3回までためておける。続けて使うと 右から左 → 左から右 → 後ろ上の2方向から前の1点へ)"
    - "中: 乱れ斬り (ランダムな3連斬りのあと斜め斬り。オフハンドに武器があれば十字斬り)"
    - "中の再発動: 突進して十字斬り (通り抜けた敵も斬る。移動中は無敵)"
    - "大: 影の陣 (4秒透明になり、敵の狙いを分身へ。1.5秒後、自分と分身の周りを2秒間斬り続ける。その間は動けないが無敵)"
    - "util: 分身を置いて後ろへ跳ぶ"
    - "ULT中: アイテムスキルのキーで、弱い突進十字斬り (何度でも)"
    - "※ 分身は、小と、中の再発動を、3回までまねる (自分からはまねない)"
  range:
    - "弱1: 背中の短剣を2本飛ばす"
    - "弱2: 3本の短剣が狙いで交差する (通り道の敵すべて)"
    - "弱3: 短剣が狙った敵の周りを回って斬る"
    - "弱4: 短剣を扇に5本"
    - "弱5: 6本の短剣を次々に突き刺す【混乱・出血】"
    - "小: 投げナイフ。3本を素早く (ストック3)【出血】"
    - "中: 影縫い。狙った敵の影に短剣を刺して止める【拘束・混乱】"
    - "大: 千本刃。12本の短剣で囲んで斬り、再発動で一斉に突き刺す"
    - "util: 影跳び。後ろへ跳び、元いた所に短剣を3本残す (近づいた敵へ飛ぶ)"
    - "※ 影の短剣: 攻撃すると、背中に6本の短剣が扇に浮かぶ。攻撃はそこから飛んでいく"
  deploy:
    - "弱1: 闇の中の敵へ影の刃を2本【混乱】"
    - "弱2: 煙がふくらむ (中の敵が混乱し、遅くなる)【混乱・鈍足】"
    - "弱3: 闇のふちが茨になる (越えた敵は少し動けない)【拘束】"
    - "弱4: 真ん中に近い敵を影で縛って3回斬る【拘束】"
    - "弱5: 宵闇 (中の敵を斬って大きく混乱させる。自分は強くなる)【混乱】"
    - "※ 闇の帳: 設置の周りの闇の中の敵は、遅くなり、混乱がたまる。自分が中にいると、与えるダメージが増え、受ける攻撃がときどき残像に外れる (味方には効かない)"
