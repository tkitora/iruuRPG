# クラス定義: クレリック (緑 / 耐久力特化。旧名ヒーラー)
# 書き方は classes/warrior.yml を参照。固有スキルのホットキーは全クラス F。

# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
version: 11

id: healer
name: "クレリック✞"
icon: GOLDEN_APPLE
# クラスの紹介 (クラス選択・クラス変更・スキル画面で同じ文言を出す)
catchphrase: "聖なる力は味方だけ"
description:
  - "回復しつつ敵を削る打たれ強いクラス"
features:
  - "緑属性"
  - "高耐久"
  - "回復"

growth:
  max-hp: 3
  element-stats:
    damage:
      green: 0.1

spend:
  max_hp:
    name: "最大HP"
    icon: GOLDEN_APPLE
    description:
      - "最大HPが増える。"
    per-level:
      max-hp: 75
  max_mp:
    name: "最大MP"
    icon: LAPIS_LAZULI
    description:
      - "最大MPが増える。"
    per-level:
      max-mp: 1.5
  resist:
    name: "耐性"
    icon: PRISMARINE_SHARD
    description:
      - "物理と魔法の両方に強くなる。"
    per-level:
      physical-resist: 0.0075
      magic-resist: 0.0075
  green_damage:
    name: "緑属性ダメージ"
    icon: EMERALD
    description:
      - "緑属性の力が増し、回復と敵への反撃が強まる。"
    per-level:
      element-stats:
        damage:
          green: 3.6
  damage_reduction:
    name: "ダメージ軽減"
    icon: IRON_CHESTPLATE
    description:
      - "受けるダメージが減る。"
    per-level:
      damage-reduction: 0.75

# 固有0: 最初から有効なパッシブ (SP不要)
innate:
  - node_name: "加護の手"
    icon: SHIELD
    node_type: passive
    effect_type: skill
    name: healer_guard
    description:
      - "自分が発動した回復に、保護の分だけ倍率が乗る"

milestones:
  # 1: SP 5 (ステータス)
  - node_name: "癒しの祈り"
    icon: GLISTERING_MELON_SLICE
    description:
      - "守りと緑の力が伸びる。"
    node_type: passive
    effect_type: status
    status:
      protection: 4
    element-stats:
      damage-percent:
        green: 8.3
  # 2: SP 10 (クラス特有: 自分が回復した時、周囲の敵に緑属性ダメージ)
  - node_name: "命の反響"
    icon: SCULK_SENSOR
    node_type: passive
    effect_type: skill
    name: healer_pulse
    description:
      - "自分が回復すると、その回復量の一部 (40%) を緑属性のダメージにして周囲の敵に与える (1秒に1回まで、最大体力の15%まで。HP が満タンで入らなかった分は数えない)"
  # 3: SP 15 (ステータス)
  - node_name: "豊かな魔力"
    icon: LAPIS_BLOCK
    description:
      - "緑の力とMP回復が伸びる。"
    node_type: passive
    effect_type: status
    status:
      mp-regen: 8
    element-stats:
      damage-percent:
        green: 8.3
  # 4: SP 20 (クラススキル / F。効果時間のステータスが乗る)
  - node_name: "聖域"
    icon: BEACON
    node_type: active
    hot_key: F
    name: sanctuary
  # 5: SP 25 (ステータス)
  - node_name: "静かな巡り"
    icon: PRISMARINE_CRYSTALS
    description:
      - "MP回復と守りが伸びる。"
    node_type: passive
    effect_type: status
    status:
      mp-regen: 8
      protection: 4
  # 6: SP 30 (クラス特有 = 固有2: 命の反響の範囲が広がり、当たった敵が鈍足40% / コード側 healer_pulse_wide)
  - node_name: "広がる反響"
    icon: AMETHYST_CLUSTER
    node_type: passive
    effect_type: skill
    name: healer_pulse_wide
    description:
      - "命の反響の範囲が広がり、当たった敵の動きが40%遅くなる。"
  # 7: SP 35 (ステータス)
  - node_name: "癒し手の極意"
    icon: ENCHANTED_GOLDEN_APPLE
    description:
      - "守りと緑の力がさらに伸びる。"
    node_type: passive
    effect_type: status
    status:
      protection: 4
    element-stats:
      damage-percent:
        green: 8.3
  # 8: SP 40 (クラススキル強化)
  - node_name: "聖域・極"
    icon: END_CRYSTAL
    node_type: passive
    effect_type: skill
    name: sanctuary_upgrade
    description:
      - "効果時間が長くなり、範囲内はノックバックを受けない。"
      - "発動して数秒後、効果の間に一度だけ再発動できる。"
      - "再発動すると、4秒分の回復が一気に入り、範囲内の敵全員に混乱100を与える。"

# スキル画面の「コンボ解説」(武器の種類ごと)。弱1〜5 / スキル1〜6 (F・Q から始まる 2 つのキーで出す: t138。スキル1〜5 は以前の強1〜強5)、【】は敵への効果。倍率や範囲は書かない
combo-guide:
  melee:
    - "弱1: メイスを振り下ろす"
    - "弱2: 盾で突く【吹き飛ばし】"
    - "弱3: 横から2回振る (当たると少し回復)"
    - "弱4: 振り上げを2回【打ち上げ】"
    - "弱5: 裁きの一撃。聖光を使い切る (1つごとにダメージ・気絶・回復が増える)【気絶】"
    - "小: 盾打ち。踏み込んで盾で殴る。聖光を使い切る【吹き飛ばし・気絶】"
    - "中: 聖なる守り。1.5秒盾を構える (受けるダメージ減、受けるたびに聖光と回復)。再発動で審判の鉄槌【気絶】"
    - "大: 守護の陣。6秒、周りの敵を引きつけ、陣の中の味方を守って回復する。終わりに光がはじける【挑発・吹き飛ばし・気絶】"
    - "util: 盾突進。盾を構えて突進し、敵を押しのける (Shift で後ろへ跳ぶ。ストック2)【吹き飛ばし】"
    - "※ 聖光: 攻撃を受けるとたまる (最大5)。強い一撃が使い切る"
  range:
    - "弱1: 光の雫を落とす (落ちた所の味方を少し回復)"
    - "弱2: 鐘を鳴らし、前へ光の波"
    - "弱3: 敵を追う光の羽を3枚"
    - "弱4: 自分の周りに聖なる輪 (輪の中の味方を回復)"
    - "弱5: 狙った所に審判の鐘が落ちて鳴る (周りの味方を回復)"
    - "小: 癒しの光。見ている味方 (いなければ自分) を回復し、周りの敵に光 (ストック2)"
    - "中: 祝福。自分と周りの味方の与ダメージが増え、被ダメージが減る"
    - "大: 聖鐘。狙った所に光の鐘を置き、3回鳴って味方を回復し、敵を遅くする。聖句を使い切って回復が増える。再発動で鐘を自分の所へ呼び、大きく鳴らす【鈍足・吹き飛ばし】"
    - "util: 光の歩み。前へ光になって進む (Shift で後ろ)。元いた所に癒しの印"
    - "※ 聖句: 弱攻撃が当たるとたまる (最大5)。大の鐘が使い切る"
  deploy:
    - "弱1: ランタンから光の矢を2本"
    - "弱2: 祝福の鐘 (聖域の中の味方の与ダメージ増)"
    - "弱3: 加護の帳 (聖域の中の味方の被ダメージ減)【吹き飛ばし】"
    - "弱4: 癒しの雨 (聖域の中の味方を回復)"
    - "弱5: 裁き。聖域の中の敵に光の柱"
    - "※ 聖域: 設置の周りにできる。中に立っていると静謐がたまり (最大5)、中のプレイヤーが強くなって回復する。出ると0"
