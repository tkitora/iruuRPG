# クラス定義: クレリック (緑 / 耐久力特化。旧名ヒーラー)
# 書き方は classes/warrior.yml を参照。固有スキルのホットキーは全クラス F。

# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
version: 8

id: healer
name: "クレリック✞"
icon: GOLDEN_APPLE
# クラスの紹介 (クラス選択・クラス変更・スキル画面で同じ文言を出す)
catchphrase: "聖なる力は味方だけ"
description:
  - "回復しつつ敵を削る打たれ強いクラス"
features:
  - "緑属性"
  - "高耐久"
  - "回復"

growth:
  max-hp: 3
  element-stats:
    damage:
      green: 0.1

spend:
  max_hp:
    name: "最大HP"
    icon: GOLDEN_APPLE
    description:
      - "最大HPが増える。"
    per-level:
      max-hp: 75
  max_mp:
    name: "最大MP"
    icon: LAPIS_LAZULI
    description:
      - "最大MPが増える。"
    per-level:
      max-mp: 1.5
  resist:
    name: "耐性"
    icon: PRISMARINE_SHARD
    description:
      - "物理と魔法の両方に強くなる。"
    per-level:
      physical-resist: 0.0075
      magic-resist: 0.0075
  green_damage:
    name: "緑属性ダメージ"
    icon: EMERALD
    description:
      - "緑属性の力が増し、回復と敵への反撃が強まる。"
    per-level:
      element-stats:
        damage:
          green: 3.6
  damage_reduction:
    name: "ダメージ軽減"
    icon: IRON_CHESTPLATE
    description:
      - "受けるダメージが減る。"
    per-level:
      damage-reduction: 0.75

# 固有0: 最初から有効なパッシブ (SP不要)
innate:
  - node_name: "加護の手"
    icon: SHIELD
    node_type: passive
    effect_type: skill
    name: healer_guard
    description:
      - "自分が発動した回復に、保護の分だけ倍率が乗る"

milestones:
  # 1: SP 5 (ステータス)
  - node_name: "癒しの祈り"
    icon: GLISTERING_MELON_SLICE
    description:
      - "守りと緑の力が伸びる。"
    node_type: passive
    effect_type: status
    status:
      protection: 4
    element-stats:
      damage-percent:
        green: 8.3
  # 2: SP 10 (クラス特有: 自分が回復した時、周囲の敵に緑属性ダメージ)
  - node_name: "命の反響"
    icon: SCULK_SENSOR
    node_type: passive
    effect_type: skill
    name: healer_pulse
    description:
      - "自分が回復すると、周囲の敵に緑属性のダメージを与える"
  # 3: SP 15 (ステータス)
  - node_name: "豊かな魔力"
    icon: LAPIS_BLOCK
    description:
      - "緑の力とMP回復が伸びる。"
    node_type: passive
    effect_type: status
    status:
      mp-regen: 8
    element-stats:
      damage-percent:
        green: 8.3
  # 4: SP 20 (クラススキル / F。効果時間のステータスが乗る)
  - node_name: "聖域"
    icon: BEACON
    node_type: active
    hot_key: F
    name: sanctuary
  # 5: SP 25 (ステータス)
  - node_name: "静かな巡り"
    icon: PRISMARINE_CRYSTALS
    description:
      - "MP回復と守りが伸びる。"
    node_type: passive
    effect_type: status
    status:
      mp-regen: 8
      protection: 4
  # 6: SP 30 (クラス特有 = 固有2: 命の反響の範囲が広がり、当たった敵が鈍足40% / コード側 healer_pulse_wide)
  - node_name: "広がる反響"
    icon: AMETHYST_CLUSTER
    node_type: passive
    effect_type: skill
    name: healer_pulse_wide
    description:
      - "命の反響の範囲が広がり、当たった敵の動きが40%遅くなる。"
  # 7: SP 35 (ステータス)
  - node_name: "癒し手の極意"
    icon: ENCHANTED_GOLDEN_APPLE
    description:
      - "守りと緑の力がさらに伸びる。"
    node_type: passive
    effect_type: status
    status:
      protection: 4
    element-stats:
      damage-percent:
        green: 8.3
  # 8: SP 40 (クラススキル強化)
  - node_name: "聖域・極"
    icon: END_CRYSTAL
    node_type: passive
    effect_type: skill
    name: sanctuary_upgrade
    description:
      - "効果時間が長くなり、範囲内はノックバックを受けない。"
      - "発動して数秒後、効果の間に一度だけ再発動できる。"
      - "再発動すると、4秒分の回復が一気に入り、範囲内の敵全員に混乱100を与える。"

# スキル画面の「コンボ解説」(武器の種類ごと)。弱1〜5 / スキル1〜6 (F・Q から始まる 2 つのキーで出す: t138。スキル1〜5 は以前の強1〜強5)、【】は敵への効果。倍率や範囲は書かない
combo-guide:
  melee:
    - "弱1: 地面を叩く【吹き飛ばし】"
    - "弱2: 光の波動を2回"
    - "弱3: 癒しの聖なる輪"
    - "弱4: 光の突きを2回"
    - "弱5: 跳んで叩きつける【吹き飛ばし】"
    - "スキル1: 足元に癒しの聖域"
    - "スキル2: 光の盾で殴る【鈍足】"
    - "スキル3: 回転する祈り"
    - "スキル4: 狙った所に光の柱"
    - "スキル5: 広い聖域の輪"
    - "スキル6: 光の鉄槌 (近くの味方を回復)"
  range:
    - "弱1: 癒しの光弾を2連射"
    - "弱2: 癒しの光弾を3連射"
    - "弱3: 光のビームで貫く"
    - "弱4: 追尾する光を4つ"
    - "弱5: 炸裂する光の槍"
    - "スキル1: 祝福の陣を置く"
    - "スキル2: 光の雨"
    - "スキル3: 敵から敵へ連鎖する光"
    - "スキル4: 光の柱"
    - "スキル5: 天から降り注ぐ光線"
    - "スキル6: 癒しの光輪 (味方を回復)【吹き飛ばし】"
    - "※ 弱攻撃は、自分と近くの味方も回復する"
  deploy:
    - "弱1: 癒しの波のランタン"
    - "弱2: 二重の波の大ランタン"
    - "弱3: 速い波の祈りのランタン"
    - "弱4: 三連の波のランタン"
    - "弱5: 広い波の大ランタン"
    - "スキル1: 足元に癒しの聖域"
    - "スキル2: 癒しのランタンを4つ"
    - "スキル3: 膨らんで炸裂する光球"
    - "スキル4: 光を撃つランタンを4つ"
    - "スキル5: 大聖域"
    - "スキル6: 祈りの灯台 (味方を回復)"
    - "※ 弱攻撃のランタンは、1つずつ置き換わる"
