# クラス定義: ギフテッド (白 / 近接・遠距離・設置ダメージ特化)
# 書き方は classes/warrior.yml を参照。固有スキルのホットキーは全クラス F。
#
# 消費ノードの - 側 (筋力% や属性ダメージなど) は、+側の1SPあたりと同じ価値だけ減らす初期案。

id: gifted
name: "ギフテッド"
icon: NETHER_STAR

growth:
  melee-damage: 0.8
  range-damage: 0.8
  deploy-damage: 0.8

spend:
  melee_percent:
    name: "近接特化"
    icon: IRON_SWORD
    per-level:
      melee-damage-percent: 1.3
      strength-percent: -3.9
      element-stats:
        damage:
          red: -65
  range_percent:
    name: "遠距離特化"
    icon: BOW
    per-level:
      range-damage-percent: 1.3
      magic-percent: -3.9
      element-stats:
        damage:
          blue: -65
  deploy_percent:
    name: "設置特化"
    icon: SEA_LANTERN
    per-level:
      deploy-damage-percent: 1.3
      stability: 1
      crit-chance: -1.3
      crit-damage: -4.5
  all_damage:
    name: "全能の才"
    icon: NETHER_STAR
    per-level:
      melee-damage: 20
      range-damage: 20
      deploy-damage: 20
  move_speed:
    name: "移動速度"
    icon: FEATHER
    per-level:
      move-speed: 0.5

milestones:
  # 1: SP 5 (ステータス)
  - node_name: "才能の萌芽"
    icon: AMETHYST_SHARD
    node_type: passive
    effect_type: status
    status:
      melee-damage-percent: 7
      range-damage-percent: 7
  # 2: SP 10 (クラス特有: 全ての攻撃で出血を付与)
  - node_name: "深い傷"
    icon: REDSTONE
    node_type: passive
    effect_type: skill
    name: gifted_bleed
    description:
      - "全ての攻撃で出血を与える"
  # 3: SP 15 (ステータス)
  - node_name: "才能の開花"
    icon: GLOWSTONE_DUST
    node_type: passive
    effect_type: status
    status:
      range-damage-percent: 7
      deploy-damage-percent: 10.5
  # 4: SP 20 (クラススキル / F)
  - node_name: "本能開放"
    icon: BEACON
    node_type: active
    hot_key: F
    name: instinct_release
  # 5: SP 25 (ステータス)
  - node_name: "天賦の輝き"
    icon: NETHER_STAR
    node_type: passive
    effect_type: status
    status:
      deploy-damage-percent: 10.5
      melee-damage-percent: 7
  # 6: SP 30 (クラス特有: 全ての攻撃で腐食・腐敗を付与)
  - node_name: "蝕む才"
    icon: WITHER_ROSE
    node_type: passive
    effect_type: skill
    name: gifted_decay
    description:
      - "全ての攻撃で腐食と腐敗を与える"
  # 7: SP 35 (ステータス)
  - node_name: "天才の証"
    icon: DIAMOND
    node_type: passive
    effect_type: status
    status:
      melee-damage-percent: 7
      range-damage-percent: 7
  # 8: SP 40 (クラススキル強化)
  - node_name: "本能開放・極"
    icon: END_CRYSTAL
    node_type: passive
    effect_type: skill
    name: instinct_release_upgrade
    description:
      - "裂傷の数値が2倍になる"
