# クラス定義: レンジャー (白 / 近接・遠距離・設置ダメージ特化。旧名ギフテッド。内部のidは gifted のまま)
# 書き方は classes/warrior.yml を参照。固有スキルのホットキーは全クラス F。
#
# 消費ノードの - 側 (筋力% や属性ダメージなど) は、+側の1SPあたりと同じ価値だけ減らす初期案。

# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
version: 9

id: gifted
name: "レンジャー🏹"
icon: NETHER_STAR
# クラスの紹介 (クラス選択・クラス変更・スキル画面で同じ文言を出す)
catchphrase: "万能な冒険者"
description:
  - "特に苦手がなく、環境にすぐ適応できるクラス"
features:
  - "苦手なものがない"

growth:
  melee-damage: 0.8
  range-damage: 0.8
  deploy-damage: 0.8

spend:
  melee_percent:
    name: "近接特化"
    icon: IRON_SWORD
    description:
      - "近接の威力が増す。代わりに筋力と赤属性を捨てる。"
    per-level:
      melee-damage-percent: 1.3
      strength-percent: -3.9
      element-stats:
        damage:
          red: -65
  range_percent:
    name: "遠距離特化"
    icon: BOW
    description:
      - "遠距離の威力が増す。代わりに魔力と青属性を捨てる。"
    per-level:
      range-damage-percent: 1.3
      magic-percent: -3.9
      element-stats:
        damage:
          blue: -65
  deploy_percent:
    name: "設置特化"
    icon: SEA_LANTERN
    description:
      - "設置の威力と安定性が増す。代わりに会心を捨てる。"
    per-level:
      deploy-damage-percent: 1.3
      stability: 1
      crit-chance: -1.3
      crit-damage: -4.5
  all_damage:
    name: "全能の才"
    icon: NETHER_STAR
    description:
      - "近接・遠距離・設置の威力がまとめて増える。"
    per-level:
      melee-damage: 20
      range-damage: 20
      deploy-damage: 20
  move_speed:
    name: "移動速度"
    icon: FEATHER
    description:
      - "移動が速くなる。"
    per-level:
      move-speed: 0.5

# 固有0: 最初から有効なパッシブ (SP不要)
innate:
  - node_name: "身辺の設置"
    icon: ARMOR_STAND
    node_type: passive
    effect_type: skill
    name: ranger_self_deploy
    description:
      - "自分の周り半径5ブロックも、自分が置いた設置武器の範囲になる。"

milestones:
  # 1: SP 5 (ステータス)
  - node_name: "才能の萌芽"
    icon: AMETHYST_SHARD
    description:
      - "近接と遠距離の威力が伸びる。"
    node_type: passive
    effect_type: status
    status:
      melee-damage-percent: 7
      range-damage-percent: 7
  # 2: SP 10 (クラス特有 = 固有1: 遠距離の弾が即着弾 / コード側 range_instant)
  - node_name: "神速の弾"
    icon: SPECTRAL_ARROW
    node_type: passive
    effect_type: skill
    name: range_instant
    description:
      - "遠距離武器の射程が伸びる。"
  # 3: SP 15 (ステータス)
  - node_name: "才能の開花"
    icon: GLOWSTONE_DUST
    description:
      - "遠距離と設置の威力が伸びる。"
    node_type: passive
    effect_type: status
    status:
      range-damage-percent: 7
      deploy-damage-percent: 10.5
  # 4: SP 20 (クラススキル / F)
  - node_name: "本能開放"
    icon: BEACON
    node_type: active
    hot_key: F
    name: instinct_release
  # 5: SP 25 (ステータス)
  - node_name: "天賦の輝き"
    icon: NETHER_STAR
    description:
      - "設置と近接の威力が伸びる。"
    node_type: passive
    effect_type: status
    status:
      deploy-damage-percent: 10.5
      melee-damage-percent: 7
  # 6: SP 30 (クラス特有 = 固有2: 近接武器の攻撃で出血 / コード側 gifted_bleed)
  - node_name: "深い傷"
    icon: REDSTONE
    node_type: passive
    effect_type: skill
    name: gifted_bleed
    description:
      - "近接武器で攻撃すると、出血を与える。"
  # 7: SP 35 (ステータス)
  - node_name: "天才の証"
    icon: DIAMOND
    description:
      - "近接と遠距離の威力がさらに伸びる。"
    node_type: passive
    effect_type: status
    status:
      melee-damage-percent: 7
      range-damage-percent: 7
  # 8: SP 40 (クラススキル強化 = 本能開放の再発動: 狙撃)
  - node_name: "本能開放・極"
    icon: END_CRYSTAL
    node_type: passive
    effect_type: skill
    name: instinct_release_upgrade
    description:
      - "本能開放の途中で、一度だけ再発動できる。"
      - "宙に浮いて足もとに魔法陣が広がり、クリックでチャージして、"
      - "高火力の一撃を螺旋のビームで放つ。"
      - "一撃のあと(または10秒後)、地面に戻る。"

# スキル画面の「コンボ解説」(武器の種類ごと)。弱1〜5 / スキル1〜6 (F・Q から始まる 2 つのキーで出す: t138。スキル1〜5 は以前の強1〜強5)、【】は敵への効果。倍率や範囲は書かない
combo-guide:
  melee:
    - "弱1: 素早い2連突き"
    - "弱2: 素早い3連斬り"
    - "弱3: 踏み込み斬り"
    - "弱4: 乱れ斬り"
    - "弱5: 跳びかかり斬り【吹き飛ばし】"
    - "スキル1: 下がって撒菱を撒く【鈍足】"
    - "スキル2: 周囲を低く薙ぐ【吹き飛ばし】"
    - "スキル3: ナイフを3本投げる"
    - "スキル4: 縫い止める斬撃【鈍足】"
    - "スキル5: 直線を駆け抜ける"
    - "スキル6: 跳び込み (着地で周りを打つ)【吹き飛ばし】"
    - "※ 近接で当てると、次の遠距離攻撃が強くなる"
  range:
    - "弱1: 矢を1本【鈍足】"
    - "弱2: 矢を2本同時に【鈍足】"
    - "弱3: 矢を3連射【鈍足】"
    - "弱4: 扇状に5本【吹き飛ばし】"
    - "弱5: 溜めた貫通矢【鈍足】"
    - "スキル1: 跳び退いて射撃【鈍足】 次の矢を強化"
    - "スキル2: 罠を砕く貫通矢"
    - "スキル3: 矢を強化するリング"
    - "スキル4: 追尾矢を4本"
    - "スキル5: 曲射の矢の雨"
    - "スキル6: 速射 (6本)"
    - "※ スキル1の強化には【毒】もある"
    - "※ 当てた敵に【印】: 近接・設置の攻撃が効きやすい"
  deploy:
    - "弱1: 周囲を斬る罠【鈍足】"
    - "弱2: 射撃する罠を2つ"
    - "弱3: 近づくと爆発する地雷【鈍足】"
    - "弱4: 網の罠を3つ【鈍足】"
    - "弱5: 矢の雨"
    - "スキル1: まきびしの陣【鈍足】"
    - "スキル2: 罠の檻で囲む【鈍足】"
    - "スキル3: 罠の壁"
    - "スキル4: 射撃する罠を3つ"
    - "スキル5: 吸い込む大罠【引き寄せ】"
    - "スキル6: 近くの敵を撃つ見張りの弓台【鈍足】"
