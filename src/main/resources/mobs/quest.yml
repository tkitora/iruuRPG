# 依頼用のモブ (架空)。/iruurpg mob <id> で出せる。
# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
version: 2

mobs:
  wild_boar:
    type: PIG
    name: "イノシシ"
    level: 1
    area: [field1]
    experience: 12
    ai: true
    gravity: true
    persistent: true
    remove-when-far-away: false
    show-health: true
    # スキル: strike=地面を叩く / sweep=前方を薙ぐ / barrage=近接だが立ち止まって連射 / dash=突進。ダメージは通常攻撃の damage-rate 倍
    skills:
      - {type: dash, range: 8, damage-rate: 1.3, cooldown-ticks: 160}
    stats:
      max-hp: 60
      max-mp: 1
      defense: 2
      weapon-damage: 4
      strength: 2
    drops:
      boar_meat:
        drop-chance: 60
        amount: 1
      moon_herb:
        drop-chance: 20
        amount: 1
  goblin:
    type: ZOMBIE
    name: "ゴブリン"
    level: 2
    area: [field1]
    experience: 24
    ai: true
    gravity: true
    persistent: true
    remove-when-far-away: false
    show-health: true
    # スキル: strike=地面を叩く / sweep=前方を薙ぐ / barrage=近接だが立ち止まって連射 / dash=突進。ダメージは通常攻撃の damage-rate 倍
    skills:
      - {type: sweep, range: 4, damage-rate: 1.2, cooldown-ticks: 140}
    stats:
      max-hp: 90
      max-mp: 1
      defense: 4
      weapon-damage: 6
      strength: 4
    drops:
      goblin_fang:
        drop-chance: 50
        amount: 1
      moon_herb:
        drop-chance: 25
        amount: 1
