# ビヘイビアツリー+ステートマシンで動く確認用の敵 (behavior: の書き方は docs/mob-behavior.md)。/iruurpg mob bt_sample_zombie で出せる。
# 飛ぶ敵の確認用は /iruurpg mob bt_sample_flyer (navigation: fly、volume、立体の EQS、waypoints の巡回)。
# このファイルの版。jar の方が大きいと、サーバー上の古いファイルは .bak に退避されて入れ替わる
version: 4

mobs:
  bt_sample_zombie:
    type: ZOMBIE
    name: "BTサンプル・ゾンビ"
    level: 1
    area: [training]
    experience: 0
    ai: true
    gravity: true
    fire-proof: true
    persistent: true
    remove-when-far-away: false
    show-health: true
    description:
      - "ビヘイビアツリー+ステートマシンの確認用。頭の上に、状態・動いているノード・目標・HPが出る。"
    skills:
      - {type: strike, radius: 3, damage-rate: 1.3, cooldown-ticks: 200}
    stats:
      max-hp: 200
      max-mp: 1
      defense: 10
      strength: 6
      weapon-damage: 6
    equipment:
      main-hand:
        item: training_sword

    # ---- 行動: mode を legacy にするか、この behavior: を消すと、これまでの動きに戻る ----
    behavior:
      mode: bt
      debug: true              # 頭の上に、状態とツリーの動いている場所を出す
      tick-interval: 4         # 何tickに1回ツリーを動かすか
      aggro-range: 18          # この距離に入ったプレイヤーを目標にする
      blackboard:              # 最初から持っておく値
        taunted: false

      # 場所を選ぶ問い合わせ (EQS): 候補を作る -> テストで点をつける・外す -> 一番良い場所を取る
      eqs:
        flank_spot:            # 目標のまわりの、目標から見える横の場所
          generator: {type: ring, around: target, radius: 4.5, points: 12}
          tests:
            - {type: distance, to: self, prefer: near, weight: 1.0}
            - {type: line-of-sight, to: target, filter: true}
            - {type: crowd, value: 3, max: 1, filter: true}
            - {type: pathable}
          pick: random-top
          top: 3
        surround_spot:         # 囲い込み: 目標のまわりで、仲間のいない角度の場所 (仲間が複数いると散らばる)
          generator: {type: ring, around: target, radius: 3.5, points: 16}
          tests:
            - {type: spread, to: target, value: 70, weight: 2.0}
            - {type: distance, to: self, prefer: near, weight: 0.5}
            - {type: pathable}
        safe_spot:             # 自分のまわりの、目標から遠い場所
          generator: {type: ring, around: self, radius: 9, points: 16}
          tests:
            - {type: distance, to: target, prefer: far, weight: 2.0}
            - {type: pathable}

      fsm:
        initial: idle
        states:
          # 目標がいない: 少し待つ。目標が来たら combat へ
          idle:
            tree:
              type: sequence
              name: 見張り
              children:
                - {type: wait, seconds: 1.5, random-deviation: 0.5}
            transitions:
              - to: combat
                when: {type: blackboard, key: has-target, op: "==", value: true}

          # 目標がいる: 上から順に試す (selector)
          combat:
            services:
              - {type: update-target, range: 20, interval: 0.5}
            tree:
              type: selector
              name: 戦闘
              children:
                # 1. HP が 25% 以下: 逃げる (HPが減ったら、下の行動を止めて、これに切り替わる)
                - type: sequence
                  name: 逃走
                  decorators:
                    - {type: hp, below: 0.25, abort: lower}
                    - {type: cooldown, seconds: 8}
                  children:
                    - {type: flee, eqs: safe_spot, speed: 1.3}
                    - {type: wait, seconds: 1.0}
                # 2. 近くにいる: 地面叩きのスキル (8秒に1回)
                - type: sequence
                  name: スキル
                  decorators:
                    - {type: distance, max: 3.5}
                    - {type: cooldown, seconds: 8}
                    - {type: group-cooldown, key: smash, seconds: 6, scope: type}
                  children:
                    - {type: face-target}
                    - {type: use-skill, index: 0}
                # 3. 近くにいる: なぐる (同じ目標に同時になぐるのは2体まで。取れなければ、次の枝で目標のまわりに散らばる)
                - type: sequence
                  name: 近接
                  decorators:
                    - {type: distance, max: 2.6}
                    - {type: slot, name: melee, max: 2, hold: 3, per: target}
                    - {type: cooldown, seconds: 0.4}
                  children:
                    - {type: face-target}
                    - {type: attack, rate: 1.0}
                    - {type: wait, seconds: 0.9}
                # 3.5 近くに仲間がいて枠が取れない: 目標のまわりの空いた角度へ回り込んで待つ
                - type: sequence
                  name: 囲い込み
                  decorators:
                    - {type: distance, max: 7}
                    - {type: allies, radius: 8, min: 1}
                  children:
                    - {type: move-to, eqs: surround_spot, speed: 1.1, acceptance: 1.0}
                    - {type: face-target}
                    - {type: wait, seconds: 0.8, random-deviation: 0.3}
                # 4. 少し離れていて見えている: 横へ回り込む (10秒に1回、4秒まで)
                - type: sequence
                  name: 回り込み
                  decorators:
                    - {type: distance, min: 6, max: 14}
                    - {type: line-of-sight}
                    - {type: cooldown, seconds: 10}
                    - {type: time-limit, seconds: 4}
                  children:
                    - {type: move-to, eqs: flank_spot, speed: 1.2, acceptance: 1.2}
                # 5. それ以外: 目標に向かって歩く
                - {type: move-to, target: target, speed: 1.0, acceptance: 2.0, name: 追跡}
            transitions:
              - to: idle
                when: {type: blackboard, key: has-target, op: "==", value: false}

  # ---- 飛ぶ敵の確認用: 出した場所のまわりの円柱 (半径 16、上 14・下 2) の中を飛ぶ。/iruurpg btdebug で、経路 (白) と範囲 (青) が見える ----
  bt_sample_flyer:
    type: BLAZE
    name: "BTサンプル・飛行"
    level: 1
    area: [training]
    experience: 0
    ai: true
    gravity: false
    fire-proof: true
    persistent: true
    remove-when-far-away: false
    show-health: true
    description:
      - "飛ぶ敵のビヘイビアツリーの確認用。見張りは空中の巡回、戦闘は上空を回って急降下して殴る。"
    stats:
      max-hp: 150
      max-mp: 1
      defense: 5
      strength: 5
      weapon-damage: 5

    behavior:
      mode: bt
      debug: true
      aggro-range: 16
      navigation: {mode: fly, speed: 6}       # walk (既定) | fly。speed は速さ 1 のときの、1秒に飛ぶブロック数
      volume: {shape: cylinder, radius: 16, up: 14, down: 2}   # 動ける範囲 (出た場所が中心)。cylinder | sphere | box
      blackboard: {attack-range: 2.4}
      waypoints:
        lap:                                   # 出た場所から見た点 [x, y, z]。loop で一周 (back-and-forth で行って戻る)
          points: [[8, 6, 0], [0, 8, 8], [-8, 6, 0], [0, 4, -8]]
          mode: loop
      eqs:
        sky_spot:                              # 目標の上空 4〜7 ブロック、まわりの見える場所
          generator: {type: ring, around: target, radius: 5, points: 10, offset-y: 5.5, layers: 3, height: 1.5}
          tests:
            - {type: height, value: 5, weight: 1.0}
            - {type: line-of-sight, to: target, filter: true}
            - {type: distance, to: self, prefer: near, weight: 0.5}
            - {type: pathable}
          pick: random-top
          top: 3

      fsm:
        initial: patrol
        states:
          patrol:
            tree: {type: patrol, route: lap, speed: 0.6, wait: 0.5, name: 巡回}
            transitions:
              - to: combat
                when: {type: blackboard, key: has-target, op: "==", value: true}
          combat:
            services:
              - {type: update-target, range: 20, interval: 0.5}
            tree:
              type: selector
              name: 戦闘
              children:
                # 近い: 殴って、上空へ戻る
                - type: sequence
                  name: 急降下
                  decorators:
                    - {type: distance, max: 2.4}
                    - {type: cooldown, seconds: 1.5}
                  children:
                    - {type: attack, rate: 1.0}
                    - {type: move-to, eqs: sky_spot, speed: 1.0, acceptance: 1.2, face: true, timeout: 4}
                # 上空で様子を見てから、目標へ降りる
                - type: sequence
                  name: 上空
                  children:
                    - {type: move-to, eqs: sky_spot, speed: 0.9, acceptance: 1.2, face: true, timeout: 4}
                    - {type: wait, seconds: 0.8, random-deviation: 0.3}
                    - {type: move-to, target: target, speed: 1.4, acceptance: 1.8, timeout: 4, name: 降下}
            transitions:
              - to: patrol
                when: {type: blackboard, key: has-target, op: "==", value: false}
