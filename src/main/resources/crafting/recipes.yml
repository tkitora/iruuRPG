# クラフトのレシピ (架空)。/craft で開く。素材を持っていれば、リストから選んで、カンカンして完成する。
#
# result:             完成品の元になるアイテム (items/craft.yml など)
# ingredients:        素材のアイテムID: 数
# min-craft-level:    必要なクラフトレベル
# bonus-pool:         ランダムに付く強化の候補 (ステータス名のリスト)
#   付くかどうか・何個付くかはクラフトレベルで変わり、何も付かないこともある。
#   値は 1 から「そのレベルでの上限」までの完全ランダム。上限は config.yml の crafting: で、
#   いまのゲームの装備の強さ (レベルごとの基準) に合わせて決まる

recipes:
  craft_fang_sword:
    name: "牙の剣"
    result: craft_fang_sword
    ingredients:
      goblin_fang: 3
      moon_herb: 1
    min-craft-level: 1
    bonus-pool:
      - strength
      - melee-damage
      - crit-chance
      - attack-speed
  craft_fang_dagger:
    name: "牙の短剣"
    result: craft_fang_dagger
    ingredients:
      goblin_fang: 2
      boar_meat: 1
    min-craft-level: 1
    bonus-pool:
      - strength
      - melee-damage
      - crit-chance
      - crit-damage
      - attack-speed
  craft_herb_staff:
    name: "月光草の杖"
    result: craft_herb_staff
    ingredients:
      moon_herb: 4
      goblin_fang: 1
    min-craft-level: 2
    bonus-pool:
      - magic
      - range-damage
      - max-mp
      - mp-regen
  craft_fang_helm:
    name: "牙の兜"
    result: craft_fang_helm
    ingredients:
      goblin_fang: 4
      boar_meat: 1
    min-craft-level: 2
    bonus-pool:
      - max-hp
      - defense
      - damage-reduction
  craft_herb_leggings:
    name: "月光草の脚当て"
    result: craft_herb_leggings
    ingredients:
      moon_herb: 3
      boar_meat: 2
    min-craft-level: 3
    bonus-pool:
      - max-hp
      - defense
      - hp-regen
      - move-speed
