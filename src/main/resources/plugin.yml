name: iruuRPG
version: '${version}'
main: net.tkgon.mc.iruuRPG.IruuRPG
api-version: '1.20'
commands:
  iruurpg:
    description: iruuRPG admin and debug command
    usage: /iruurpg <status|stats|class|level|reload|item|mob|dummy>
  stats:
    description: Opens your iruuRPG status menu
    usage: /stats
    aliases:
      - stat
      - rpgstats
  class:
    description: Opens your iruuRPG class skill tree
    usage: /class
    aliases:
      - classes
      - skilltree
      - tree
  craft:
    description: Opens the crafting list
    usage: /craft [level <n>]
    aliases:
      - crafting
  party:
    description: Parties (menu, invite, accept, leave, kick, leader, disband, list, chat)
    usage: /party [invite <name> | accept | deny | leave | kick <name> | leader <name> | disband | list | chat <message>]
    aliases:
      - pt
  pc:
    description: Talk to your party only
    usage: /pc <message>
  dungeon:
    description: Instance dungeons (menu, enter, leave; admins build them)
    usage: /dungeon [enter <id> | leave | edit [id] | build|entry|spawn|spawns|clearspawns|save|new|reload ...]
  trade:
    description: Trade items and gold with another player
    usage: /trade <player> | accept [player] | deny [player]
  market:
    description: Opens the free market (buy / sell items for gold)
    usage: /market
    aliases:
      - fm
      - freemarket
  quest:
    description: Opens the quest board (and quest helpers)
    usage: /quest [board [town]] | money [add n] | reset | reroll
    aliases:
      - board
  tutorialstart:
    description: Starts the debug tutorial at your position
    usage: /tutorialstart
    permission: iruurpg.admin
  tutorialstop:
    description: Stops the debug tutorial and cleans up
    usage: /tutorialstop
    permission: iruurpg.admin
permissions:
  iruurpg.admin:
    description: Allows iruuRPG admin commands
    default: op
