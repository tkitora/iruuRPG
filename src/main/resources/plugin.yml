name: iruuRPG
version: '${version}'
main: net.tkgon.mc.iruuRPG.IruuRPG
api-version: '1.20'
softdepend: [FastAsyncWorldEdit, WorldEdit]
commands:
  iruurpg:
    description: iruuRPG admin and debug command
    usage: /iruurpg <status|stats|class|level|reload|item|mob|dummy>
  menu:
    description: Opens the iruuRPG menu; "/menu toggle" hides or shows the menu item in the hotbar
    usage: /menu [toggle|hide|show]
    aliases:
      - rpgmenu
  stats:
    description: Opens your iruuRPG status menu
    usage: /stats
    aliases:
      - stat
      - rpgstats
  class:
    description: Opens your iruuRPG class skill tree
    usage: /class
    aliases:
      - classes
      - skilltree
      - tree
  craft:
    description: Opens the crafting list
    usage: /craft [level <n>]
    aliases:
      - crafting
  skilltest:
    description: Plays a skill from skills/*.yml (or a template) so you can look at it (admins)
    usage: /skilltest <id> [self|dummy|mine] [element]
    permission: iruurpg.admin
  iruumodel:
    description: Models of Blockbench (.bbmodel) on mobs - list, build the pack, look at one, uninstall
    usage: /iruumodel <list|reload|build|demo|play|clear|uninstall>
    permission: iruurpg.admin
  proceduraltool:
    description: "Procedural tool (admins): trees, rocks, spikes, crystals. Gives the tool; set, save, load, undo"
    usage: /proceduraltool [give|off|menu|kind|set|info|save|load|list|delete|undo|redo|preview|generate]
    aliases:
      - treetool
      - ptree
      - ptool
    permission: iruurpg.admin
  bgm:
    description: "Background music: your volume for everyone; songs, music boxes (volumes) and tests for admins. /bgm help"
    usage: /bgm [volume|now|wand|pos1|pos2|create|redefine|set|remove|list|info|tp|show|play|stop|songs|reload]
  vfx:
    description: "Look at the light flow particle effects (admins): list, help <id>, test <id> <x> <y> <z> <seconds> [args]"
    usage: /vfx <list|help|test>
    permission: iruurpg.admin
  screenfx:
    description: "Screen effects drawn by the client's shaders (admins): /screenfx <effect> [strength 1-255] [seconds] [target], <effect> off, off, status, list"
    usage: /screenfx <bloom|off|status|list> ...
    permission: iruurpg.admin
  ibrush:
    description: "Painting brush for builders (admins): gives the brush item, opens its menu, settings by command, presets, blacklist, undo/redo. /ibrush help for the arguments"
    usage: /ibrush [help|give|menu|off|undo|redo|use|peek|preview|set|preset|blacklist]
    aliases:
      - irubrush
    permission: iruurpg.admin
  storage:
    description: Opens your storage (admins; players use the ender chests around the world)
    usage: /storage
  travel:
    description: Fast travel to points you have found (admins place them)
    usage: /travel [id] | set <id> [name] | remove <id> | list
    aliases:
      - ft
  showitem:
    description: Show the item in your hand to everyone (or write [item] in chat)
    usage: /showitem
    aliases:
      - si
  party:
    description: Parties (menu, invite, accept, leave, kick, leader, disband, list, chat)
    usage: /party [invite <name> | accept | deny | leave | kick <name> | leader <name> | disband | list | chat <message>]
    aliases:
      - pt
  p:
    description: Talk to your party only
    usage: /p <message>
  pc:
    description: Talk to your party only (same as /p)
    usage: /pc <message>
  dungeon:
    description: Instance dungeons (menu, enter, leave; admins build them)
    usage: /dungeon [enter <id> | leave | edit [id] | build|entry|spawn|spawns|clearspawns|save|new|reload ...]
  spawner:
    description: "Field mob spawners (admins only: edit mode, list, reload; blocks = find, light up and delete the game's own spawner blocks)"
    usage: /spawner [edit | list | reload | blocks [radius]]
    permission: iruurpg.admin
  trade:
    description: Trade items and gold with another player
    usage: /trade <player> | accept [player] | deny [player]
  market:
    description: Opens the free market (buy / sell items for gold)
    usage: /market
    aliases:
      - fm
      - freemarket
  npc:
    description: "NPCs of the quest lines (admins only): edit mode, list, reload, name / rename / idle / look / tp"
    usage: /npc [edit | list | reload | name | rename | idle | look | tp] ...
    permission: iruurpg.admin
  questline:
    description: "The buttons under an NPC's quest offer (accept / decline)"
    usage: /questline accept <line> | decline
  itemmigration:
    description: "The move to weapons and armor that never stack (admins only): status, restore a player's backup"
    usage: /itemmigration status | restore <player> [backup]
    permission: iruurpg.admin
  questadmin:
    description: "Quest lines (admins only): look at / start / move / flag / pause / reset a player's quest lines, try events, reload"
    usage: /questadmin <info|start|step|flag|pause|resume|reset|talk|event|reload|warnings> ...
    permission: iruurpg.admin
  quest:
    description: Opens the quest board (and quest helpers)
    usage: /quest [board [town]] | money [add n] | reset | reroll
    aliases:
      - board
  tutorialstart:
    description: Starts the debug tutorial at your position
    usage: /tutorialstart
    permission: iruurpg.admin
  tutorialstop:
    description: Stops the debug tutorial and cleans up
    usage: /tutorialstop
    permission: iruurpg.admin
permissions:
  iruurpg.admin:
    description: Allows iruuRPG admin commands
    default: op
